<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>しゅがけストーキング — 路地</title>
<style>
/* ============================================================
   しゅがけストーキング — 路地の画面

   ハート3個。なくなったら GAME OVER。
     ・子供にぶつかる      → ハート -1
     ・男にぶつかる        → ハート -1、掴まる（連打でほどく）
     ・女にぶつかる        → 叫ばれて、どこかの列に監視がつく
     ・監視中の列に居続ける → 見つかってトウカの画面へ（即 GAME OVER の場所）
     ・空き缶 / おにぎり   → スコア
     ・マンホールに飛び込む → 次のステージへ
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000}
body{user-select:none;-webkit-user-select:none;overscroll-behavior:none;touch-action:none}
/* 1ドットが必ず整数個の実ピクセルになるよう、JS 側で位置と大きさを決める。
   端数があるとドットの大きさが揃わず、輪郭がガタつく（ジャギの正体） */
#screen{position:fixed;left:0;top:0;display:block;
  image-rendering:pixelated;image-rendering:crisp-edges}
/* 画面ガラスの映り込みだけ。格子は見づらいのでやめた */
#glass{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background-image:
    radial-gradient(120% 85% at 50% 8%, rgba(255,255,255,.10), rgba(0,0,0,0) 55%),
    radial-gradient(130% 100% at 50% 50%, rgba(0,0,0,0) 60%, rgba(48,26,40,.22) 100%);
}
#devToggle,#seToggle{position:fixed;top:calc(6px + env(safe-area-inset-top));z-index:3;
  width:24px;height:24px;border:none;border-radius:6px;background:rgba(0,0,0,.25);
  color:rgba(255,255,255,.45);font:13px/24px system-ui;text-align:center;cursor:pointer}
#devToggle{right:6px}
#seToggle{right:34px}
#seToggle.off{color:rgba(255,255,255,.18)}
#dev{position:fixed;top:calc(34px + env(safe-area-inset-top));right:6px;z-index:3;display:none;
  flex-direction:column;gap:5px;padding:8px;background:rgba(0,0,0,.82);border-radius:8px}
#dev.on{display:flex}
#dev input,#dev button{font:600 11px/1.5 system-ui;color:#e8dce6;background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.16);border-radius:6px;padding:6px 9px;outline:none;cursor:pointer}
#debug{font:9.5px/1.4 ui-monospace,Consolas,monospace;color:#9fe8c8;white-space:pre;margin:0}
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="glass"></div>
<button id="seToggle">♪</button>
<button id="devToggle">≡</button>
<div id="dev">
  <input id="tSeed" placeholder="seed" spellcheck="false">
  <button id="tStage">開始ステージ: 1</button>
  <button id="tFall">落下を見る</button>
  <button id="tSewer">下水を見る</button>
  <button id="tClimb">昇りを見る</button>
  <button id="tTouka">トウカを見る</button>
  <button id="tDbg">DEBUG</button>

/* ============================================================
   スプライト — スーファミの流儀にならい、1体につき最大15色＋透過。
   ドット絵は文字列の配列で持つ。1文字が1ドットで、文字が色番号。
   ".":透過 / 各キャラのパレットは SPR.<名前>.pal に持たせる
   ============================================================ */
/* スプライトは一度だけ焼いて、以後は貼るだけにする。
   1ドットずつ fillRect すると、126x140 のミナリだけで毎フレーム1万回以上
   呼ぶことになり、この画面だけで60fpsの予算を使い切る。
   1:1 で貼るので色は混ざらず、純度の規律はそのまま保たれる */
const _baked = new WeakMap();
function bake(spr){
  let pair = _baked.get(spr);
  if(pair) return pair;
  const rows = spr.px, w = rows[0].length, h = rows.length;
  const make = flip => {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const g = c.getContext("2d");
    for(let r=0;r<h;r++){
      const line = rows[r];
      let c0 = -1, cur = null;
      const flush = end => {
        if(c0<0 || !cur) return;
        g.fillStyle = cur; g.fillRect(c0, r, end-c0, 1); c0 = -1; cur = null;
      };
      for(let x=0;x<w;x++){
        const ch = line[flip ? w-1-x : x];
        const col = ch==="." ? null : spr.pal[ch];
        if(col !== cur){ flush(x); cur = col; c0 = col ? x : -1; }
      }
      flush(w);
    }
    return c;
  };
  pair = [make(false), make(true)];
  _baked.set(spr, pair);
  return pair;
}
function blit(spr, x, y, flip){
  const rows = spr.px, w = rows[0].length;
  ctx.drawImage(bake(spr)[flip?1:0],
                Math.round(x - w/2), Math.round(y - rows.length));
}
/** 縮めて置く。k は 1/2 や 1/3 だけにする。
    半端な倍率で間引くと、線の太さが場所によって変わってジャギる */
function blitK(spr, x, y, k, flip){
  const rows = spr.px, w = Math.round(rows[0].length*k), h = Math.round(rows.length*k);
  const sm = ctx.imageSmoothingEnabled;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(bake(spr)[flip?1:0], Math.round(x - w/2), Math.round(y - h), w, h);
  ctx.imageSmoothingEnabled = sm;
}
/** ドット絵の行の長さが揃っているか。ずれると絵が崩れるので起動時に検査する */
function validateSprites(){
  const bad=[];
  for(const [name,s] of Object.entries(SPR)){
    const w=s.px[0].length;
    s.px.forEach((row,i)=>{ if(row.length!==w)
      bad.push(`${name} 行${i}: 幅 ${row.length}（期待 ${w}）`); });
    const used=new Set(); s.px.forEach(r=>[...r].forEach(c=>{ if(c!==".") used.add(c); }));
    used.forEach(c=>{ if(!s.pal[c]) bad.push(`${name}: 色 "${c}" がパレットに無い`); });
    const n=Object.keys(s.pal).length;
    if(n>15) bad.push(`${name}: 色数 ${n}（スーファミ準拠は15色まで）`);
  }
  if(bad.length) console.warn("[スプライト]\n"+bad.join("\n"));
  return bad;
}

/* ============================================================
   解像度を 150x320 から 300x640 へ上げた。細い罫線も本物のフォントも、
   前の解像度では成立しなかった。

   px で表す値は**すべて2倍**にする。秒で表す値はそのまま。
   速度(px/s)も加速度(px/s²)も2倍にすると、
     頂点  = v²/2g  →  (2v)²/(2·2g) = 2倍
     滞空  = 2v/g   →  2(2v)/(2g)   = 変わらない
   なので、跳ぶ高さは倍になり、間合いも譜面も遊びの手触りも一切変わらない。
   数値を手で書き換えず、ここで一括して掛けるのは、
   取りこぼしと書き間違いを避けるため。
   ============================================================ */
const U = 2;
(function scaleToNewResolution(){
  const mul = (o, keys) => keys.forEach(k => { if(typeof o[k]==="number") o[k] *= U; });
  const C = CONFIG;
  mul(C, ["speed"]);
  mul(C.hit, ["depth","cross"]);
  mul(C.spawn, ["itemDist","manholeDist","grace"]);
  for(const k in C.actors) mul(C.actors[k], ["drift","cross","w","h","depth"]);
  mul(C.fall, ["scroll","gap","accel","maxVX","catchR"]);
  const S = C.sewer;
  mul(S, ["speed","gravity","minJump","maxJump","standH","crouchH","bodyW",
          "batW","batH","batStack","batDrift","batSwapGap","batMinGap",
          "cheeseW","cheeseH","cheeseY","cheeseHiY","platLowY",
          "ladderDist","ladderW","ladderLo","platH","platW","platThick","ramp"]);
  for(const k in S.batBands) S.batBands[k] = S.batBands[k].map(b => b.map(v => v*U));
  mul(C.climb, ["total","auto","perTap","swarmStart","swarmSpeed","swarmAccel"]);
  // 譜面。位置も長さも幅も、全部 px
  PATTERNS.forEach(p => { p.len *= U; p.rows.forEach(r => { r.t *= U; }); });
  SEWER.forEach(p => {
    p.len *= U;
    p.bats.forEach(b => { b[0] *= U; });
    p.puddles.forEach(q => { q[0] *= U; q[1] *= U; });
    ["cheese","cheeseHi"].forEach(k => { if(p[k]) p[k] = p[k].map(v => v*U); });
  });
})();

/* 保証則: 各隊形にちょうど1つの正解があり、跳んだ着地点に次が来ないこと */
function validateSewer(){
  const C=CONFIG.sewer, bad=[];
  const apex = C.maxJump*C.maxJump/(2*C.gravity);
  const minApex = C.minJump*C.minJump/(2*C.gravity);
  const head = apex + C.standH;

  // ある高さに立っている／伏せているとき、その帯にぶつかるか
  const hits = (bands,y,h) => bands.some(([lo,hi]) => y < hi && y+h > lo);
  // 帯を抜けられる y があるか（0=接地 〜 最大到達まで刻んで探す）
  const passable = bands => {
    for(let y=0;y<=apex;y+=1) if(!hits(bands,y,C.standH)) return y;
    return -1;
  };
  for(const [name,bands] of Object.entries(C.batBands)){
    const crouchOK = !hits(bands,0,C.crouchH);
    const standOK  = !hits(bands,0,C.standH);
    const y = passable(bands);
    if(standOK) bad.push(`${name}: 走っているだけで抜けられる`);
    if(name==="high"){
      if(!crouchOK) bad.push("high: 伏せても抜けられない");
      if(y>=0)      bad.push("high: 跳んで抜けられてしまう（伏せる一択にならない）");
    } else {
      if(crouchOK)  bad.push(`${name}: 伏せて抜けられてしまう`);
      if(y<0)       bad.push(`${name}: どう跳んでも抜けられない`);
      // 溜め量の精度を要求しない。溜めなしの跳躍で余裕をもって越えられること
      else if(minApex < y + 6)
        bad.push(`${name}: 溜めなしでは越えにくい（頂点${minApex.toFixed(0)}px / 必要${y}px）`);
    }
  }
  if(C.cheeseY <= C.standH) bad.push("チーズが低い（走っているだけで取れる）");
  if(C.cheeseY > head)      bad.push("チーズが高い（最大溜めでも届かない）");
  // 足場は地面から跳んで乗れること。乗らずに下を走り抜けられること（一方通行）
  if(C.platH > apex) bad.push(`足場が高い（最大溜めの頂点${apex.toFixed(0)}px では乗れない）`);
  if(C.platH <= minApex)
    bad.push(`足場が低い（溜めなしの頂点${minApex.toFixed(0)}px で乗れてしまい、選択にならない）`);
  // 梯子は地面からは絶対に届かず、足場の上からなら届くこと
  if(C.ladderLo <= head)
    bad.push(`梯子が低い（地面からの最大到達${head.toFixed(0)}px で届いてしまう）`);
  if(C.ladderLo > C.platH + head)
    bad.push(`梯子が高い（足場${C.platH}px からでも届かない）`);
  if(C.ladderLo <= C.platH + C.standH)
    bad.push("梯子が低い（足場に立っているだけで触れてしまう）");
  // 高いチーズは、足場に乗れば手に入り、地面からだと大きく溜める必要があること
  if(C.cheeseHiY > C.platH + C.standH)
    bad.push("高いチーズが高い（足場に乗っても届かない）");
  if(C.cheeseHiY > head)
    bad.push("高いチーズが高い（地面からはどうやっても取れない）");
  if(C.cheeseHiY <= C.cheeseY)
    bad.push("高いチーズが低い（通常のチーズと変わらない）");
  /* 足場の下の果物。**跳ばずに取れて、足場の上からは取れない**の両方。
     ここが崩れると「下を走る」という選択が消える */
  if(C.platLowY + C.cheeseH > C.standH)
    bad.push("足場下の果物が高い（走っているだけでは届かない）");
  if(C.platLowY + C.cheeseH + 6 > C.platH)
    bad.push("足場下の果物が高い（足場の上を歩いていると拾えてしまう）");
  if(C.platLowY > C.crouchH - 4)
    bad.push("足場下の果物が高い（伏せて通ると拾えない）");

  // 足場の上では伏せても帯を抜けられないこと自体を、ここで明示しておく。
  // だから足場と伏せる隊形は重ねてはいけない（配置側で弾いている）
  if(!C.batBands.high.some(([lo,hi]) => C.platH < hi && C.platH + C.crouchH > lo))
    bad.push("足場の上で伏せれば high を抜けられる（足場と重ねない前提が崩れている）");

  const closing = (C.speed + Math.abs(C.batDrift)) / C.speed;
  SEWER.forEach((p,i)=>{
    const xs = p.bats.map(b=>b[0]).sort((a,b)=>a-b);
    xs.forEach((x,k)=>{
      if(k>0 && x-xs[k-1] < C.batMinGap)
        bad.push(`SEWER${i}: 隊形@${xs[k-1]}と@${x}が近い（${(x-xs[k-1])}px < ${C.batMinGap}px）`);
    });
    // 伏せた直後に跳べ、は繋ぎ目がきつい。この並びだけ広い間隔を要求する
    const ord = [...p.bats].sort((a,b)=>a[0]-b[0]);
    ord.forEach((b,k)=>{
      if(k===0) return;
      const prev = ord[k-1];
      if(prev[1]==="high" && b[1]==="low" && b[0]-prev[0] < C.batSwapGap)
        bad.push(`SEWER${i}: 伏せる@${prev[0]}→跳ぶ@${b[0]}が近い（${b[0]-prev[0]}px < ${C.batSwapGap}px）`);
    });
    p.bats.forEach(b=>{ if(!C.batBands[b[1]]) bad.push(`SEWER${i}: 未知の隊形 ${b[1]}`); });
    // 跳び越えられない水たまりは、跳ぼうとしないよう十分広いこと（中途半端を作らない）
    const reach = (2*C.maxJump/C.gravity)*C.speed;
    p.puddles.forEach(q=>{
      if(q[1] > reach-8 && q[1] < reach+10)
        bad.push(`SEWER${i}: 水たまり幅${q[1]}px が跳べるか微妙（${reach.toFixed(0)}px 前後）`);
    });
    // 跳ぶ隊形の着地点に水たまりが来ないこと（避けようがなくなる）
    p.bats.forEach(b=>{
      if(b[1]==="high") return;
      const land = b[0] + (2*C.maxJump/C.gravity)*C.speed/closing;
      p.puddles.forEach(q=>{
        if(land>q[0]-10 && land<q[0]+q[1]+10)
          bad.push(`SEWER${i}: 隊形@${b[0]}の着地点に水たまり@${q[0]}`);
      });
    });
    [...(p.cheese||[]), ...(p.cheeseHi||[]), ...p.bats.map(b=>b[0])].forEach(x=>{
      if(x<20 || x>p.len-20) bad.push(`SEWER${i}: 端に寄りすぎ (${x})`);
    });
  });
  if(bad.length) console.warn("[保証則/下水]\n"+bad.join("\n"));
  return bad;
}

/* 保証則: どの行にも必ず通れる列が1本ある */
function validatePatterns(){
  const bad=[];
  PATTERNS.forEach((p,i)=>{
    p.rows.forEach(r=>{
      if(r.cells.length!==CONFIG.lanes) bad.push(`P${i} t=${r.t}: 列数 ${r.cells.length}`);
      if(r.cells.every(c=>c!==".")) bad.push(`P${i} t=${r.t}: 全列閉塞`);
    });
    // 同じ列に子供と大人を混ぜない。速さが違うので追いついて重なる
    for(let l=0;l<CONFIG.lanes;l++){
      const kinds=new Set(p.rows.map(r=>r.cells[l]).filter(c=>c!=="."));
      if(kinds.size>1) bad.push(`P${i} 列${l}: 子供と大人が同じ列（速さが違うので重なる）`);
    }
  });
  if(bad.length) console.warn("[保証則]\n"+bad.join("\n"));
  return bad;
}

const hashSeed=s=>{let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;};
const mulberry32=a=>()=>{a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};
let rnd=mulberry32(1);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;

/* 難易度の時計は「その画面に入ってからの時間」で回す（S.screenT）。
   通しの時間で回すと、下水や昇りを挟んで路地へ戻ったときに
   いきなり最高難度から始まる。1画面ごとに登り直す。

   ただし登り直すだけだと、いつまでも同じ坂で、走者はほぼ無限に生き残れる。
   そこで **同じ画面に戻ってくるたびに坂を1割きつくする**。
   同じ時間で難易度が先へ進むようになり、やがて登りきってしまう */
/** ステージごとの厳しさ。1周ごとに CONFIG.stageGain 倍 */
const hard = () => Math.pow(CONFIG.stageGain, Math.max(0, S.stage-1));
/** 生の進み具合。1.0 が「これまでの最高」で、そこから先は overdrive */
const densRaw = () => S.screenT*hard()/CONFIG.ramp;
/** 混み具合 0..1。人の密度・敵の速さ・点の入りはここから */
const dens  = () => clamp(densRaw(), 0, 1);
/** 1.0 を超えたぶん。譜面の上限を突き抜けて、速さと密度に直接乗る */
const over  = () => clamp(densRaw()-1, 0, 2);
/** 監視の激化 0..1。人混みより速く進む。路地を終わらせるのはこちら */
const densW = () => clamp(S.screenT*hard()/CONFIG.watchRamp, 0, 1);
const scoreRate  = () => lerp(CONFIG.scoreRate.far,  CONFIG.scoreRate.near,  dens());
const enemySpeed = () => lerp(CONFIG.enemySpeed.far, CONFIG.enemySpeed.near, dens())
                       * (1 + over()*CONFIG.overdrive);
function toast(txt){ S.toasts.push({txt,life:1.0}); if(S.toasts.length>3) S.toasts.shift(); }

/* ============================================================
   SE — 音は合成する。単一HTMLを保ちたいので、音声ファイルは持たない。
   矩形波と雑音だけで作る。ピコピコの出自がそもそもこれなので、
   絵よりも素直にレトロへ寄る。

   ブラウザは「利用者が触るまで」音を鳴らせないので、最初の入力で起こす。
   ============================================================ */
const SFX = (()=>{
  let ac=null, master=null, on=true;
  const wake = ()=>{
    if(ac) { if(ac.state==="suspended") ac.resume(); return ac; }
    const AC = window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = 0.18;                 // 音量はここ1か所で決める
    master.connect(ac.destination);
    return ac;
  };
  /** 矩形波を1音。周波数は from→to へ滑らせる */
  function tone(from, to, dur, {type="square", vol=1, delay=0}={}){
    if(!on || !ac) return;
    const t0 = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(from, t0);
    if(to !== from) o.frequency.exponentialRampToValueAtTime(Math.max(1,to), t0+dur);
    // 立ち上がりを一瞬にして、余韻を短く切る＝チップ音の質感
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0+dur+0.02);
  }
  let noiseBuf=null;
  /** 雑音。着地・水しぶき・網など「音程を持たない音」に使う */
  function noise(dur, {vol=1, delay=0, hp=0, lp=6000}={}){
    if(!on || !ac) return;
    if(!noiseBuf){
      noiseBuf = ac.createBuffer(1, ac.sampleRate*0.5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      let seed = 1;
      for(let i=0;i<d.length;i++){ seed = (seed*1103515245+12345)&0x7fffffff; d[i]=(seed/0x3fffffff)-1; }
    }
    const t0 = ac.currentTime + delay;
    const src = ac.createBufferSource(); src.buffer = noiseBuf;
    const g = ac.createGain(), f = ac.createBiquadFilter();
    f.type = hp ? "bandpass" : "lowpass";
    f.frequency.value = hp || lp;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0); src.stop(t0+dur+0.02);
  }
  /* 落下と昇りには曲を置かない。ただし無音にはしない。
     短い音を鳴らし続けると忙しないので、**一本の持続音を出しっぱなし**にして、
     そこに手応えの音を重ねる。落下は風、昇りは坑の反響 */
  const AMBI = {
    // 落ちている音。雑音の風ではなく、**続く笛の音**にする。
    // 頭で一度だけ鳴らすのではなく、落ちているあいだ「ぴゅ〜」と伸ばす
    wind:  { tone: 1250, to: 520, vib: 26, vol: 0.085 },
    // 縦坑にこもる音
    pipe:  { lp: 320,  vol: 0.040, wob: 0.10 },
    // 登っている音。手をかけ続けているあいだ鳴らす
    climb: { lp: 700,  vol: 0.085, wob: 0.9  },
  };
  const FOR_AMBI = { falling:"wind", climb:"climb" };
  const live = {};
  function ambStop(name){
    const d = live[name];
    if(!d) return;
    delete live[name];
    try{
      d.g.gain.cancelScheduledValues(ac.currentTime);
      d.g.gain.setTargetAtTime(0.0001, ac.currentTime, 0.10);
      d.src.stop(ac.currentTime + 0.5);
    }catch(e){}
  }
  function ambStart(name){
    if(live[name] || !ac) return;
    const C = AMBI[name];
    if(C.tone){
      // 音程のある持続音。下へ滑らせてから、細かく震わせて伸ばす
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(C.tone, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(C.to, ac.currentTime + 1.4);
      const lfo = ac.createOscillator(), lg = ac.createGain();
      lfo.frequency.value = 5.5; lg.gain.value = C.vib;
      lfo.connect(lg); lg.connect(o.frequency); lfo.start();
      g.gain.setValueAtTime(0.0001, ac.currentTime);
      g.gain.setTargetAtTime(C.vol, ac.currentTime, 0.06);
      o.connect(g); g.connect(master); o.start();
      live[name] = { src:o, g, lfo };
      return;
    }
    if(!noiseBuf) noise(0.001, {vol:0.0001});        // 雑音の元を用意させる
    const src = ac.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    const f = ac.createBiquadFilter(); f.type="lowpass"; f.frequency.value = C.lp;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.setTargetAtTime(C.vol, ac.currentTime, 0.25);
    // 少し揺らす。まったいらな雑音は「音が壊れている」ように聞こえる
    const lfo = ac.createOscillator(), lg = ac.createGain();
    lfo.frequency.value = 0.7; lg.gain.value = C.lp*C.wob;
    lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
    live[name] = { src, g, lfo };
  }

  // 場面ごとの音。名前で呼べるようにして、鳴らす場所には理屈を書かない
  const BANK = {
    move:    ()=> tone(520, 700, 0.045, {vol:0.35}),
    tap:     ()=> tone(340, 340, 0.030, {vol:0.30, type:"triangle"}),
    pick:    ()=>{ tone(880,880,0.05,{vol:0.5}); tone(1320,1320,0.07,{vol:0.45,delay:0.05}); },
    heal:    ()=>{ [660,880,1170].forEach((f,i)=>tone(f,f,0.08,{vol:0.5,delay:i*0.07,type:"triangle"})); },
    hurt:    ()=>{ tone(300,90,0.22,{vol:0.7,type:"sawtooth"}); noise(0.12,{vol:0.35}); },
    scream:  ()=>{ tone(700,1400,0.10,{vol:0.5}); tone(1400,700,0.14,{vol:0.5,delay:0.10}); },
    jump:    ()=> tone(360, 780, 0.11, {vol:0.45}),
    land:    ()=> noise(0.06, {vol:0.30, lp:1400}),
    splash:  ()=>{ noise(0.20,{vol:0.45,hp:900}); tone(500,240,0.14,{vol:0.25,type:"triangle"}); },
    dive:    ()=>{ tone(700,150,0.35,{vol:0.55,type:"triangle"}); noise(0.25,{vol:0.25,lp:800,delay:0.05}); },
    // 落ちはじめ。長く下がる音で「ここから落ちる」と分かる
    fall:    ()=>{ tone(900,120,1.10,{vol:0.40,type:"triangle"});
                   noise(0.9,{vol:0.22,lp:1200,delay:0.05}); },
    // 着地。下水へ出た合図
    thud:    ()=>{ noise(0.22,{vol:0.45,lp:600}); tone(160,70,0.26,{vol:0.4,type:"sawtooth"}); },
    warn:    ()=> tone(1050,1050,0.05,{vol:0.40}),
    throwNet:()=> noise(0.14,{vol:0.35,hp:2200}),
    miss:    ()=> tone(220,220,0.06,{vol:0.30,type:"triangle"}),
    caught:  ()=>{ [520,400,300,200].forEach((f,i)=>tone(f,f,0.13,{vol:0.6,delay:i*0.10,type:"sawtooth"})); },
    over:    ()=>{ [440,330,247,165].forEach((f,i)=>tone(f,f,0.20,{vol:0.55,delay:i*0.16,type:"triangle"})); },
    clear:   ()=>{ [523,659,784,1047].forEach((f,i)=>tone(f,f,0.11,{vol:0.55,delay:i*0.08})); },
    stage:   ()=>{ [784,1047].forEach((f,i)=>tone(f,f,0.10,{vol:0.5,delay:i*0.09})); },
    rung:    ()=>{ tone(1400,900,0.04,{vol:0.28}); noise(0.04,{vol:0.16,hp:3000}); },
    wall:    ()=> noise(0.03,{vol:0.10,lp:2200}),
  };
  return {
    wake,
    play(name){ if(!on) return; wake(); const f=BANK[name]; if(f) f(); },
    /** いま出ている持続音。DEBUG 表示と動作確認に使う */
    ambient(){ return Object.keys(live).join(",")||"none"; },
    /** 画面に合わせた持続音。実時間で毎フレーム呼ぶ（入り切りは中で見る） */
    ambience(scene){
      const want = on ? (FOR_AMBI[scene] || null) : null;
      for(const n in AMBI) if(n !== want) ambStop(n);
      if(want){ wake(); ambStart(want); }
    },
    toggle(){ on=!on; if(on) wake(); else for(const n in AMBI) ambStop(n);
              try{ localStorage.setItem("sugake_se", on?"1":"0"); }catch(e){} return on; },
    get on(){ return on; },
    set on(v){ on=v; },
  };
})();
try{ if(localStorage.getItem("sugake_se")==="0") SFX.on=false; }catch(e){}
const se = n => SFX.play(n);

/* ============================================================
   BGM — 3曲。場所が続いている画面は曲も続ける。
     路地  … 路地 と 落下（マンホールに飛び込んだだけで、まだ路地の続き）
     下水  … 下水 と 昇り（地上へ出るまでは下水の中）
     トウカ … トウカ

   曲は画面ではなく **曲そのもの** で持つ。画面が変わっても同じ曲なら
   鳴らし直さない——落下のたびに路地の曲が頭から始まると、繋がりが切れる。
   ============================================================ */
const BGM = (()=>{
  const SRC = {
    alley: "sounds/路地フェーズ.mp3",
    sewer: "sounds/下水フェーズ.mp3",
    touka: "sounds/トウカフェーズ.mp3",
  };
  /* 落下と昇りは無音。ここに曲を割り当てると、5秒の落下と15秒の昇りを挟むたびに
     切り替えが起きて、常に2曲が混ざって聞こえる */
  const FOR_SCENE = { play:"alley", sewer:"sewer", touka:"touka" };
  const VOL = 0.42, FADE = 0.8;
  const el = {}, pending = {};
  let woke = false, cur = null;

  function get(name){
    if(el[name]) return el[name];
    const a = new Audio(encodeURI(SRC[name]));
    a.loop = true; a.preload = "none"; a.volume = 0;
    el[name] = a;
    return a;
  }
  /* 確実に止める。
     play() が返す約束が解決する前に pause() を呼んでも効かないブラウザがある。
     音量を0にするだけでは、鳴り続けたまま次の曲が重なる。
     約束の完了を待ってから止め、さらに毎フレーム鳴りっぱなしを拾って止め直す */
  function hardStop(name){
    const a = el[name];
    if(!a) return;
    a.volume = 0;
    const stop = ()=>{ try{ a.pause(); a.currentTime = a.currentTime; }catch(e){} };
    if(pending[name] && pending[name].then) pending[name].then(stop, stop);
    stop();
  }
  return {
    /** 画面に合わせて鳴らす。実時間で呼ぶこと（update から呼ぶと早送りされる） */
    follow(scene, dt){
      if(!woke) return;
      const want = SFX.on ? (FOR_SCENE[scene] || null) : null;
      if(want !== cur){
        // 切り替わった瞬間に、他は全部止める。重ねてすれ違わせない
        for(const n in SRC) if(n !== want) hardStop(n);
        cur = want;
        if(want){
          const a = get(want);
          a.volume = 0;
          pending[want] = a.play();
          if(pending[want] && pending[want].catch) pending[want].catch(()=>{});
        }
      }
      // 鳴らしていいのは1本だけ。取りこぼしはここで毎フレーム拾い直す
      for(const n in SRC){
        const a = el[n];
        if(!a || n === cur) continue;
        if(!a.paused || a.volume > 0) hardStop(n);
      }
      if(cur){
        const a = el[cur];
        a.volume = clamp(a.volume + VOL/FADE*dt, 0, VOL);
        if(a.paused){
          pending[cur] = a.play();
          if(pending[cur] && pending[cur].catch) pending[cur].catch(()=>{});
        }
      }
    },
    /** 最初の入力で起こす。ブラウザは触られるまで鳴らせない */
    wake(){ woke = true; },
    /** いま何がどれだけ鳴っているか。DEBUG 表示と動作確認に使う */
    state(){ return Object.keys(el).map(n => n+" "+el[n].volume.toFixed(2)+(el[n].paused?"-":"+")).join(" "); },
    /** 鳴っている本数。2以上なら重なっている */
    playing(){ return Object.keys(el).filter(n => !el[n].paused && el[n].volume > 0.01).length; },
    stop(){ cur=null; for(const n in el) hardStop(n); },
  };
})();

/* ------------------------------------------------------------
   この画面の終わり方。別画面と接続するときはここだけ差し替える。
     "manhole" → 次のステージへ（低リスク低リターン）
     "touka"   → トウカの画面へ（高リスク高リターン。あちらは即 GAME OVER）
     "hearts"  → ハートが尽きた。GAME OVER
   ------------------------------------------------------------ */
function finish(how){
  se(how==="touka" ? "caught" : "over");
  S.screenT=0;
  S.end = how;
  S.score = Math.floor(S.score);
  S.best = Math.max(S.best, S.score);
  try{ localStorage.setItem("sugake_alley_best", String(S.best)); }catch(e){}
  S.scene = "over";
}
function damage(){
  if(S.invuln>0) return false;
  S.hearts--; S.invuln = CONFIG.invuln; S.shake = 4;
  se("hurt");
  if(S.hearts<=0){ finish("hearts"); return true; }
  return false;
}

/* ============================================================
   出現
   ============================================================ */
const laneW=()=>VW/CONFIG.lanes;
const laneX=lf=>laneW()*(lf+0.5);
/** 横切る女がいまどの列に居るか。減速も当たり判定もこの1つで決める。
    画面の外では -1 や 4 を返す。列の番号と一致しないので当たらない */
const womanLane=e=>Math.floor(e.x/laneW());
const add=(kind,at,lane,x,vx)=>S.ents.push({kind,at,lane,x,vx,dead:false});

/** 歩いてくる人。時間が経つほど間隔が詰まる */
function fillCrowd(){
  const gap = lerp(CONFIG.spawn.crowdGapFar, CONFIG.spawn.crowdGapNear, dens())
            / (1 + over()*CONFIG.overdrive);
  // 段位で絞る。混み具合が上がるほど、混んだ譜面が解禁される
  const tier = 1 + dens()*3;
  while(S.cursor < S.dist + VH*1.7){
    const pool = PATTERNS.filter(p=>p.d<=Math.ceil(tier));
    const p = pool[Math.floor(rnd()*pool.length)];
    for(const row of p.rows) row.cells.forEach((c,i)=>{
      if(c===".") return;
      const kind = c==="k"?"kid":"man";
      add(kind, S.cursor+row.t, i);
      // 大人はときどき立ち止まる。到達の間合いが揺れて、同じ譜面でも表情が変わる
      const A=CONFIG.actors[kind];
      if(A.pauseChance && rnd()<A.pauseChance){
        const e=S.ents[S.ents.length-1];
        e.pauseAt = e.at - (40+rnd()*70);
        e.pause = A.pauseSec*(0.7+rnd()*0.6);
      }
    });
    S.cursor += p.len*gap;
  }
}
/** 落ちているもの。歩かないので、時間が経っても速くならない */
function spawnItem(){
  if(S.dist < S.nextItem) return;
  const r=rnd();
  add(r<0.45?"banana":r<0.80?"apple":"cheese", S.dist+VH*1.2, Math.floor(rnd()*CONFIG.lanes));
  S.nextItem = S.dist + CONFIG.spawn.itemDist*(0.7+rnd()*0.6);
}
function spawnWoman(){
  if(S.screenT < S.nextWoman) return;
  const L = rnd()<0.5;
  add("woman", S.dist+VH*0.55, -1, L?-14:VW+14, (L?1:-1)*CONFIG.actors.woman.cross);

  S.nextWoman = S.screenT + lerp(CONFIG.spawn.womanFar, CONFIG.spawn.womanNear, dens())*(0.75+rnd()*0.5);
}
function spawnManhole(){
  if(S.dist < S.nextManhole) return;
  add("manhole", S.dist+VH*1.15, Math.floor(rnd()*CONFIG.lanes));
  S.nextManhole = S.dist + CONFIG.spawn.manholeDist;
}
const watched = lane => S.watches.some(w=>w.lane===lane);
/** 一度に張られる列の数。終盤は 5 列＝全部塞がる */
const perScream = () =>
  clamp(Math.round(lerp(CONFIG.watch.perScreamFar, CONFIG.watch.perScreamNear, densW())), 1, CONFIG.lanes);

/** 監視を n 列に張る。叫ばれたときはミナリのいる列から埋める。
    ただし maxLanes を超えて張らない＝必ず 1 列は逃げ道が残る */
function addWatches(n, onPlayer){
  const life = lerp(CONFIG.watch.lifeFar, CONFIG.watch.lifeNear, densW());
  const room = CONFIG.watch.maxLanes - S.watches.length;
  if(room <= 0) return;
  n = Math.min(n, room);
  const free = [];
  for(let l=0;l<CONFIG.lanes;l++) if(!watched(l)) free.push(l);
  if(onPlayer && free.includes(S.lane)){
    free.splice(free.indexOf(S.lane),1);
    S.watches.push({lane:S.lane, life}); n--;
  }
  while(n-- > 0 && free.length){
    S.watches.push({ lane: free.splice(Math.floor(rnd()*free.length),1)[0], life });
  }
}
/** 叫ばれなくても、粘るほど監視は増えていく */
function spawnWatch(){
  if(S.screenT < S.nextWatch) return;
  addWatches(1, false);
  S.nextWatch = S.screenT + lerp(CONFIG.spawn.watchFar, CONFIG.spawn.watchNear, densW())*(0.8+rnd()*0.4);
}

/* ============================================================
   入力
   ============================================================ */
const touch={down:false,x:0,y:0,dir:0,holdT:0,reps:0,showT:0};
const edge={}, keys={left:false,right:false,hold:false};
function onDown(e){
  SFX.wake(); BGM.wake();           // 触られるまで音は出せない決まりなので、ここで起こす
  const p=e.touches?e.touches[0]:e;
  touch.down=true; touch.holdT=0; touch.reps=0; touch.showT=.4;
  touch.x=p.clientX; touch.y=p.clientY;
  edge.tap=true;                                  // 昇りの連打で使う
  if(S.scene==="title"||S.scene==="over"||S.scene==="brief"){ edge.start=true; return; }
  const r=cv.getBoundingClientRect();
  touch.dir = ((p.clientX-r.left)/r.width*VW) < VW/2 ? -1 : 1;
  // 路地とトウカは 1 タップ 1 列。落下は touch.dir を押しっぱなしで使うので edge は立てない
  // 左右で選ぶ画面。あみだの入口選びもここに含める
  if(S.scene==="play"||S.scene==="touka"||S.scene==="climb")
    edge[touch.dir<0?"left":"right"]=true;
}
function onMove(e){ if(!touch.down)return; const p=e.touches?e.touches[0]:e; touch.x=p.clientX; touch.y=p.clientY; }
function onUp(){ touch.down=false; touch.dir=0; }
function holdRepeat(dt){
  const R=CONFIG.input;
  if(!touch.down||!touch.dir) return;
  touch.holdT+=dt;
  if(touch.holdT<R.repeatDelay) return;
  const n=Math.floor((touch.holdT-R.repeatDelay)/R.repeatInterval);
  if(n>touch.reps){ touch.reps=n; edge[touch.dir<0?"left":"right"]=true; }
}
const cv=document.getElementById("screen");
cv.addEventListener("pointerdown",e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);onDown(e);});
cv.addEventListener("pointermove",e=>{e.preventDefault();onMove(e);});
cv.addEventListener("pointerup",e=>{e.preventDefault();onUp();});
cv.addEventListener("pointercancel",onUp);
const KEYMAP={ArrowLeft:"left",ArrowRight:"right",KeyA:"left",KeyD:"right",
              Enter:"start",Space:"hold",ArrowDown:"hold",KeyS:"hold"};
addEventListener("keydown",e=>{const n=KEYMAP[e.code];if(!n)return;e.preventDefault();
  if(n==="left"&&!keys.left){keys.left=true;edge.left=true;}
  if(n==="right"&&!keys.right){keys.right=true;edge.right=true;}
  if(n==="hold"&&!keys.hold){keys.hold=true;edge.start=true;edge.tap=true;}  // 下水では押しっぱなし＝しゃがみ
  if(n==="start")edge.start=true;});
addEventListener("keyup",e=>{const n=KEYMAP[e.code];if(!n)return;e.preventDefault();
  if(n==="left")keys.left=false; if(n==="right")keys.right=false; if(n==="hold")keys.hold=false;});

/* ============================================================
   更新
   ============================================================ */
/** 路地に入る。ステージをまたいでも t / score / hearts は引き継ぐ（難易度は上がり続ける） */
/* ------------------------------------------------------------
   画面のあいだに挟む一枚。

   切り替わった瞬間から操作が変わるので、知らないまま放り込むと
   「難しい」ではなく「分からない」で失敗する。作りたいのはそれではない。
   次に何をする画面で、どう触るのかだけを出して、触れたら始める。
   ------------------------------------------------------------ */
/* 画面のあいだに挟む一枚。3つを必ず載せる。
     ① いま何が起きたのか（物語）
     ② 何をする画面なのか（操作だけでは足りない）
     ③ 放っておいても始まる（読み終わった人を待たせない）
   タップすれば飛ばせるが、タップしなくても進む。 */
/* 画面のあいだに挟む一枚。**要素は3つだけ**にする。
     ① 帯（いま何が起きたのか）
     ② 図ふたつ（操作と、その画面の肝）
     ③ 放っておいても始まる
   字を並べるほど読まれなくなるので、説明は図で言い切る。 */
const BRIEF = {
  alley:   { band:"にげろ！", secs:5.0,
             a:["tap",  "tap!"],
             b:["cam",  "カメラからかくれろ"],
             c:["hole", "あぶなくなったら飛び込め"] },
  falling: { band:"下水ににげた", secs:4.0,
             a:["hold", "hold!"],
             c:["food", "おにぎりおいしい"] },
  sewer:   { band:"ひそめ！", secs:5.5,
             a:["pair", ""],
             b:["wave", "水たまりをふむとうるさい"],
             c:["ladder", "はしごをつかんでだっしゅつ"] },
  climb:   { band:"のぼれ！", secs:4.5,
             a:["amida", "あみだをよんでえらべ"],
             c:["food",  "おにぎりにつけばラッキー"] },
  touka:   { band:"みつかった！", secs:4.5,
             a:["front", "アミをよけろ"],
             c:["over",  "つかまったらGAME OVER"] },
};
/** 説明を挟んでから画面へ入る。挟むあいだ、難易度の時計は止まっている */
function enterBrief(key){
  S.scene="brief"; S.briefKey=key; S.briefT=0;
}
function briefGo(){
  const k=S.briefKey;
  if(k==="alley")   return gotoAlley();
  if(k==="falling") return gotoFall();
  if(k==="sewer")   return gotoSewer();
  if(k==="climb")   return gotoClimb();
  if(k==="touka")   return gotoTouka();
}
const enterAlley = ()=>enterBrief("alley");
const enterFall  = ()=>enterBrief("falling");
const enterSewer = ()=>enterBrief("sewer");
const enterClimb = ()=>enterBrief("climb");
const enterTouka = ()=>enterBrief("touka");

function gotoAlley(){
  S.scene="play"; S.screenT=0;          // 難易度は入り直すたびに登り直す
  S.invuln=1.4; S.lane=2; S.laneF=2;
  S.ents=[]; S.watches=[]; S.seen=0;
  // 画面の外＋1秒ぶん先から湧かせる。開幕にいきなり目の前へ現れないように
  S.cursor = S.dist + (playerY-HUD_H) + CONFIG.spawn.grace;
  S.nextItem=S.dist+CONFIG.spawn.itemDist;
  S.nextWoman=S.screenT+CONFIG.spawn.womanFar*0.6;
  S.nextWatch=S.screenT+CONFIG.spawn.watchFar;
  S.nextManhole=S.dist+CONFIG.spawn.manholeDist*(S.stage===1?0.55:1);
  fillCrowd();
}
function startRun(){
  const raw=devSeed.value.trim();
  const s = raw?hashSeed(raw):(CONFIG.seed??((Math.random()*4294967296)>>>0));
  S.seed = raw||String(s);
  rnd = mulberry32(s);
  S.stage=Math.max(1,S.startStage);
  S.t=0;
  S.score=0; S.dist=0;
  S.hearts=CONFIG.hearts;
  S.toasts=[]; S.shake=0; S.bang=0; S.end="";
  enterAlley();
}

/* ------------------------------------------------------------
   落下 — マンホールに飛び込んだあと。おにぎりを拾ってハートを取り戻す
   ------------------------------------------------------------ */
function gotoFall(){
  S.scene="falling"; S.screenT=0; S.fallT=0;   // 落ちる音は持続音のほうで鳴る S.fallDist=0; S.healed=0;
  S.fallX=VW/2; S.fallVX=0; S.fallItems=[];
  const total=CONFIG.fall.duration*CONFIG.fall.scroll;
  const M=36;
  /* 落ちてくるもの。**おにぎりは1個だけ**にする。
     何個もあると拾えば必ず回復できてしまい、落下が消化試合になる。
     残りは点になるだけの果物とチーズで、「回復を取りに行くか、点を拾うか」
     を選ばせる */
  const slots=[];
  for(let at=CONFIG.fall.gap; at<total-80; at+=CONFIG.fall.gap) slots.push(at);
  const riceAt = slots.length ? slots[Math.floor(rnd()*slots.length)] : -1;
  for(const at of slots){
    const r=rnd();
    const kind = at===riceAt ? "onigiri" : r<0.45 ? "banana" : r<0.80 ? "apple" : "cheese";
    S.fallItems.push({ at, x: M+rnd()*(VW-M*2), kind, dead:false });
  }
}
/** 落下はレーンを使わない。押している方向へ緩慢に流れるだけ */
function updateFall(dt){
  const F=CONFIG.fall;
  let dir=0;
  if(touch.down) dir=touch.dir;
  if(keys.left)  dir=-1;
  if(keys.right) dir= 1;

  S.fallVX += dir*F.accel*dt;
  S.fallVX -= S.fallVX*F.drag*dt;                    // 手を離しても止まりきらない
  S.fallVX = clamp(S.fallVX, -F.maxVX, F.maxVX);
  S.fallX = clamp(S.fallX + S.fallVX*dt, 10, VW-10);
  if(S.fallX<=10 || S.fallX>=VW-10) S.fallVX=0;

  S.fallT += dt;
  const wallWas = Math.floor(S.fallDist/44);
  S.fallDist += F.scroll*dt;
  if(Math.floor(S.fallDist/44) !== wallWas) se("wall");   // 壁が1つ過ぎた

  for(const it of S.fallItems){
    if(it.dead) continue;
    if(Math.abs(it.at-S.fallDist)<CONFIG.hit.depth && Math.abs(it.x-S.fallX)<F.catchR){
      it.dead=true;
      if(it.kind==="onigiri" && S.hearts<CONFIG.hearts){
        S.hearts++; S.healed++; toast("ハート回復"); se("heal");
      } else {
        const p = CONFIG.score[it.kind] || CONFIG.score.banana;
        S.score+=p; toast("+"+p); se("pick");
      }
    }
  }
  if(S.fallT>=F.duration){ se("thud"); return enterSewer(); }
}

/* ------------------------------------------------------------
   梯子を昇る — 下水から地上へ戻る場面。連打で登る。
   先を行く別の鼠が同じおにぎりを狙っている。速ければ追い越して先に食える
   ------------------------------------------------------------ */
/* ------------------------------------------------------------
   梯子 — あみだくじ。

   連打で登る作りをやめた。連打すれば必ず回復できてしまい、
   遊びとして何も問われていなかった。

   いまは **先にあみだ全体を見せてから、3本のうち1本を選ぶ**。
   選んだら自動で登り、桟のたびに隣の線へ流される。
   どれか1本がおにぎりを通る。**外れても損はしない**——
   ここは移動の間であって、殺す場所ではない。
   ------------------------------------------------------------ */
function gotoClimb(){
  const C=CONFIG.climb;
  S.scene="climb"; S.screenT=0; S.climbY=0; S.climbT=0;
  S.climbPhase="pick";                 // pick=選ぶ / run=登る
  S.climbLine=1;                       // 真ん中から始める
  S.climbPick=C.pickSec;

  // 桟。同じ高さに2本置くと行き先が決まらないので、高さは必ずずらす
  S.amida=[];
  const n=6+Math.floor(rnd()*3);
  for(let i=0;i<n;i++){
    S.amida.push({ h:(0.12+0.76*(i+rnd()*0.6)/n)*C.total,
                   a:Math.floor(rnd()*2) });     // a と a+1 をつなぐ
  }
  S.amida.sort((p,q)=>p.h-q.h);
  // 出口は3つとも中身が決まっている。バナナ・なし・おにぎりを混ぜて置く
  const bag=["banana","", "onigiri"];
  for(let i=bag.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [bag[i],bag[j]]=[bag[j],bag[i]]; }
  S.climbExits=bag;
  S.climbGoal=bag.indexOf("onigiri");
  S.climbItems=[];
}
/** 入口 i から登ったときの出口 */
function amidaEnd(i){
  let l=i;
  for(const r of S.amida){ if(l===r.a) l=r.a+1; else if(l===r.a+1) l=r.a; }
  return l;
}
function updateClimb(dt){
  const C=CONFIG.climb;
  S.climbT += dt;

  if(S.climbPhase==="pick"){
    // 先に全部見えている。読んでから選ぶ。クイズと同じ立ち位置
    if(edge.left)  { S.climbLine=clamp(S.climbLine-1,0,2); se("move"); }
    if(edge.right) { S.climbLine=clamp(S.climbLine+1,0,2); se("move"); }
    S.climbPick -= dt;
    if(S.climbPick<=0){ S.climbPhase="run"; se("tap"); }
    return;
  }

  // 登りは自動。桟に来たら隣の線へ流される
  const was=S.climbY;
  S.climbY += C.climbSpeed*dt;
  // 桟を1つ越えるたびに手をかける音。登っているのが耳でも分かる
  if(Math.floor(was/60)!==Math.floor(S.climbY/60)) se("rung");
  for(const r of S.amida){
    if(was < r.h && S.climbY >= r.h){
      if(S.climbLine===r.a){ S.climbLine=r.a+1; se("move"); }
      else if(S.climbLine===r.a+1){ S.climbLine=r.a; se("move"); }
    }
  }
  if(S.climbY>=C.total){
    // 着いた出口の中身をもらう。なにも無い出口もある
    const got=S.climbExits[S.climbLine];
    if(got==="onigiri"){
      if(S.hearts<CONFIG.hearts){ S.hearts++; S.healed++; toast("ハート回復"); se("heal"); }
      else { S.score+=CONFIG.score.apple; toast("+"+CONFIG.score.apple); se("pick"); }
    } else if(got){
      S.score+=CONFIG.score[got]; toast("+"+CONFIG.score[got]); se("pick");
    }
    se("stage"); S.stage++; enterAlley();
  }
}

/* ------------------------------------------------------------
   トウカフェーズ — 奥から手前へ逃げる。捕まったら即 GAME OVER。
   トウカは自分で追わず、指を差すだけ。差された列にヤツメウナギが網を飛ばす
   ------------------------------------------------------------ */
function gotoTouka(){
  const C=CONFIG.touka;
  S.scene="touka"; S.screenT=0; S.tkT=0;
  // どこから連れて来られたか。逃げ切ったあとの戻り先を決める
  if(S.toukaFrom===undefined) S.toukaFrom="play";
  // 何度目かで、投げきる本数が決まる。二度目・三度目ほど逃げ切りにくい
  S.toukaVisits++;
  S.tkQuota = Math.min(CONFIG.touka.netsMax,
                       CONFIG.touka.netsBase + CONFIG.touka.netsStep*(S.toukaVisits-1));
  S.tkThrown = 0;
  S.tkNets=[]; S.tkPoints=[];
  S.tkDodge=0; S.tkDodgeT=0; S.tkLane=1; S.tkLaneF=1;
  S.tkLane=S.tkLaneF=Math.floor(C.lanes/2);
  S.tkNext=0.9;
  S.flash=0.6; S.shake=4;
}
function updateTouka(dt){
  const C=CONFIG.touka;
  S.tkT += dt;
  // 予告の長さや間隔は、投げきるまでの進み具合で決める
  const k = clamp(S.tkThrown/Math.max(1,S.tkQuota), 0, 1);

  // 逃げ方は路地と別物にする。列を移り住むのではなく、真ん中が定位置で、
  // 触れた側へ「ひょい」と避け、勝手に戻ってくる。
  // 押しっぱなしで居座られると元の遊びに戻ってしまうので holdRepeat は使わない
  const mid = (C.lanes-1)>>1;
  const tele = lerp(C.telegraphFar, C.telegraphNear, k);
  const fly  = lerp(C.netFlyFar, C.netFlyNear, k);
  const live = S.tkNets.some(n=>!n.hit);          // まだ着弾していない網がある

  // 避けの長さは自前の時計で持たない。**投げ1回に対して避け1回**。
  // 網が飛んでいる間は出たまま、着弾したら一拍おいて戻る。
  // 網が速くなれば戻るのも速くなり、次に投げられるときは必ず真ん中に居る
  if(edge.left  && S.tkDodge!==-1){ S.tkDodge=-1; S.tkDodgeT=C.dodgeBeat; se("move"); }
  else if(edge.left)  S.tkDodgeT=C.dodgeBeat;
  if(edge.right && S.tkDodge!== 1){ S.tkDodge= 1; S.tkDodgeT=C.dodgeBeat; se("move"); }
  else if(edge.right) S.tkDodgeT=C.dodgeBeat;
  if(S.tkDodge!==0){
    if(live) S.tkDodgeT = C.dodgeBeat;            // 飛んでいる間は戻らない
    else { S.tkDodgeT -= dt; if(S.tkDodgeT<=0) S.tkDodge=0; }
  }
  S.tkLane = mid + S.tkDodge;
  S.tkLaneF += (S.tkLane-S.tkLaneF)*clamp(C.dodgeSpeed*dt,0,1);

  // 指差し → 網。1回ずつ完結させる。前の網が飛んでいるうちは次を投げない
  // （重なると「戻る前に次が来る」ことになり、投げと避けの1対1が崩れる）
  S.tkNext -= dt;
  if(S.tkNext<=0 && !live){
    // 投げの瞬間は必ず真ん中に居る。避けが残っていてもここで畳む。
    // 飛んでいる網が無いことが条件なので、戻した先で当たることはありえない
    S.tkDodge=0; S.tkDodgeT=0; S.tkLane=mid;
    // まだ当たっていない網は、飛行中でも「塞がっている列」として数える。
    // ここを予告中だけで数えると、全列が同時に塞がる瞬間ができてしまう
    const busy = S.tkNets.filter(n=>!n.hit).map(n=>n.lane);
    const free = [];
    for(let l=0;l<C.lanes;l++) if(!busy.includes(l)) free.push(l);
    // 2本に入ったら、そこから先はずっと2本。増えたり減ったりすると
    // 「今は何本か」を毎回読み直すことになり、反射の勝負にならない
    let n = (k>=C.doubleAt) ? 2 : 1;
    n = Math.min(n, free.length-1);                   // 逃げ場を必ず1列は残す
    // 真ん中が定位置なので、そこを突かないと「見ているだけ」の時間になる。
    // 2本のときに真ん中を外すと、両脇が塞がって「動かないのが正解」になる
    if(n>0 && free.includes(mid) && rnd() < (n===1 ? C.centerBias : C.pairCenter)){
      S.tkNets.push({ lane: mid, age:0, tele, fly });
      free.splice(free.indexOf(mid),1); n--;
    }
    while(n-- > 0 && free.length){
      S.tkNets.push({ lane: free.splice(Math.floor(rnd()*free.length),1)[0], age:0, tele, fly });
    }
    S.tkThrown++;               // 「投げ」の回数。2本同時でも1回と数える
    // 次の予告までを、この周期が終わる時刻から数える
    se("warn");
    S.tkNext = tele + fly + lerp(C.restFar, C.restNear, k)*(0.85+rnd()*0.3);
  }

  // 予告中の列は「すべて」拾う。1つしか持たないと、2本同時のとき片方が無予告で飛ぶ
  S.tkPoints = [];
  for(const net of S.tkNets){
    net.age += dt;
    if(net.age < net.tele) S.tkPoints.push(net.lane);   // 指差し中
    else if(!net.thrown){ net.thrown=true; se("throwNet"); }
    if(!net.hit && net.age >= net.tele + net.fly){
      net.hit = true;
      if(net.lane === S.tkLane) return finish("touka");
      // かわすたびに大きく入る。ここがトウカへ行く見返り
      S.shake = Math.max(S.shake, 2.5); se("miss");
      S.score += CONFIG.touka.dodgeScore; toast("+"+CONFIG.touka.dodgeScore);
    }
  }
  S.tkNets = S.tkNets.filter(n=>n.age < n.tele+n.fly+0.35);

  if(S.tkThrown >= S.tkQuota && S.tkNets.every(n=>n.hit)){
    S.score += C.bonus; toast("+"+C.bonus); se("clear");
    /* 元居た場所の**続き**へ戻す。路地で捕まったなら、そのまま逃げ道の
       落下へ。下水で捕まったなら、地上へ出る梯子へ。
       路地へ直接戻すと、逃げ切ったのに振り出しに立たされて筋が通らない */
    if(S.toukaFrom==="sewer") enterClimb();
    else enterFall();
  }
}

/* ------------------------------------------------------------
   下水 — 横スクロール。入力は1つだけ
     押しっぱなし = しゃがむ（＋ジャンプを溜める） / 放す = 溜めたぶん跳ぶ
   しゃがみ続ければ必ず跳ぶことになるので、いつ放すかがそのまま判断になる
   ------------------------------------------------------------ */
/** 下水の深さ 0..1。潜るほど地形が険しくなる */
const swHeat = () => clamp(S.swDist*hard()/CONFIG.sewer.ramp, 0, 1);
const swSpeed = () => CONFIG.sewer.speed*(1+dens()*0.20+swHeat()*CONFIG.sewer.speedUp);
/** その位置に浮いている足場（一方通行。下からは通り抜ける） */
function platAt(x){
  for(const P of S.swPlats) if(x>P.x0 && x<P.x1) return P;
  return null;
}
function fillSewer(){
  const tier = 1 + swHeat()*3;
  while(S.swCursor < S.swDist + VW*2.4){
    const pool = SEWER.filter(p=>p.d<=Math.ceil(tier));
    const p = pool[Math.floor(rnd()*pool.length)];
    // 蝙蝠は向かって飛んでくるぶん、到達までに手前へ寄る。
    // 譜面に書いた位置で出会うよう、寄る距離を足した所から飛ばす
    const drift = Math.abs(CONFIG.sewer.batDrift);
    for(const b of p.bats){
      // 向かって飛んでくるぶん到達までに手前へ寄る。譜面の位置で出会うよう先から飛ばす
      const at=S.swCursor+b[0], lead=Math.max(0,(at-S.swDist)/swSpeed());
      S.swBats.push({x: at + drift*lead, kind:b[1], dead:false});
    }
    for(const q of p.puddles) S.swPuddles.push({x0:S.swCursor+q[0], x1:S.swCursor+q[0]+q[1], wet:false, wetT:0});
    // 下水にも果物を混ぜる。チーズだけだと拾うものが単調になる
    for(const x of (p.cheese||[])){
      // 多すぎたので間引く。3つに2つだけ置く
      if(rnd()<0.36) continue;
      const r=rnd();
      S.swItems.push({x:S.swCursor+x, y:CONFIG.sewer.cheeseY, dead:false,
                      kind: r<0.40?"banana": r<0.75?"apple":"cheese"});
    }
    for(const x of (p.cheeseHi||[]))
      S.swItems.push({x:S.swCursor+x, y:CONFIG.sewer.cheeseHiY, dead:false, kind:"cheese"});
    S.swCursor += p.len;
  }
  // 梯子は掴みに行かないと掴めないので、隊形と重ならなければよい。
  // 蝙蝠は向かって飛んでくるので、いまの位置ではなく「プレイヤーと出会う位置」で見る
  const meet = bx => S.swDist + (bx-S.swDist)*swSpeed()/(swSpeed()+Math.abs(CONFIG.sewer.batDrift));
  /* 足場の上では伏せられない。伏せても頭が「伏せる隊形」の帯の中に入る。
     つまり足場と伏せる隊形が重なった瞬間、避ける手が無くなる。
     足場の全長と、乗り降りの助走ぶんを空ける。
     跳ぶ隊形は足場の下を通るので、こちらは短い間合いで足りる */
  const spanFree = (x0,x1,kind,pad) =>
    !S.swBats.some(b => b.kind===kind && meet(b.x) > x0-pad && meet(b.x) < x1+pad);
  // 梯子は必ず浮いた足場とセットで置く。足場に乗らないと届かない高さに吊ってあるので、
  // 「跳び乗る → そこからさらに跳ぶ」が揃わないかぎり掴めない。
  // 足場は一方通行なので、乗らずに下を走り抜けることもできる
  const C=CONFIG.sewer;
  for(;;){
    // 必ず画面の外から。蝙蝠を倒して空きができた位置に、目の前で湧くのを防ぐ
    let x = Math.max(S.swNextLadder, S.swDist + VW*1.15), ok=false;
    if(x > S.swDist + VW*2.0) break;
    for(let i=0;i<120;i++){
      if(x+C.platW > S.swCursor-280) break;   // 生成済みの範囲を出たら置かない
      // 端だけでなく**全長**を見る。足場は208pxあるので、端が空いていても
      // 真ん中に隊形が居ることがある
      if(spanFree(x, x+C.platW, "high", 220) && spanFree(x, x+C.platW, "low", 80)){ ok=true; break; }
      x+=16;
    }
    if(!ok) break;                            // 空きが見つからなければ次の生成に持ち越す
    S.swPlats.push({x0:x, x1:x+C.platW, y:C.platH});
    S.swLadders.push({x:x+C.platW*0.74, dead:false});
    /* 足場のまわりに拾いものを置く。**低いほど点が大きい**。
       上を通れば安全だが小さく、下を走れば危ないが大きい。
       これで「足場に乗らずに下を行く」に意味が生まれる。
       下のぶんは platLowY。走り抜けるだけで取れる高さに落としてある。
       前は cheeseY(=跳ばないと届かない高さ)に置いていて、
       下を走ると取れず、上を歩くと勝手に取れる、という逆さまになっていた */
    S.swItems.push({x:x+C.platW*0.34, y:C.cheeseHiY, dead:false, kind:"banana"});  // 上・小
    S.swItems.push({x:x+C.platW*0.62, y:C.platLowY, dead:false, kind:"cheese"});   // 下・大
    S.swNextLadder = x + C.ladderDist;
  }
}

function gotoSewer(){
  S.scene="sewer"; S.screenT=0;
  S.swDist=0; S.swY=0; S.swVY=0; S.swGround=true; S.swCharge=0; S.swHeld=false;
  S.swBats=[]; S.swPuddles=[]; S.swItems=[]; S.swLadders=[]; S.swPlats=[];
  S.swCursor=0; S.swNoise=0;
  S.swNextLadder=CONFIG.sewer.ladderDist*0.8; S.invuln=1.0;
  fillSewer();
}
function updateSewer(dt){
  const C=CONFIG.sewer;
  const held = touch.down || keys.hold;

  S.swDist += swSpeed()*dt;
  // 潜っているだけでも点が入る。路地と同じ理屈にしておかないと、
  // 下水だけ「稼げない画面」になって、急いで抜けるのが最適になる
  S.score += scoreRate()*0.6*dt;
  S.invuln = Math.max(0,S.invuln-dt);
  fillSewer();

  // 静かにしていれば気配は薄れる。ただし潜るほど薄れ方が鈍くなる
  S.swNoise = Math.max(0, S.swNoise - lerp(C.noiseDecayFar, C.noiseDecayNear, swHeat())*dt);

  if(S.swGround){
    if(held) S.swCharge = Math.min(C.maxCharge, S.swCharge+dt);
    else if(S.swHeld){                       // 放した瞬間に跳ぶ
      se("jump");
      S.swVY = lerp(C.minJump, C.maxJump, S.swCharge/C.maxCharge);
      S.swCharge = 0; S.swGround = false;
      S.swY += S.swVY*dt;                    // その場で浮かせる。1フレーム棒立ちにしない
    }
    // 足場の上に立っていて、その端を越えたら落ちる
    if(S.swGround && S.swY>0){
      const p=platAt(S.swDist);
      if(!p || Math.abs(p.y-S.swY)>1){ S.swGround=false; S.swVY=0; }
    }
  } else {
    S.swVY -= C.gravity*dt;
    const prevY = S.swY;
    S.swY += S.swVY*dt;
    // 一方通行。降りてくるときに上面をまたいだ場合だけ乗る（下からは通り抜ける）
    if(S.swVY<0){
      const p=platAt(S.swDist);
      if(p && prevY>=p.y && S.swY<=p.y){ S.swY=p.y; S.swVY=0; S.swGround=true; se("land"); }
    }
    if(!S.swGround && S.swY<=0){ S.swY=0; S.swVY=0; S.swGround=true; se("land"); }
  }
  S.swHeld = held;

  // 水たまり。踏んでもダメージは無いが、水が跳ねてトウカに位置が伝わる
  for(const q of S.swPuddles) if(q.wetT>0) q.wetT-=dt;
  for(const q of S.swPuddles){
    if(q.wet) continue;
    if(S.swDist>q.x0 && S.swDist<q.x1 && S.swY<=1){
      q.wet=true; q.wetT=0.35;
      S.swNoise = Math.min(C.noiseMax, S.swNoise + C.puddleNoise);
      S.shake=Math.max(S.shake,2.4); se("splash"); toast("水を踏んだ");
    }
  }
  // 気配が積もりきると、トウカに位置を掴まれる
  if(S.swNoise >= C.noiseMax){ S.toukaFrom="sewer"; return enterTouka(); }

  // 水に落ちた
  if(S.swY < -34){
    if(damage()) return;
    const g=S.swGaps.find(g=>S.swDist>g.x0 && S.swDist<g.x1);
    S.swDist = g ? g.x1+10 : S.swDist+24;
    S.swY=0; S.swVY=0; S.swGround=true; S.swCharge=0;
    S.invuln=Math.max(S.invuln,1.2); S.shake=4; toast("落ちた");
  }

  const h = (S.swGround && held) ? C.crouchH : C.standH;

  // 蝙蝠の3隊形。ふさぐ帯が違うだけで、判定は共通
  for(const b of S.swBats){
    if(b.dead) continue;
    b.x += C.batDrift*dt;
    if(S.invuln>0) continue;
    if(Math.abs(b.x-S.swDist) > (C.bodyW+C.batW)/2) continue;
    if(C.batBands[b.kind].some(([lo,hi]) => S.swY < hi && S.swY+h > lo)){
      b.dead=true;
      if(damage()) return;
      toast("蝙蝠");
    }
  }
  // チーズ。走っているだけでは届かない。高いほうは段差に乗れば楽に取れる
  for(const it of S.swItems){
    if(it.dead) continue;
    if(Math.abs(it.x-S.swDist) > (C.bodyW+C.cheeseW)/2) continue;
    const cy = it.y;
    if(S.swY+h >= cy && S.swY <= cy+C.cheeseH){
      it.dead=true;
      const p2 = CONFIG.score[it.kind||"cheese"];
      S.score += p2; toast("+"+p2); se("pick");
    }
  }
  // 梯子は地面からは届かない高さ。段差に乗って、そこから跳んだときだけ手が届く
  for(const L of S.swLadders){
    if(L.dead) continue;
    if(Math.abs(L.x-S.swDist) > (C.bodyW+C.ladderW)/2) continue;
    if(S.swY+h >= C.ladderLo){ L.dead=true; se("clear"); return enterClimb(); }
  }

  const back = S.swDist-VW;
  S.swBats    = S.swBats.filter(b=>!b.dead && b.x > back);
  S.swPuddles = S.swPuddles.filter(q=>q.x1 > back);
  S.swItems   = S.swItems.filter(i=>!i.dead && i.x > back);
  S.swLadders = S.swLadders.filter(L=>!L.dead && L.x > back);
  S.swPlats   = S.swPlats.filter(P=>P.x1 > back);
}
function hits(e){
  /* 横切る女は**列に入った時点で当たり**にする。
     以前は中心どうしの距離(±15px)で見ていたが、女はミナリと同じ列では
     linger でほぼ止まる。止まった位置が列の端だと、いつまでも15pxに入らず
     「同じ列に居るのに当たらない」という逆さまなことが起きていた */
  if(e.kind==="woman") return Math.abs(e.at-S.dist)<CONFIG.hit.depth && womanLane(e)===S.lane;
  const d = CONFIG.actors[e.kind]?.depth ?? CONFIG.hit.depth;
  return Math.abs(e.at-S.dist)<d && e.lane===S.lane;
}

/** 監視。見られている時間はミナリ側に1本。
    列ごとに分けると、全列が監視されていても移り続けるだけで避けられてしまう */
function updateWatches(dt){
  for(const w of S.watches) w.life -= dt;
  S.watches = S.watches.filter(w=>w.life>0);

  if(watched(S.lane)) S.seen += dt;
  else                S.seen = Math.max(0, S.seen - dt*CONFIG.watch.cool);

  if(S.seen >= CONFIG.watch.catch){ S.spotT=1.0; S.toukaFrom="play"; enterTouka(); return true; }
  return false;
}

function updatePlay(dt){
  holdRepeat(dt);
  const was=S.lane;
  if(edge.left)  S.lane=clamp(S.lane-1,0,CONFIG.lanes-1);
  if(edge.right) S.lane=clamp(S.lane+1,0,CONFIG.lanes-1);
  if(S.lane!==was) se("move");
  S.laneF += (S.lane-S.laneF)*clamp(CONFIG.player.laneSpeed*dt,0,1);

  S.dist += CONFIG.speed*dt;
  // 生き延びているだけで点が入る。粘るほどレートが上がる＝長く生きた者が報われる
  S.score += scoreRate()*dt;
  S.invuln=Math.max(0,S.invuln-dt);
  fillCrowd(); spawnItem(); spawnWoman(); spawnWatch(); spawnManhole();

  if(updateWatches(dt)) return;   // 見つかった＝トウカの画面へ

  const es=enemySpeed();
  for(const e of S.ents){
    if(e.dead) continue;
    const A=CONFIG.actors[e.kind];
    if(e.kind==="woman"){
      // ミナリが居る列で速さが変わる。読めるので、避け方を考えられる
      const A2=CONFIG.actors.woman;
      const here = womanLane(e);                       // 女がいまいる列
      const ahead = here + (e.vx>0 ? 1 : -1);          // 進む先の列
      const mul = (S.lane===here)  ? A2.linger
                : (S.lane===ahead) ? A2.hurry : 1;
      e.x += e.vx*es*dt*mul;
    }
    else if(A.drift){
      // 立ち止まっている間は動かない
      if(e.pause>0 && e.at<=e.pauseAt) e.pause -= dt;
      else e.at += A.drift*es*dt;                 // 歩く連中だけ速くなる
    }

    if(!hits(e)) continue;

    if(e.kind==="manhole"){ se("dive"); return enterFall(); }   // 飛び込む → 落下

    if(e.kind==="apple" || e.kind==="banana" || e.kind==="cheese"){
      e.dead=true;
      const p = CONFIG.score[e.kind];
      S.score += p; toast("+"+p); se("pick");
      continue;
    }
    if(S.invuln>0) continue;

    if(e.kind==="woman"){ e.dead=true; const n=perScream(); addWatches(n,true);
                          S.shake=4; se("scream"); toast(n>1?`叫ばれた x${n}`:"叫ばれた"); continue; }
    if(e.kind==="kid" || e.kind==="man"){ e.dead=true; if(damage()) return; toast("ぶつかった"); continue; }
  }

  S.ents = S.ents.filter(e=>!e.dead && e.at>S.dist-VH*0.5 && e.at<S.dist+VH*2.4
                            && !(e.kind==="woman"&&(e.x<-30||e.x>VW+30)));
}
function update(dt){
  /* 絵の時計。S.t と違って**どの画面でも必ず進む**。
     コマ送りと点滅だけがこれを見る。
     タイトルと結果の画面では S.t を止めているので、以前はここが
     止まったまま＝トウカが固まっていた */
  S.animT += dt;
  // 終わったら時計を止める。結果の画面で数字が動き続けるのはおかしい
  if(S.scene==="over"||S.scene==="title") {
    /* 揺れはここでも冷ます。捕まった瞬間の揺れを積んだまま抜けるので、
       減らす場所が無いと結果の画面もタイトルも揺れっぱなしになる */
    S.shake=Math.max(0,S.shake-dt*8);
    if(edge.start && S.screenT>0.8){
      S.scene = S.scene==="over" ? "title" : S.scene; S.screenT=0; }
    S.screenT+=dt; if(S.scene==="title"&&edge.start&&S.screenT>0.3) startRun();
    return; }
  // 監視モニタの状態。見張られていれば SEARCHING、捕まれば LOCKED
  S.watched = (S.scene==="play" && S.watches.length>0) || (S.scene==="sewer" && S.swNoise>40);
  S.spotT = Math.max(0, S.spotT-dt);
  if(S.scene==="brief"){
    // 説明のあいだは時計を止める。ここで難易度が進むと、読んだ人が損をする
    S.briefT+=dt;
    S.shake=Math.max(0,S.shake-dt*8);
    const B=BRIEF[S.briefKey];
    // 放っておいても始まる。タップは「もう読んだ」の合図でしかない
    if(S.briefT >= (B?B.secs:4)) return briefGo();
    if(S.briefT>0.5 && (edge.tap||edge.start||edge.left||edge.right)) briefGo();
    return;
  }
  S.t+=dt; S.screenT+=dt;
  S.shake=Math.max(0,S.shake-dt*8);
  S.bang=Math.max(0,S.bang-dt*1.6);
  touch.showT=Math.max(0,touch.showT-dt);
  for(const t of S.toasts) t.life-=dt;
  S.toasts=S.toasts.filter(t=>t.life>0);
  if(S.scene==="falling") return updateFall(dt);
  if(S.scene==="sewer")   return updateSewer(dt);
  if(S.scene==="climb")   return updateClimb(dt);
  if(S.scene==="touka")   return updateTouka(dt);
  if(S.scene==="over"){
    // 一度タイトルへ戻す。すぐ次が始まると、負けたことが流れてしまう
    if(edge.start && S.screenT>0.8){ S.scene="title"; S.screenT=0; }
    return;
  }
  if(S.scene!=="play"){ if(edge.start) startRun(); return; }
  updatePlay(dt);
}

const ctx=cv.getContext("2d",{alpha:false});
let VW=300, VH=640, playerY=0, lastW=0, lastH=0;
const HUD_H=46, FOOT_H=30;      // 上の帯（カメラ番号・時刻）と下の帯（REC・状態）
/** 1ドットを必ず整数個の実ピクセルにする。
    引き伸ばしを画面いっぱいに合わせると倍率が端数になり、3px の点と4px の点が
    混ざって輪郭がガタつく。倍率を先に整数で決め、幅のほうを倍率に合わせる */
function resize(){
  lastW=innerWidth; lastH=innerHeight;
  const w=Math.max(1,innerWidth||1), h=Math.max(1,innerHeight||1);
  const dpr=Math.min(devicePixelRatio||1, 3);
  const scale=Math.max(1, Math.floor(h*dpr/VH));      // 縦を基準に整数倍
  const maxW=Math.floor(w*dpr/scale);
  VW=Math.round(clamp(maxW, VH*0.42, VH*0.80));
  FONT=F8;      // 既定は小さいほう。見出しと数字だけ F12
  cv.width=VW; cv.height=VH;
  ctx.imageSmoothingEnabled=false;
  // CSS 上の大きさも、実ピクセルで整数倍になる値に固定して中央へ置く
  const cw=VW*scale/dpr, chh=VH*scale/dpr;
  cv.style.width=cw+"px"; cv.style.height=chh+"px";
  cv.style.left=Math.round((w-cw)/2)+"px";
  cv.style.top =Math.round((h-chh)/2)+"px";
  playerY=HUD_H+(VH-HUD_H)*CONFIG.player.y;
}
addEventListener("resize",resize);

const px=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w|0,h|0);};
/** 楕円はドットで打つ。ctx.stroke は液晶にない中間色を作る */
function ring(cx,cy,rx,ry,c,thick){
  ctx.fillStyle=c;
  const n=Math.max(14,Math.ceil(Math.max(rx,ry)*6.5));
  for(let i=0;i<n;i++){const a=i/n*6.2832;
    ctx.fillRect(Math.round(cx+Math.cos(a)*rx),Math.round(cy+Math.sin(a)*ry),thick||1,thick||1);}
}
/** 塗りつぶした楕円。足元の影に使う。中間色は作らない */
function blob(cx,cy,rx,ry,c){
  ctx.fillStyle=c;
  for(let y=-ry;y<=ry;y++){
    const w=Math.round(rx*Math.sqrt(Math.max(0,1-(y/ry)*(y/ry))));
    if(w>0) ctx.fillRect(Math.round(cx-w), Math.round(cy+y), w*2, 1);
  }
}
