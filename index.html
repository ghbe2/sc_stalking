<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>しゅがけストーキング — 路地</title>
<style>
/* ============================================================
   しゅがけストーキング — 路地の画面

   ハート3個。なくなったら GAME OVER。
     ・子供にぶつかる      → ハート -1
     ・男にぶつかる        → ハート -1、掴まる（連打でほどく）
     ・女にぶつかる        → 叫ばれて、どこかの列に監視がつく
     ・監視中の列に居続ける → 見つかってトウカの画面へ（即 GAME OVER の場所）
     ・空き缶 / おにぎり   → スコア
     ・マンホールに飛び込む → 次のステージへ
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000}
body{user-select:none;-webkit-user-select:none;overscroll-behavior:none;touch-action:none}
/* 1ドットが必ず整数個の実ピクセルになるよう、JS 側で位置と大きさを決める。
   端数があるとドットの大きさが揃わず、輪郭がガタつく（ジャギの正体） */
#screen{position:fixed;left:0;top:0;display:block;
  image-rendering:pixelated;image-rendering:crisp-edges}
/* 画面ガラスの映り込みだけ。格子は見づらいのでやめた */
#glass{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background-image:
    radial-gradient(120% 85% at 50% 8%, rgba(255,255,255,.10), rgba(0,0,0,0) 55%),
    radial-gradient(130% 100% at 50% 50%, rgba(0,0,0,0) 60%, rgba(48,26,40,.22) 100%);
}
#devToggle,#seToggle{position:fixed;top:calc(6px + env(safe-area-inset-top));z-index:3;
  width:24px;height:24px;border:none;border-radius:6px;background:rgba(0,0,0,.25);
  color:rgba(255,255,255,.45);font:13px/24px system-ui;text-align:center;cursor:pointer}
#devToggle{right:6px}
#seToggle{right:34px}
#seToggle.off{color:rgba(255,255,255,.18)}
#dev{position:fixed;top:calc(34px + env(safe-area-inset-top));right:6px;z-index:3;display:none;
  flex-direction:column;gap:5px;padding:8px;background:rgba(0,0,0,.82);border-radius:8px}
#dev.on{display:flex}
#dev input,#dev button{font:600 11px/1.5 system-ui;color:#e8dce6;background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.16);border-radius:6px;padding:6px 9px;outline:none;cursor:pointer}
#debug{font:9.5px/1.4 ui-monospace,Consolas,monospace;color:#9fe8c8;white-space:pre;margin:0}
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="glass"></div>
<button id="seToggle">♪</button>
<button id="devToggle">≡</button>
<div id="dev">
  <input id="tSeed" placeholder="seed" spellcheck="false">
  <button id="tStage">開始ステージ: 1</button>
  <button id="tFall">落下を見る</button>
  <button id="tSewer">下水を見る</button>
  <button id="tClimb">昇りを見る</button>
  <button id="tTouka">トウカを見る</button>
  <button id="tDbg">DEBUG</button>
  <pre id="debug"></pre>
</div>

/* ============================================================
   スプライト — スーファミの流儀にならい、1体につき最大15色＋透過。
   ドット絵は文字列の配列で持つ。1文字が1ドットで、文字が色番号。
   ".":透過 / 各キャラのパレットは SPR.<名前>.pal に持たせる
   ============================================================ */
function blit(spr, x, y, flip){
  const {pal, px:rows} = spr;
  const w = rows[0].length;
  x = Math.round(x - w/2); y = Math.round(y - rows.length);
  for(let r=0;r<rows.length;r++){
    const line = rows[r];
    for(let c=0;c<w;c++){
      const ch = line[flip ? w-1-c : c];
      if(ch===".") continue;
      const col = pal[ch];
      if(!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(x+c, y+r, 1, 1);
    }
  }
}
/** ドット絵の行の長さが揃っているか。ずれると絵が崩れるので起動時に検査する */
function validateSprites(){
  const bad=[];
  for(const [name,s] of Object.entries(SPR)){
    const w=s.px[0].length;
    s.px.forEach((row,i)=>{ if(row.length!==w)
      bad.push(`${name} 行${i}: 幅 ${row.length}（期待 ${w}）`); });
    const used=new Set(); s.px.forEach(r=>[...r].forEach(c=>{ if(c!==".") used.add(c); }));
    used.forEach(c=>{ if(!s.pal[c]) bad.push(`${name}: 色 "${c}" がパレットに無い`); });
    const n=Object.keys(s.pal).length;
    if(n>15) bad.push(`${name}: 色数 ${n}（スーファミ準拠は15色まで）`);
  }
  if(bad.length) console.warn("[スプライト]\n"+bad.join("\n"));
  return bad;
}

/* 保証則: 各隊形にちょうど1つの正解があり、跳んだ着地点に次が来ないこと */
function validateSewer(){
  const C=CONFIG.sewer, bad=[];
  const apex = C.maxJump*C.maxJump/(2*C.gravity);
  const minApex = C.minJump*C.minJump/(2*C.gravity);
  const head = apex + C.standH;

  // ある高さに立っている／伏せているとき、その帯にぶつかるか
  const hits = (bands,y,h) => bands.some(([lo,hi]) => y < hi && y+h > lo);
  // 帯を抜けられる y があるか（0=接地 〜 最大到達まで刻んで探す）
  const passable = bands => {
    for(let y=0;y<=apex;y+=1) if(!hits(bands,y,C.standH)) return y;
    return -1;
  };
  for(const [name,bands] of Object.entries(C.batBands)){
    const crouchOK = !hits(bands,0,C.crouchH);
    const standOK  = !hits(bands,0,C.standH);
    const y = passable(bands);
    if(standOK) bad.push(`${name}: 走っているだけで抜けられる`);
    if(name==="high"){
      if(!crouchOK) bad.push("high: 伏せても抜けられない");
      if(y>=0)      bad.push("high: 跳んで抜けられてしまう（伏せる一択にならない）");
    } else {
      if(crouchOK)  bad.push(`${name}: 伏せて抜けられてしまう`);
      if(y<0)       bad.push(`${name}: どう跳んでも抜けられない`);
      // 溜め量の精度を要求しない。溜めなしの跳躍で余裕をもって越えられること
      else if(minApex < y + 6)
        bad.push(`${name}: 溜めなしでは越えにくい（頂点${minApex.toFixed(0)}px / 必要${y}px）`);
    }
  }
  if(C.cheeseY <= C.standH) bad.push("チーズが低い（走っているだけで取れる）");
  if(C.cheeseY > head)      bad.push("チーズが高い（最大溜めでも届かない）");
  // 足場は地面から跳んで乗れること。乗らずに下を走り抜けられること（一方通行）
  if(C.platH > apex) bad.push(`足場が高い（最大溜めの頂点${apex.toFixed(0)}px では乗れない）`);
  if(C.platH <= minApex)
    bad.push(`足場が低い（溜めなしの頂点${minApex.toFixed(0)}px で乗れてしまい、選択にならない）`);
  // 梯子は地面からは絶対に届かず、足場の上からなら届くこと
  if(C.ladderLo <= head)
    bad.push(`梯子が低い（地面からの最大到達${head.toFixed(0)}px で届いてしまう）`);
  if(C.ladderLo > C.platH + head)
    bad.push(`梯子が高い（足場${C.platH}px からでも届かない）`);
  if(C.ladderLo <= C.platH + C.standH)
    bad.push("梯子が低い（足場に立っているだけで触れてしまう）");
  // 高いチーズは、足場に乗れば手に入り、地面からだと大きく溜める必要があること
  if(C.cheeseHiY > C.platH + C.standH)
    bad.push("高いチーズが高い（足場に乗っても届かない）");
  if(C.cheeseHiY > head)
    bad.push("高いチーズが高い（地面からはどうやっても取れない）");
  if(C.cheeseHiY <= C.cheeseY)
    bad.push("高いチーズが低い（通常のチーズと変わらない）");

  const closing = (C.speed + Math.abs(C.batDrift)) / C.speed;
  SEWER.forEach((p,i)=>{
    const xs = p.bats.map(b=>b[0]).sort((a,b)=>a-b);
    xs.forEach((x,k)=>{
      if(k>0 && x-xs[k-1] < C.batMinGap)
        bad.push(`SEWER${i}: 隊形@${xs[k-1]}と@${x}が近い（${(x-xs[k-1])}px < ${C.batMinGap}px）`);
    });
    // 伏せた直後に跳べ、は繋ぎ目がきつい。この並びだけ広い間隔を要求する
    const ord = [...p.bats].sort((a,b)=>a[0]-b[0]);
    ord.forEach((b,k)=>{
      if(k===0) return;
      const prev = ord[k-1];
      if(prev[1]==="high" && b[1]==="low" && b[0]-prev[0] < C.batSwapGap)
        bad.push(`SEWER${i}: 伏せる@${prev[0]}→跳ぶ@${b[0]}が近い（${b[0]-prev[0]}px < ${C.batSwapGap}px）`);
    });
    p.bats.forEach(b=>{ if(!C.batBands[b[1]]) bad.push(`SEWER${i}: 未知の隊形 ${b[1]}`); });
    // 跳び越えられない水たまりは、跳ぼうとしないよう十分広いこと（中途半端を作らない）
    const reach = (2*C.maxJump/C.gravity)*C.speed;
    p.puddles.forEach(q=>{
      if(q[1] > reach-8 && q[1] < reach+10)
        bad.push(`SEWER${i}: 水たまり幅${q[1]}px が跳べるか微妙（${reach.toFixed(0)}px 前後）`);
    });
    // 跳ぶ隊形の着地点に水たまりが来ないこと（避けようがなくなる）
    p.bats.forEach(b=>{
      if(b[1]==="high") return;
      const land = b[0] + (2*C.maxJump/C.gravity)*C.speed/closing;
      p.puddles.forEach(q=>{
        if(land>q[0]-10 && land<q[0]+q[1]+10)
          bad.push(`SEWER${i}: 隊形@${b[0]}の着地点に水たまり@${q[0]}`);
      });
    });
    [...(p.cheese||[]), ...(p.cheeseHi||[]), ...p.bats.map(b=>b[0])].forEach(x=>{
      if(x<20 || x>p.len-20) bad.push(`SEWER${i}: 端に寄りすぎ (${x})`);
    });
  });
  if(bad.length) console.warn("[保証則/下水]\n"+bad.join("\n"));
  return bad;
}

/* 保証則: どの行にも必ず通れる列が1本ある */
function validatePatterns(){
  const bad=[];
  PATTERNS.forEach((p,i)=>{
    p.rows.forEach(r=>{
      if(r.cells.length!==CONFIG.lanes) bad.push(`P${i} t=${r.t}: 列数 ${r.cells.length}`);
      if(r.cells.every(c=>c!==".")) bad.push(`P${i} t=${r.t}: 全列閉塞`);
    });
    // 同じ列に子供と大人を混ぜない。速さが違うので追いついて重なる
    for(let l=0;l<CONFIG.lanes;l++){
      const kinds=new Set(p.rows.map(r=>r.cells[l]).filter(c=>c!=="."));
      if(kinds.size>1) bad.push(`P${i} 列${l}: 子供と大人が同じ列（速さが違うので重なる）`);
    }
  });
  if(bad.length) console.warn("[保証則]\n"+bad.join("\n"));
  return bad;
}

const mulberry32=a=>()=>{a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};
let rnd=mulberry32(1);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);

/* 難易度の時計は「その画面に入ってからの時間」で回す（S.screenT）。
   通しの時間で回すと、下水や昇りを挟んで路地へ戻ったときに
   いきなり最高難度から始まる。1画面ごとに登り直す。

   ただし登り直すだけだと、いつまでも同じ坂で、走者はほぼ無限に生き残れる。
   そこで **同じ画面に戻ってくるたびに坂を1割きつくする**。
   同じ時間で難易度が先へ進むようになり、やがて登りきってしまう */
/** ステージごとの厳しさ。1周ごとに CONFIG.stageGain 倍 */
const hard = () => Math.pow(CONFIG.stageGain, Math.max(0, S.stage-1));
/** 生の進み具合。1.0 が「これまでの最高」で、そこから先は overdrive */
const densRaw = () => S.screenT*hard()/CONFIG.ramp;
/** 混み具合 0..1。人の密度・敵の速さ・点の入りはここから */
const dens  = () => clamp(densRaw(), 0, 1);
/** 1.0 を超えたぶん。譜面の上限を突き抜けて、速さと密度に直接乗る */
const over  = () => clamp(densRaw()-1, 0, 2);
/** 監視の激化 0..1。人混みより速く進む。路地を終わらせるのはこちら */
const densW = () => clamp(S.screenT*hard()/CONFIG.watchRamp, 0, 1);
const scoreRate  = () => lerp(CONFIG.scoreRate.far,  CONFIG.scoreRate.near,  dens());
const enemySpeed = () => lerp(CONFIG.enemySpeed.far, CONFIG.enemySpeed.near, dens())
                       * (1 + over()*CONFIG.overdrive);
function toast(txt){ S.toasts.push({txt,life:1.0}); if(S.toasts.length>3) S.toasts.shift(); }

/* ============================================================
   SE — 音は合成する。単一HTMLを保ちたいので、音声ファイルは持たない。
   矩形波と雑音だけで作る。ピコピコの出自がそもそもこれなので、
   絵よりも素直にレトロへ寄る。

   ブラウザは「利用者が触るまで」音を鳴らせないので、最初の入力で起こす。
   ============================================================ */
const SFX = (()=>{
  let ac=null, master=null, on=true;
  const wake = ()=>{
    if(ac) { if(ac.state==="suspended") ac.resume(); return ac; }
    const AC = window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = 0.18;                 // 音量はここ1か所で決める
    master.connect(ac.destination);
    return ac;
  };
  /** 矩形波を1音。周波数は from→to へ滑らせる */
  function tone(from, to, dur, {type="square", vol=1, delay=0}={}){
    if(!on || !ac) return;
    const t0 = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(from, t0);
    if(to !== from) o.frequency.exponentialRampToValueAtTime(Math.max(1,to), t0+dur);
    // 立ち上がりを一瞬にして、余韻を短く切る＝チップ音の質感
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0+dur+0.02);
  }
  let noiseBuf=null;
  /** 雑音。着地・水しぶき・網など「音程を持たない音」に使う */
  function noise(dur, {vol=1, delay=0, hp=0, lp=6000}={}){
    if(!on || !ac) return;
    if(!noiseBuf){
      noiseBuf = ac.createBuffer(1, ac.sampleRate*0.5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      let seed = 1;
      for(let i=0;i<d.length;i++){ seed = (seed*1103515245+12345)&0x7fffffff; d[i]=(seed/0x3fffffff)-1; }
    }
    const t0 = ac.currentTime + delay;
    const src = ac.createBufferSource(); src.buffer = noiseBuf;
    const g = ac.createGain(), f = ac.createBiquadFilter();
    f.type = hp ? "bandpass" : "lowpass";
    f.frequency.value = hp || lp;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0); src.stop(t0+dur+0.02);
  }
  // 場面ごとの音。名前で呼べるようにして、鳴らす場所には理屈を書かない
  const BANK = {
    move:    ()=> tone(520, 700, 0.045, {vol:0.35}),
    tap:     ()=> tone(340, 340, 0.030, {vol:0.30, type:"triangle"}),
    pick:    ()=>{ tone(880,880,0.05,{vol:0.5}); tone(1320,1320,0.07,{vol:0.45,delay:0.05}); },
    heal:    ()=>{ [660,880,1170].forEach((f,i)=>tone(f,f,0.08,{vol:0.5,delay:i*0.07,type:"triangle"})); },
    hurt:    ()=>{ tone(300,90,0.22,{vol:0.7,type:"sawtooth"}); noise(0.12,{vol:0.35}); },
    scream:  ()=>{ tone(700,1400,0.10,{vol:0.5}); tone(1400,700,0.14,{vol:0.5,delay:0.10}); },
    jump:    ()=> tone(360, 780, 0.11, {vol:0.45}),
    land:    ()=> noise(0.06, {vol:0.30, lp:1400}),
    splash:  ()=>{ noise(0.20,{vol:0.45,hp:900}); tone(500,240,0.14,{vol:0.25,type:"triangle"}); },
    dive:    ()=>{ tone(700,150,0.35,{vol:0.55,type:"triangle"}); noise(0.25,{vol:0.25,lp:800,delay:0.05}); },
    warn:    ()=> tone(1050,1050,0.05,{vol:0.40}),
    throwNet:()=> noise(0.14,{vol:0.35,hp:2200}),
    miss:    ()=> tone(220,220,0.06,{vol:0.30,type:"triangle"}),
    caught:  ()=>{ [520,400,300,200].forEach((f,i)=>tone(f,f,0.13,{vol:0.6,delay:i*0.10,type:"sawtooth"})); },
    over:    ()=>{ [440,330,247,165].forEach((f,i)=>tone(f,f,0.20,{vol:0.55,delay:i*0.16,type:"triangle"})); },
    clear:   ()=>{ [523,659,784,1047].forEach((f,i)=>tone(f,f,0.11,{vol:0.55,delay:i*0.08})); },
    stage:   ()=>{ [784,1047].forEach((f,i)=>tone(f,f,0.10,{vol:0.5,delay:i*0.09})); },
  };
  return {
    wake,
    play(name){ if(!on) return; wake(); const f=BANK[name]; if(f) f(); },
    toggle(){ on=!on; if(on) wake(); try{ localStorage.setItem("sugake_se", on?"1":"0"); }catch(e){} return on; },
    get on(){ return on; },
    set on(v){ on=v; },
  };
})();
try{ if(localStorage.getItem("sugake_se")==="0") SFX.on=false; }catch(e){}
const se = n => SFX.play(n);

/* ------------------------------------------------------------
   この画面の終わり方。別画面と接続するときはここだけ差し替える。
     "manhole" → 次のステージへ（低リスク低リターン）
     "touka"   → トウカの画面へ（高リスク高リターン。あちらは即 GAME OVER）
     "hearts"  → ハートが尽きた。GAME OVER
   ------------------------------------------------------------ */
function finish(how){
  se(how==="touka" ? "caught" : "over");
  S.end = how;
  S.score = Math.floor(S.score);
  S.best = Math.max(S.best, S.score);
  try{ localStorage.setItem("sugake_alley_best", String(S.best)); }catch(e){}
  S.scene = "over";
}
function damage(){
  if(S.invuln>0) return false;
  S.hearts--; S.invuln = CONFIG.invuln; S.shake = 4;
  se("hurt");
  if(S.hearts<=0){ finish("hearts"); return true; }
  return false;
}

/* ============================================================
   出現
   ============================================================ */
const laneW=()=>VW/CONFIG.lanes;
const laneX=lf=>laneW()*(lf+0.5);
const add=(kind,at,lane,x,vx)=>S.ents.push({kind,at,lane,x,vx,dead:false});

/** 歩いてくる人。時間が経つほど間隔が詰まる */
function fillCrowd(){
  const gap = lerp(CONFIG.spawn.crowdGapFar, CONFIG.spawn.crowdGapNear, dens())
            / (1 + over()*CONFIG.overdrive);
  while(S.cursor < S.dist + VH*1.7){
    const p = PATTERNS[Math.floor(rnd()*PATTERNS.length)];
    for(const row of p.rows) row.cells.forEach((c,i)=>{
      if(c===".") return;
      const kind = c==="k"?"kid":"man";
      add(kind, S.cursor+row.t, i);
      // 大人はときどき立ち止まる。到達の間合いが揺れて、同じ譜面でも表情が変わる
      const A=CONFIG.actors[kind];
      if(A.pauseChance && rnd()<A.pauseChance){
        const e=S.ents[S.ents.length-1];
        e.pauseAt = e.at - (40+rnd()*70);
        e.pause = A.pauseSec*(0.7+rnd()*0.6);
      }
    });
    S.cursor += p.len*gap;
  }
}
/** 落ちているもの。歩かないので、時間が経っても速くならない */
function spawnItem(){
  if(S.dist < S.nextItem) return;
  add(rnd()<0.72?"can":"rice", S.dist+VH*1.2, Math.floor(rnd()*CONFIG.lanes));
  S.nextItem = S.dist + CONFIG.spawn.itemDist*(0.7+rnd()*0.6);
}
function spawnWoman(){
  if(S.screenT < S.nextWoman) return;
  const L = rnd()<0.5;
  add("woman", S.dist+VH*0.55, -1, L?-14:VW+14, (L?1:-1)*CONFIG.actors.woman.cross);
  S.nextWoman = S.screenT + lerp(CONFIG.spawn.womanFar, CONFIG.spawn.womanNear, dens())*(0.75+rnd()*0.5);
}
function spawnManhole(){
  if(S.dist < S.nextManhole) return;
  add("manhole", S.dist+VH*1.15, Math.floor(rnd()*CONFIG.lanes));
  S.nextManhole = S.dist + CONFIG.spawn.manholeDist;
}
const watched = lane => S.watches.some(w=>w.lane===lane);
/** 一度に張られる列の数。終盤は 5 列＝全部塞がる */
const perScream = () =>
  clamp(Math.round(lerp(CONFIG.watch.perScreamFar, CONFIG.watch.perScreamNear, densW())), 1, CONFIG.lanes);

/** 監視を n 列に張る。叫ばれたときはミナリのいる列から埋める。
    ただし maxLanes を超えて張らない＝必ず 1 列は逃げ道が残る */
function addWatches(n, onPlayer){
  const life = lerp(CONFIG.watch.lifeFar, CONFIG.watch.lifeNear, densW());
  const room = CONFIG.watch.maxLanes - S.watches.length;
  if(room <= 0) return;
  n = Math.min(n, room);
  const free = [];
  for(let l=0;l<CONFIG.lanes;l++) if(!watched(l)) free.push(l);
  if(onPlayer && free.includes(S.lane)){
    free.splice(free.indexOf(S.lane),1);
    S.watches.push({lane:S.lane, life}); n--;
  }
  while(n-- > 0 && free.length){
    S.watches.push({ lane: free.splice(Math.floor(rnd()*free.length),1)[0], life });
  }
}
/** 叫ばれなくても、粘るほど監視は増えていく */
function spawnWatch(){
  if(S.screenT < S.nextWatch) return;
  addWatches(1, false);
  S.nextWatch = S.screenT + lerp(CONFIG.spawn.watchFar, CONFIG.spawn.watchNear, densW())*(0.8+rnd()*0.4);
}

/* ============================================================
   入力
   ============================================================ */
const touch={down:false,x:0,y:0,dir:0,holdT:0,reps:0,showT:0};
const edge={}, keys={left:false,right:false,hold:false};
function onDown(e){
  SFX.wake();                       // 触られるまで音は出せない決まりなので、ここで起こす
  const p=e.touches?e.touches[0]:e;
  touch.down=true; touch.holdT=0; touch.reps=0; touch.showT=.4;
  touch.x=p.clientX; touch.y=p.clientY;
  edge.tap=true;                                  // 昇りの連打で使う
  if(S.scene==="title"||S.scene==="over"){ edge.start=true; return; }
  const r=cv.getBoundingClientRect();
  touch.dir = ((p.clientX-r.left)/r.width*VW) < VW/2 ? -1 : 1;
  // 路地とトウカは 1 タップ 1 列。落下は touch.dir を押しっぱなしで使うので edge は立てない
  if(S.scene==="play"||S.scene==="touka") edge[touch.dir<0?"left":"right"]=true;
}
function onMove(e){ if(!touch.down)return; const p=e.touches?e.touches[0]:e; touch.x=p.clientX; touch.y=p.clientY; }
function onUp(){ touch.down=false; touch.dir=0; }
function holdRepeat(dt){
  const R=CONFIG.input;
  if(!touch.down||!touch.dir) return;
  touch.holdT+=dt;
  if(touch.holdT<R.repeatDelay) return;
  const n=Math.floor((touch.holdT-R.repeatDelay)/R.repeatInterval);
  if(n>touch.reps){ touch.reps=n; edge[touch.dir<0?"left":"right"]=true; }
}
const cv=document.getElementById("screen");
cv.addEventListener("pointerdown",e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);onDown(e);});
cv.addEventListener("pointermove",e=>{e.preventDefault();onMove(e);});
cv.addEventListener("pointerup",e=>{e.preventDefault();onUp();});
cv.addEventListener("pointercancel",onUp);
const KEYMAP={ArrowLeft:"left",ArrowRight:"right",KeyA:"left",KeyD:"right",
              Enter:"start",Space:"hold",ArrowDown:"hold",KeyS:"hold"};
addEventListener("keydown",e=>{const n=KEYMAP[e.code];if(!n)return;e.preventDefault();
  if(n==="left"&&!keys.left){keys.left=true;edge.left=true;}
  if(n==="right"&&!keys.right){keys.right=true;edge.right=true;}
  if(n==="hold"&&!keys.hold){keys.hold=true;edge.start=true;edge.tap=true;}  // 下水では押しっぱなし＝しゃがみ
  if(n==="start")edge.start=true;});
addEventListener("keyup",e=>{const n=KEYMAP[e.code];if(!n)return;e.preventDefault();
  if(n==="left")keys.left=false; if(n==="right")keys.right=false; if(n==="hold")keys.hold=false;});

/* ============================================================
   更新
   ============================================================ */
/** 路地に入る。ステージをまたいでも t / score / hearts は引き継ぐ（難易度は上がり続ける） */
function enterAlley(){
  S.scene="play"; S.screenT=0;          // 難易度は入り直すたびに登り直す
  S.invuln=1.4; S.lane=2; S.laneF=2;
  S.ents=[]; S.watches=[]; S.seen=0;
  // 画面の外＋1秒ぶん先から湧かせる。開幕にいきなり目の前へ現れないように
  S.cursor = S.dist + (playerY-HUD_H) + CONFIG.spawn.grace;
  S.nextItem=S.dist+CONFIG.spawn.itemDist;
  S.nextWoman=S.screenT+CONFIG.spawn.womanFar*0.6;
  S.nextWatch=S.screenT+CONFIG.spawn.watchFar;
  S.nextManhole=S.dist+CONFIG.spawn.manholeDist*(S.stage===1?0.55:1);
  fillCrowd();
}
function startRun(){
  const raw=devSeed.value.trim();
  const s = raw?hashSeed(raw):(CONFIG.seed??((Math.random()*4294967296)>>>0));
  S.seed = raw||String(s);
  rnd = mulberry32(s);
  S.stage=Math.max(1,S.startStage);
  S.t=0;
  S.score=0; S.dist=0;
  S.hearts=CONFIG.hearts;
  S.toasts=[]; S.shake=0; S.bang=0; S.end="";
  enterAlley();
}

/* ------------------------------------------------------------
   落下 — マンホールに飛び込んだあと。おにぎりを拾ってハートを取り戻す
   ------------------------------------------------------------ */
function enterFall(){
  S.scene="falling"; S.screenT=0; S.fallT=0; S.fallDist=0; S.healed=0;
  S.fallX=VW/2; S.fallVX=0; S.fallItems=[];
  const total=CONFIG.fall.duration*CONFIG.fall.scroll;
  const M=18;
  for(let at=CONFIG.fall.gap; at<total-40; at+=CONFIG.fall.gap){
    S.fallItems.push({ at, x: M+rnd()*(VW-M*2), dead:false });   // 位置は完全にランダム
  }
}
/** 落下はレーンを使わない。押している方向へ緩慢に流れるだけ */
function updateFall(dt){
  const F=CONFIG.fall;
  let dir=0;
  if(touch.down) dir=touch.dir;
  if(keys.left)  dir=-1;
  if(keys.right) dir= 1;

  S.fallVX += dir*F.accel*dt;
  S.fallVX -= S.fallVX*F.drag*dt;                    // 手を離しても止まりきらない
  S.fallVX = clamp(S.fallVX, -F.maxVX, F.maxVX);
  S.fallX = clamp(S.fallX + S.fallVX*dt, 10, VW-10);
  if(S.fallX<=10 || S.fallX>=VW-10) S.fallVX=0;

  S.fallT += dt;
  S.fallDist += F.scroll*dt;

  for(const it of S.fallItems){
    if(it.dead) continue;
    if(Math.abs(it.at-S.fallDist)<CONFIG.hit.depth && Math.abs(it.x-S.fallX)<F.catchR){
      it.dead=true;
      if(S.hearts<CONFIG.hearts){ S.hearts++; S.healed++; toast("ハート回復"); se("heal"); }
      else { S.score+=CONFIG.score.rice; toast("+"+CONFIG.score.rice); se("pick"); }
    }
  }
  if(S.fallT>=F.duration) enterSewer();
}

/* ------------------------------------------------------------
   梯子を昇る — 下水から地上へ戻る場面。連打で登る。
   先を行く別の鼠が同じおにぎりを狙っている。速ければ追い越して先に食える
   ------------------------------------------------------------ */
function enterClimb(){
  const C=CONFIG.climb;
  S.scene="climb"; S.screenT=0; S.climbY=0; S.climbT=0; S.healed=0;
  S.climbSwarm = C.swarmStart;
  S.climbItems = C.items.map(h=>({h:h*C.total, who:0}));   // 0=まだ 1=ミナリ 2=群れに食われた
}
function updateClimb(dt){
  const C=CONFIG.climb;
  S.climbT += dt;
  if(edge.tap){ S.climbY += C.perTap; se("tap"); }
  S.climbY += C.auto*dt;
  // 群れは加速しながら這い上がってくる。追いつかれても傷は負わない
  S.climbSwarm += (C.swarmSpeed + C.swarmAccel*S.climbT)*dt;

  for(const it of S.climbItems){
    if(it.who) continue;
    if(S.climbY>=it.h){
      it.who=1;
      if(S.hearts<CONFIG.hearts){ S.hearts++; S.healed++; toast("ハート回復"); }
      else { S.score += CONFIG.score.rice; toast("+"+CONFIG.score.rice); }
    } else if(S.climbSwarm>=S.climbY){        // 追い抜かれたら、先のおにぎりは食われる
      it.who=2; toast("食われた");
    }
  }
  if(S.climbY>=C.total){ se("stage"); S.stage++; enterAlley(); }
}

/* ------------------------------------------------------------
   トウカフェーズ — 奥から手前へ逃げる。捕まったら即 GAME OVER。
   トウカは自分で追わず、指を差すだけ。差された列にヤツメウナギが網を飛ばす
   ------------------------------------------------------------ */
function enterTouka(){
  const C=CONFIG.touka;
  S.scene="touka"; S.screenT=0; S.tkT=0; S.tkNets=[]; S.tkPoints=[];
  S.tkDodge=0; S.tkDodgeT=0; S.tkLane=1; S.tkLaneF=1;
  S.tkLane=S.tkLaneF=Math.floor(C.lanes/2);
  S.tkNext=0.9;
  S.flash=0.6; S.shake=4;
}
function updateTouka(dt){
  const C=CONFIG.touka;
  S.tkT += dt;
  const k = clamp(S.tkT/C.surviveTime, 0, 1);

  // 逃げ方は路地と別物にする。列を移り住むのではなく、真ん中が定位置で、
  // 触れた側へ「ひょい」と避け、勝手に戻ってくる。
  // 押しっぱなしで居座られると元の遊びに戻ってしまうので holdRepeat は使わない
  const mid = (C.lanes-1)>>1;
  const tele = lerp(C.telegraphFar, C.telegraphNear, k);
  const fly  = lerp(C.netFlyFar, C.netFlyNear, k);
  const live = S.tkNets.some(n=>!n.hit);          // まだ着弾していない網がある

  // 避けの長さは自前の時計で持たない。**投げ1回に対して避け1回**。
  // 網が飛んでいる間は出たまま、着弾したら一拍おいて戻る。
  // 網が速くなれば戻るのも速くなり、次に投げられるときは必ず真ん中に居る
  if(edge.left  && S.tkDodge!==-1){ S.tkDodge=-1; S.tkDodgeT=C.dodgeBeat; se("move"); }
  else if(edge.left)  S.tkDodgeT=C.dodgeBeat;
  if(edge.right && S.tkDodge!== 1){ S.tkDodge= 1; S.tkDodgeT=C.dodgeBeat; se("move"); }
  else if(edge.right) S.tkDodgeT=C.dodgeBeat;
  if(S.tkDodge!==0){
    if(live) S.tkDodgeT = C.dodgeBeat;            // 飛んでいる間は戻らない
    else { S.tkDodgeT -= dt; if(S.tkDodgeT<=0) S.tkDodge=0; }
  }
  S.tkLane = mid + S.tkDodge;
  S.tkLaneF += (S.tkLane-S.tkLaneF)*clamp(C.dodgeSpeed*dt,0,1);

  // 指差し → 網。1回ずつ完結させる。前の網が飛んでいるうちは次を投げない
  // （重なると「戻る前に次が来る」ことになり、投げと避けの1対1が崩れる）
  S.tkNext -= dt;
  if(S.tkNext<=0 && !live){
    // 投げの瞬間は必ず真ん中に居る。避けが残っていてもここで畳む。
    // 飛んでいる網が無いことが条件なので、戻した先で当たることはありえない
    S.tkDodge=0; S.tkDodgeT=0; S.tkLane=mid;
    // まだ当たっていない網は、飛行中でも「塞がっている列」として数える。
    // ここを予告中だけで数えると、全列が同時に塞がる瞬間ができてしまう
    const busy = S.tkNets.filter(n=>!n.hit).map(n=>n.lane);
    const free = [];
    for(let l=0;l<C.lanes;l++) if(!busy.includes(l)) free.push(l);
    // 2本に入ったら、そこから先はずっと2本。増えたり減ったりすると
    // 「今は何本か」を毎回読み直すことになり、反射の勝負にならない
    let n = (k>=C.doubleAt) ? 2 : 1;
    n = Math.min(n, free.length-1);                   // 逃げ場を必ず1列は残す
    // 真ん中が定位置なので、そこを突かないと「見ているだけ」の時間になる。
    // 2本のときに真ん中を外すと、両脇が塞がって「動かないのが正解」になる
    if(n>0 && free.includes(mid) && rnd() < (n===1 ? C.centerBias : C.pairCenter)){
      S.tkNets.push({ lane: mid, age:0, tele, fly });
      free.splice(free.indexOf(mid),1); n--;
    }
    while(n-- > 0 && free.length){
      S.tkNets.push({ lane: free.splice(Math.floor(rnd()*free.length),1)[0], age:0, tele, fly });
    }
    // 次の予告までを、この周期が終わる時刻から数える
    se("warn");
    S.tkNext = tele + fly + lerp(C.restFar, C.restNear, k)*(0.85+rnd()*0.3);
  }

  // 予告中の列は「すべて」拾う。1つしか持たないと、2本同時のとき片方が無予告で飛ぶ
  S.tkPoints = [];
  for(const net of S.tkNets){
    net.age += dt;
    if(net.age < net.tele) S.tkPoints.push(net.lane);   // 指差し中
    else if(!net.thrown){ net.thrown=true; se("throwNet"); }
    if(!net.hit && net.age >= net.tele + net.fly){
      net.hit = true;
      if(net.lane === S.tkLane) return finish("touka");
      S.shake = Math.max(S.shake, 2.5); se("miss");
    }
  }
  S.tkNets = S.tkNets.filter(n=>n.age < n.tele+n.fly+0.35);

  if(S.tkT >= C.surviveTime){
    S.score += C.bonus; toast("+"+C.bonus); se("clear");
    S.stage++; enterAlley();
  }
}

/* ------------------------------------------------------------
   下水 — 横スクロール。入力は1つだけ
     押しっぱなし = しゃがむ（＋ジャンプを溜める） / 放す = 溜めたぶん跳ぶ
   しゃがみ続ければ必ず跳ぶことになるので、いつ放すかがそのまま判断になる
   ------------------------------------------------------------ */
/** 下水の深さ 0..1。潜るほど地形が険しくなる */
const swHeat = () => clamp(S.swDist*hard()/CONFIG.sewer.ramp, 0, 1);
const swSpeed = () => CONFIG.sewer.speed*(1+dens()*0.20+swHeat()*CONFIG.sewer.speedUp);
/** その位置に浮いている足場（一方通行。下からは通り抜ける） */
function platAt(x){
  for(const P of S.swPlats) if(x>P.x0 && x<P.x1) return P;
  return null;
}
function fillSewer(){
  const tier = 1 + swHeat()*3;
  while(S.swCursor < S.swDist + VW*2.4){
    const pool = SEWER.filter(p=>p.d<=Math.ceil(tier));
    const p = pool[Math.floor(rnd()*pool.length)];
    // 蝙蝠は向かって飛んでくるぶん、到達までに手前へ寄る。
    // 譜面に書いた位置で出会うよう、寄る距離を足した所から飛ばす
    const drift = Math.abs(CONFIG.sewer.batDrift);
    for(const b of p.bats){
      // 向かって飛んでくるぶん到達までに手前へ寄る。譜面の位置で出会うよう先から飛ばす
      const at=S.swCursor+b[0], lead=Math.max(0,(at-S.swDist)/swSpeed());
      S.swBats.push({x: at + drift*lead, kind:b[1], dead:false});
    }
    for(const q of p.puddles) S.swPuddles.push({x0:S.swCursor+q[0], x1:S.swCursor+q[0]+q[1], wet:false});
    for(const x of (p.cheese||[])) S.swItems.push({x:S.swCursor+x, hi:false, dead:false});
    for(const x of (p.cheeseHi||[])) S.swItems.push({x:S.swCursor+x, hi:true, dead:false});
    S.swCursor += p.len;
  }
  // 梯子は掴みに行かないと掴めないので、隊形と重ならなければよい。
  // 蝙蝠は向かって飛んでくるので、いまの位置ではなく「プレイヤーと出会う位置」で見る
  const meet = bx => S.swDist + (bx-S.swDist)*swSpeed()/(swSpeed()+Math.abs(CONFIG.sewer.batDrift));
  const clear = x => !S.swBats.some(b=>Math.abs(meet(b.x)-x)<70);
  // 梯子は必ず浮いた足場とセットで置く。足場に乗らないと届かない高さに吊ってあるので、
  // 「跳び乗る → そこからさらに跳ぶ」が揃わないかぎり掴めない。
  // 足場は一方通行なので、乗らずに下を走り抜けることもできる
  const C=CONFIG.sewer;
  for(;;){
    // 必ず画面の外から。蝙蝠を倒して空きができた位置に、目の前で湧くのを防ぐ
    let x = Math.max(S.swNextLadder, S.swDist + VW*1.15), ok=false;
    if(x > S.swDist + VW*2.0) break;
    for(let i=0;i<80;i++){
      if(x+C.platW > S.swCursor-140) break;   // 生成済みの範囲を出たら置かない
      if(clear(x) && clear(x+C.platW)){ ok=true; break; }
      x+=12;
    }
    if(!ok) break;                            // 空きが見つからなければ次の生成に持ち越す
    S.swPlats.push({x0:x, x1:x+C.platW, y:C.platH});
    S.swLadders.push({x:x+C.platW*0.74, dead:false});
    // 足場の上には高いチーズも置く。梯子を取らなくても、乗る価値がある
    S.swItems.push({x:x+C.platW*0.34, hi:true, dead:false});
    S.swNextLadder = x + C.ladderDist;
  }
}

function enterSewer(){
  S.scene="sewer"; S.screenT=0;
  S.swDist=0; S.swY=0; S.swVY=0; S.swGround=true; S.swCharge=0; S.swHeld=false;
  S.swBats=[]; S.swPuddles=[]; S.swItems=[]; S.swLadders=[]; S.swPlats=[];
  S.swCursor=0; S.swNoise=0;
  S.swNextLadder=CONFIG.sewer.ladderDist*0.8; S.invuln=1.0;
  fillSewer();
}
function updateSewer(dt){
  const C=CONFIG.sewer;
  const held = touch.down || keys.hold;

  S.swDist += swSpeed()*dt;
  S.invuln = Math.max(0,S.invuln-dt);
  fillSewer();

  // 静かにしていれば気配は薄れる。ただし潜るほど薄れ方が鈍くなる
  S.swNoise = Math.max(0, S.swNoise - lerp(C.noiseDecayFar, C.noiseDecayNear, swHeat())*dt);

  if(S.swGround){
    if(held) S.swCharge = Math.min(C.maxCharge, S.swCharge+dt);
    else if(S.swHeld){                       // 放した瞬間に跳ぶ
      se("jump");
      S.swVY = lerp(C.minJump, C.maxJump, S.swCharge/C.maxCharge);
      S.swCharge = 0; S.swGround = false;
      S.swY += S.swVY*dt;                    // その場で浮かせる。1フレーム棒立ちにしない
    }
    // 足場の上に立っていて、その端を越えたら落ちる
    if(S.swGround && S.swY>0){
      const p=platAt(S.swDist);
      if(!p || Math.abs(p.y-S.swY)>1){ S.swGround=false; S.swVY=0; }
    }
  } else {
    S.swVY -= C.gravity*dt;
    const prevY = S.swY;
    S.swY += S.swVY*dt;
    // 一方通行。降りてくるときに上面をまたいだ場合だけ乗る（下からは通り抜ける）
    if(S.swVY<0){
      const p=platAt(S.swDist);
      if(p && prevY>=p.y && S.swY<=p.y){ S.swY=p.y; S.swVY=0; S.swGround=true; se("land"); }
    }
    if(!S.swGround && S.swY<=0){ S.swY=0; S.swVY=0; S.swGround=true; se("land"); }
  }
  S.swHeld = held;

  // 水たまり。踏んでもダメージは無いが、水が跳ねてトウカに位置が伝わる
  for(const q of S.swPuddles){
    if(q.wet) continue;
    if(S.swDist>q.x0 && S.swDist<q.x1 && S.swY<=1){
      q.wet=true;
      S.swNoise = Math.min(C.noiseMax, S.swNoise + C.puddleNoise);
      S.shake=Math.max(S.shake,2.4); se("splash"); toast("水を踏んだ");
    }
  }
  // 気配が積もりきると、トウカに位置を掴まれる
  if(S.swNoise >= C.noiseMax) return enterTouka();

  // 水に落ちた
  if(S.swY < -34){
    if(damage()) return;
    const g=S.swGaps.find(g=>S.swDist>g.x0 && S.swDist<g.x1);
    S.swDist = g ? g.x1+10 : S.swDist+24;
    S.swY=0; S.swVY=0; S.swGround=true; S.swCharge=0;
    S.invuln=Math.max(S.invuln,1.2); S.shake=4; toast("落ちた");
  }

  const h = (S.swGround && held) ? C.crouchH : C.standH;

  // 蝙蝠の3隊形。ふさぐ帯が違うだけで、判定は共通
  for(const b of S.swBats){
    if(b.dead) continue;
    b.x += C.batDrift*dt;
    if(S.invuln>0) continue;
    if(Math.abs(b.x-S.swDist) > (C.bodyW+C.batW)/2) continue;
    if(C.batBands[b.kind].some(([lo,hi]) => S.swY < hi && S.swY+h > lo)){
      b.dead=true;
      if(damage()) return;
      toast("蝙蝠");
    }
  }
  // チーズ。走っているだけでは届かない。高いほうは段差に乗れば楽に取れる
  for(const it of S.swItems){
    if(it.dead) continue;
    if(Math.abs(it.x-S.swDist) > (C.bodyW+C.cheeseW)/2) continue;
    const cy = it.hi ? C.cheeseHiY : C.cheeseY;
    if(S.swY+h >= cy && S.swY <= cy+C.cheeseH){
      it.dead=true; S.score += C.cheeseScore; toast("+"+C.cheeseScore); se("pick");
    }
  }
  // 梯子は地面からは届かない高さ。段差に乗って、そこから跳んだときだけ手が届く
  for(const L of S.swLadders){
    if(L.dead) continue;
    if(Math.abs(L.x-S.swDist) > (C.bodyW+C.ladderW)/2) continue;
    if(S.swY+h >= C.ladderLo){ L.dead=true; se("clear"); return enterClimb(); }
  }

  const back = S.swDist-VW;
  S.swBats    = S.swBats.filter(b=>!b.dead && b.x > back);
  S.swPuddles = S.swPuddles.filter(q=>q.x1 > back);
  S.swItems   = S.swItems.filter(i=>!i.dead && i.x > back);
  S.swLadders = S.swLadders.filter(L=>!L.dead && L.x > back);
  S.swPlats   = S.swPlats.filter(P=>P.x1 > back);
}
function hits(e){
  if(e.kind==="woman") return Math.abs(e.at-S.dist)<CONFIG.hit.depth && Math.abs(e.x-laneX(S.laneF))<CONFIG.hit.cross;
  const d = CONFIG.actors[e.kind]?.depth ?? CONFIG.hit.depth;
  return Math.abs(e.at-S.dist)<d && e.lane===S.lane;
}

/** 監視。見られている時間はミナリ側に1本。
    列ごとに分けると、全列が監視されていても移り続けるだけで避けられてしまう */
function updateWatches(dt){
  for(const w of S.watches) w.life -= dt;
  S.watches = S.watches.filter(w=>w.life>0);

  if(watched(S.lane)) S.seen += dt;
  else                S.seen = Math.max(0, S.seen - dt*CONFIG.watch.cool);

  if(S.seen >= CONFIG.watch.catch){ enterTouka(); return true; }
  return false;
}

function updatePlay(dt){
  holdRepeat(dt);
  const was=S.lane;
  if(edge.left)  S.lane=clamp(S.lane-1,0,CONFIG.lanes-1);
  if(edge.right) S.lane=clamp(S.lane+1,0,CONFIG.lanes-1);
  if(S.lane!==was) se("move");
  S.laneF += (S.lane-S.laneF)*clamp(CONFIG.player.laneSpeed*dt,0,1);

  S.dist += CONFIG.speed*dt;
  // 生き延びているだけで点が入る。粘るほどレートが上がる＝長く生きた者が報われる
  S.score += scoreRate()*dt;
  S.invuln=Math.max(0,S.invuln-dt);
  fillCrowd(); spawnItem(); spawnWoman(); spawnWatch(); spawnManhole();

  if(updateWatches(dt)) return;   // 見つかった＝トウカの画面へ

  const es=enemySpeed();
  for(const e of S.ents){
    if(e.dead) continue;
    const A=CONFIG.actors[e.kind];
    if(e.kind==="woman") e.x += e.vx*es*dt;
    else if(A.drift){
      // 立ち止まっている間は動かない
      if(e.pause>0 && e.at<=e.pauseAt) e.pause -= dt;
      else e.at += A.drift*es*dt;                 // 歩く連中だけ速くなる
    }

    if(!hits(e)) continue;

    if(e.kind==="manhole"){ se("dive"); return enterFall(); }   // 飛び込む → 落下

    if(e.kind==="can" || e.kind==="rice"){
      e.dead=true;
      const p = CONFIG.score[e.kind];
      S.score += p; toast("+"+p); se("pick");
      continue;
    }
    if(S.invuln>0) continue;

    if(e.kind==="woman"){ e.dead=true; const n=perScream(); addWatches(n,true);
                          S.shake=4; se("scream"); toast(n>1?`叫ばれた x${n}`:"叫ばれた"); continue; }
    if(e.kind==="kid" || e.kind==="man"){ e.dead=true; if(damage()) return; toast("ぶつかった"); continue; }
  }

  S.ents = S.ents.filter(e=>!e.dead && e.at>S.dist-VH*0.5 && e.at<S.dist+VH*2.4
                            && !(e.kind==="woman"&&(e.x<-30||e.x>VW+30)));
}
function update(dt){
  S.t+=dt; S.screenT+=dt;
  S.shake=Math.max(0,S.shake-dt*8);
  S.bang=Math.max(0,S.bang-dt*1.6);
  touch.showT=Math.max(0,touch.showT-dt);
  for(const t of S.toasts) t.life-=dt;
  S.toasts=S.toasts.filter(t=>t.life>0);
  if(S.scene==="falling") return updateFall(dt);
  if(S.scene==="sewer")   return updateSewer(dt);
  if(S.scene==="climb")   return updateClimb(dt);
  if(S.scene==="touka")   return updateTouka(dt);
  if(S.scene!=="play"){ if(edge.start) startRun(); return; }
  updatePlay(dt);
}

/* ============================================================
   描画
   ============================================================ */
const ctx=cv.getContext("2d",{alpha:false});
let VW=180, VH=320, playerY=0, lastW=0, lastH=0;
const HUD_H=24;
/** 1ドットを必ず整数個の実ピクセルにする。
    引き伸ばしを画面いっぱいに合わせると倍率が端数になり、3px の点と4px の点が
    混ざって輪郭がガタつく。倍率を先に整数で決め、幅のほうを倍率に合わせる */
function resize(){
  lastW=innerWidth; lastH=innerHeight;
  const w=Math.max(1,innerWidth||1), h=Math.max(1,innerHeight||1);
  const dpr=Math.min(devicePixelRatio||1, 3);
  const scale=Math.max(1, Math.floor(h*dpr/VH));      // 縦を基準に整数倍
  const maxW=Math.floor(w*dpr/scale);
  VW=Math.round(clamp(maxW, VH*0.42, VH*0.80));
  cv.width=VW; cv.height=VH;
  ctx.imageSmoothingEnabled=false;
  // CSS 上の大きさも、実ピクセルで整数倍になる値に固定して中央へ置く
  const cw=VW*scale/dpr, chh=VH*scale/dpr;
  cv.style.width=cw+"px"; cv.style.height=chh+"px";
  cv.style.left=Math.round((w-cw)/2)+"px";
  cv.style.top =Math.round((h-chh)/2)+"px";
  playerY=HUD_H+(VH-HUD_H)*CONFIG.player.y;
}
addEventListener("resize",resize);

const px=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w|0,h|0);};
/** 楕円はドットで打つ。ctx.stroke は液晶にない中間色を作る */
function ring(cx,cy,rx,ry,c,thick){
  ctx.fillStyle=c;
  const n=Math.max(14,Math.ceil(Math.max(rx,ry)*6.5));
  for(let i=0;i<n;i++){const a=i/n*6.2832;
    ctx.fillRect(Math.round(cx+Math.cos(a)*rx),Math.round(cy+Math.sin(a)*ry),thick||1,thick||1);}
}
const GLYPHS={
  "0":"11111 10001 10001 10001 11111","1":"00100 01100 00100 00100 01110",
  "2":"11111 00001 11111 10000 11111","3":"11111 00001 01111 00001 11111",
  "4":"10001 10001 11111 00001 00001","5":"11111 10000 11111 00001 11111",
  "6":"11111 10000 11111 10001 11111","7":"11111 00001 00010 00100 00100",
  "8":"11111 10001 11111 10001 11111","9":"11111 10001 11111 00001 11111",
  "-":"00000 00000 11111 00000 00000","+":"00000 00100 01110 00100 00000",
  "!":"00100 00100 00100 00000 00100",
  "A":"01110 10001 11111 10001 10001","B":"11110 10001 11110 10001 11110",
  "C":"01111 10000 10000 10000 01111","D":"11110 10001 10001 10001 11110",
  "E":"11111 10000 11110 10000 11111","F":"11111 10000 11110 10000 10000",
  "G":"01111 10000 10011 10001 01111","H":"10001 10001 11111 10001 10001",
  "I":"11111 00100 00100 00100 11111","K":"10001 10010 11100 10010 10001",
  "L":"10000 10000 10000 10000 11111","M":"10001 11011 10101 10001 10001",
  "N":"10001 11001 10101 10011 10001","O":"01110 10001 10001 10001 01110",
  "P":"11110 10001 11110 10000 10000","R":"11110 10001 11110 10100 10011",
  "S":"01111 10000 01110 00001 11110","T":"11111 00100 00100 00100 00100",
  "U":"10001 10001 10001 10001 01110","V":"10001 10001 10001 01010 00100",
  "W":"10001 10001 10101 11011 10001","X":"10001 01010 00100 01010 10001",
  "Y":"10001 01010 00100 00100 00100","Z":"11111 00010 00100 01000 11111",
  " ":"00000 00000 00000 00000 00000",
};
const tw=(s,sc=1)=>String(s).length*6*sc-sc;
function text(str,x,y,c,sc=1){
  let cx=x;
  for(const ch of String(str).toUpperCase()){
    const g=GLYPHS[ch];
    if(g){const rows=g.split(" ");
      for(let r=0;r<5;r++)for(let i=0;i<5;i++) if(rows[r][i]==="1") px(cx+i*sc,y+r*sc,sc,sc,c);}
    cx+=6*sc;
  }
}
const textC=(s,y,c,sc=1)=>text(s,Math.round((VW-tw(s,sc))/2),y,c,sc);

/** その場で「何をすればいいか」を言う札。
    説明画面を挟むより、対象の隣に短く出したほうが手が動く。
    地を敷いてから字を置くので、背景に紛れない */
function hint(str, cx, y, c=PAL.warn){
  if(Math.floor(S.t*3)%4===3) return;          // ゆっくり点滅させて視線を呼ぶ
  const w=tw(str), x=Math.round(clamp(cx-w/2, 2, VW-w-2));
  px(x-2, y-2, w+4, 9, PAL.bg);
  px(x-2, y-2, w+4, 1, c); px(x-2, y+6, w+4, 1, c);
  text(str, x, y, c);
}
const screenY = at => playerY-(at-S.dist);

const HEART=["0110110","1111111","1111111","0111110","0011100","0001000"];
function heart(x,y,c){
  for(let r=0;r<6;r++) for(let i=0;i<7;i++) if(HEART[r][i]==="1") px(x+i,y+r,1,1,c);
}
function figure(cx,by,w,h,c,o){
  o=o||{};
  const hw=Math.round(w/2), hh=Math.round(h*0.32);
  px(cx-hw,by-h+hh,w,h-hh,c);
  px(cx-Math.round(w*0.3),by-h,Math.round(w*0.6),hh,c);
  if(o.skirt) px(cx-hw-2,by-5,w+4,5,c);
}
/** 2枚を交互に。歩幅の速さは hz で決める */
const anim = (a,b,hz)=> Math.floor(S.t*hz)%2 ? b : a;

function drawMinari(cx,by){
  blit(anim(SPR.minariBackA, SPR.minariBackB, 9), cx, by+2);
}
function drawActor(e){
  const A=CONFIG.actors[e.kind], y=screenY(e.at);
  if(y<HUD_H-28||y>VH+28) return;
  const x = e.kind==="woman" ? e.x : laneX(e.lane);
  switch(e.kind){
    case "manhole": {
      const bl=Math.floor(S.t*7)%2===0;
      ring(x,y,A.w/2,A.h/2,bl?PAL.ink:PAL.dim,2);
      ring(x,y,A.w/2-5,A.h/2-4,PAL.dim);
      // 逃げ道だと分かっていないと、そもそも飛び込まない
      if(y>HUD_H+16 && y<VH-20) hint("ESCAPE!", x, y-A.h/2-11);
      break;
    }
    case "can":   blit(SPR.can, x, y+4); break;
    case "rice":  blit(SPR.onigiri, x, y+5); break;
    // 正面の絵しかないので、左右を反転して交互に出す＝体を振って歩いて見える。
    // 女は横切る絵なので反転させず、進む向きにだけ合わせる
    case "man":   blit(SPR.man, x, y+10+(Math.floor(S.t*5)%2), Math.floor(S.t*5)%2===0); break;
    case "woman": blit(SPR.woman, x, y+10, e.vx>0); break;
    default:      blit(SPR.kid, x, y+9+(Math.floor(S.t*9)%2), Math.floor(S.t*9)%2===0); break;
  }
}

/** ヤツメウナギ。トウカの部下。細長い体と、丸い吸盤の口 */
function lamprey(x,y,wr){
  const w=Math.round(3+2*(wr||1));
  px(x,y,3,3,PAL.plum);                // 頭（吸盤）
  px(x+1,y+1,1,1,PAL.bg);
  for(let i=0;i<4;i++) px(x-2-i*2, y+Math.round(Math.sin(i*1.4+S.t*9)*1.2), 2, 2, PAL.plum);
  if(w>5) px(x-9,y,2,1,PAL.dim);
}

/** トウカに掴まれるまでのゲージ。路地と下水で共通の見た目にする */
function drawStalkBar(top, k, label){
  k = clamp(k,0,1);
  // 左端にトウカと、仕えるヤツメウナギ。ゲージが溜まるほどヤツメウナギが騒ぐ
  const cy=top+2;
  const agi = k>0.7 ? 2 : k>0.35 ? 1 : 0;                  // 落ち着き / 気づいた / 騒ぐ
  const wig = agi ? Math.round(Math.sin(S.t*(agi>1?16:8))*agi) : 0;
  // 溜まるほど、部下が構えから投げる姿勢に変わる
  blit(agi>1?SPR.lampThrow:SPR.lampReady, 12, cy+8+wig);
  if(agi>1 && Math.floor(S.t*10)%2===0) text("!",22,cy-7,PAL.warn);

  const gx=26, gw=VW-gx-4;
  px(gx,top-1,gw,1,PAL.dim);
  px(gx,top,gw,5,PAL.bg);
  px(gx,top,Math.round(gw*k),5, k>0.7?PAL.warn:PAL.ink);
  if(k>0.7 && Math.floor(S.t*8)%2===0) textC(label,top+8,PAL.warn);
}

/** 監視されている列。目はミナリの視線の先＝画面の上。列そのものもハッチで示す */
function drawWatches(){
  const blink = Math.floor(S.t*6)%2===0;
  const top = HUD_H+14;                       // ゲージの帯とぶつからない位置から
  for(const w of S.watches){
    const x0=laneW()*w.lane, ww=laneW(), cx=x0+ww/2;
    for(let y=top+2;y<VH;y+=6) px(x0+2,y,ww-4,1,PAL.off);
    px(x0+1,top,1,VH-top,PAL.dim); px(x0+ww-2,top,1,VH-top,PAL.dim);
    ring(cx,top+9,7,5,blink?PAL.ink:PAL.dim);
    px(cx-2,top+7,4,4,PAL.ink);
  }
}

function drawAlley(){
  px(0,HUD_H,VW,VH-HUD_H,PAL.bg);
  const off=S.dist%26;
  for(let y=HUD_H-26;y<VH+26;y+=26) px(0,y+off,VW,1,PAL.off);
  for(let i=1;i<CONFIG.lanes;i++) px(laneW()*i,HUD_H,1,VH-HUD_H,PAL.off);
  px(0,HUD_H,2,VH-HUD_H,PAL.dim); px(VW-2,HUD_H,2,VH-HUD_H,PAL.dim);

  drawWatches();
  for(const e of S.ents) if(!e.dead) drawActor(e);
  if(!(S.invuln>0 && Math.floor(S.t*14)%2===0)) drawMinari(laneX(S.laneF),playerY);
  // 見られている時間。下水の気配ゲージと同じ見た目
  drawStalkBar(HUD_H+4, S.seen/CONFIG.watch.catch, "SHE SEES YOU");

  let ty=HUD_H+22;
  for(const t of S.toasts){ text(t.txt.slice(0,10),4,ty,PAL.ink); ty+=8; }
  if(touch.down||touch.showT>0){
    const r=cv.getBoundingClientRect();
    ring((touch.x-r.left)/r.width*VW,(touch.y-r.top)/r.height*VH,8,8,PAL.dim);
  }
}
/** 落下。路地とは上下が逆で、おにぎりは下から昇ってくる */
function drawFall(){
  const fy = HUD_H+(VH-HUD_H)*CONFIG.fall.y;
  px(0,HUD_H,VW,VH-HUD_H,PAL.bg);
  // 縦穴の壁。上へ流れる＝落ちている
  const off = S.fallDist%22;
  for(let y=VH+22; y>HUD_H-22; y-=22){
    const yy=y-off;
    px(0,yy,7,2,PAL.dim); px(VW-7,yy,7,2,PAL.dim);
  }
  px(0,HUD_H,4,VH-HUD_H,PAL.off); px(VW-4,HUD_H,4,VH-HUD_H,PAL.off);

  for(const it of S.fallItems){
    if(it.dead) continue;
    const y = fy + (it.at - S.fallDist);
    if(y<HUD_H-16||y>VH+16) continue;
    blit(SPR.onigiri, it.x, y+5);
  }
  // 落ち始めだけ、マンホールの縁からヤツメウナギが覗いて手を伸ばしてくる。
  // 崖から落ちる者へ差し出される手。掴まれることはない、ただの見送り
  const peek = clamp(1 - S.fallT/1.6, 0, 1);
  if(peek>0){
    const edge = HUD_H + Math.round(-14 + 16*peek);
    px(0,HUD_H,VW,Math.max(0,edge-HUD_H),PAL.off);
    px(0,edge,VW,2,PAL.ink);
    for(let i=0;i<4;i++){
      const x = 14 + i*Math.round((VW-28)/3) + Math.round(Math.sin(S.t*5+i)*2);
      lamprey(x, edge+4+Math.round(Math.sin(S.t*6+i*1.7)*2), 1.4);
    }
  }
  drawMinariFall(S.fallX, fy);

  // 落下は押しっぱなしで流れる。押す場所が操作だと分かるまで出しておく
  if(S.fallT<2.2) hint("HOLD L / R", VW/2, fy+42, PAL.dim);
  const left=Math.max(0,CONFIG.fall.duration-S.fallT);
  textC("FALLING",HUD_H+8,PAL.dim);
  textC(left.toFixed(1),HUD_H+18,PAL.ink);
  let ty=VH-58;
  for(const t of S.toasts){ textC(t.txt.slice(0,10),ty,PAL.ink); ty+=9; }
  textC("SEWER NOT BUILT",VH-24,PAL.off);
  textC("BACK TO ALLEY",VH-14,PAL.off);
}

/** 落下のミナリ。ここだけ画面に他の要素が少ないので、大きく描いて顔を見せる。
    手足を広げて、流れている向きへ少し傾ける */
function drawMinariFall(cx,cy){
  // 流れている向きへ少し傾ける代わりに、絵を左右へずらす
  const tilt = Math.round(clamp(S.fallVX/CONFIG.fall.maxVX,-1,1)*2);
  blit(anim(SPR.minariFallA, SPR.minariFallB, 6), cx+tilt, cy+22);
}

/** 下水。横スクロールなので、路地・落下とは軸そのものが違う */
function drawMinariSide(cx,by,crouch){
  // 絵の高さは当たり判定（立ち30px／伏せ16px）に合わせてある
  blit(crouch ? SPR.minariCrouch : anim(SPR.minariSideA, SPR.minariSideB, 8), cx, by);
}
/** トウカフェーズ。奥にトウカ、手前にミナリ。指差した列に網が飛んでくる */
/* トウカ画面の廊下。壁・稜線・列の境目は動かないので、一度だけ描いて持っておく。
   キャンバスへそのまま貼るだけなので、色は一切混ざらない（純度の規律は保たれる） */
let tkBg=null, tkBgKey="";
function toukaBackdrop(vx, vy, py){
  const key = VW+"x"+VH;
  if(tkBg && tkBgKey===key) return tkBg;
  const C=CONFIG.touka;
  const cvs = document.createElement("canvas");
  cvs.width=VW; cvs.height=VH;
  const g = cvs.getContext("2d");
  const put=(x,y,w,h,c)=>{ g.fillStyle=c; g.fillRect(x|0,y|0,w|0,h|0); };
  put(0,0,VW,VH,PAL.bg);

  const HALF = VW/2 + 26;                   // 床の端が画面外へ抜ける距離
  const CEIL = vy - HUD_H + 26;             // 消失点から天井までの高さ
  const floorY = x => vy + Math.min(1, Math.abs(x-vx)/HALF)*(py-vy);
  const ceilY  = x => vy - Math.min(1, Math.abs(x-vx)/HALF)*CEIL;
  const spread = y => clamp((y-vy)/(py-vy), 0, 1);

  // 壁の面。行ごとに床の左右端が決まるので、列 x はその端に当たる行より
  // 上が壁、下が床になる。市松で塗るので中間色は生まれない
  for(let x=0;x<VW;x++){
    const fy=Math.min(VH,floorY(x)), cy=Math.max(HUD_H,ceilY(x));
    for(let y=Math.round(cy); y<fy; y++) if(((x+y)&3)===0) put(x,y,1,1,PAL.off);
  }
  // 廊下の稜線。床と天井が消失点へ集まる線で、ここが奥行きの骨格になる
  for(let x=0;x<VW;x++){
    const fy=floorY(x), cy=ceilY(x);
    if(fy<VH-1) put(x, Math.round(fy), 1, 2, PAL.ink);
    if(cy>HUD_H) put(x, Math.round(cy), 1, 2, PAL.dim);
  }
  // 奥の闇。路地がまだ続いていることを示す
  for(let r=22;r>0;r-=3){
    const c = r>15?PAL.dim:PAL.ink;
    for(let a=0;a<64;a++){
      const th=a/64*Math.PI*2;
      put(Math.round(vx+Math.cos(th)*r), Math.round(vy+Math.sin(th)*r*0.52), 1, 1, c);
    }
  }
  // 列の境目。消失点へ収束する
  for(let i=1;i<C.lanes;i++){
    for(let k=0;k<=64;k++){
      const y=vy+(py-vy)*(k/64);
      put(lerp(vx, vx+(VW/C.lanes*i-vx)*0.80, spread(y)), Math.round(y), 1, 2, PAL.off);
    }
  }
  put(0,0,VW,HUD_H,PAL.bg);                 // HUD の下は毎フレーム描かれる
  tkBg=cvs; tkBgKey=key;
  return tkBg;
}

function drawTouka(){
  const C=CONFIG.touka;
  // 奥から手前へ逃げる画面。**奥行きを作るのがこの画面の仕事**。
  // 一点透視で組む。消失点をひとつ決め、壁・床・列をそこへ収束させる。
  //
  // 大事なのは「横の広がりは画面の行だけで決まる」こと。
  // 横も深さの曲線で畳むと、廊下が中央に張り付いて奥行きが消える。
  const vx = VW/2, vy = HUD_H+28;           // 消失点
  const py = VH-4;                          // 一番手前＝ミナリの足元
  /** 画面の行 y での広がり 0..1。消失点で0、手前で1 */
  const spread = y => clamp((y-vy)/(py-vy), 0, 1);
  /** 深さ 0..1 → 画面の行。手前ほど間隔が開く＝走って近づいて見える */
  const ly = t => vy + (py-vy)*(t*t*0.82 + t*0.18);
  /** 深さ t のときの、列 l の横位置 */
  // 手前の列は少し内側へ寄せる。ミナリが52px幅なので、素直に等分すると
  // 端の列で半分が画面の外へ出てしまう
  const laneX = l => vx + (VW/C.lanes*(l+0.5) - vx)*0.80;
  const lx = (l,t) => lerp(vx, laneX(l), spread(ly(t)));

  // 廊下の地は動かないので、一度だけ焼いて使い回す。
  // 毎フレーム点を打つと、この画面だけで60fpsの予算を半分使ってしまう
  ctx.drawImage(toukaBackdrop(vx, vy, py), 0, 0);

  // 壁の継ぎ目。ここだけは流れる＝走っているのが壁でも分かる
  const HALF = VW/2 + 26;
  const floorY = x => vy + Math.min(1, Math.abs(x-vx)/HALF)*(py-vy);
  const ceilY  = x => vy - Math.min(1, Math.abs(x-vx)/HALF)*(vy-HUD_H+26);
  const flow=(S.tkT*0.5)%1;
  for(let i=0;i<7;i++){
    const t=clamp((i+flow)/7,0.04,1), e=t*t*0.82+t*0.18;
    for(const sgn of [-1,1]){
      const x=Math.round(vx+sgn*e*HALF);
      if(x<1||x>=VW-1) continue;
      const fy=Math.min(VH,floorY(x)), cy=Math.max(HUD_H,ceilY(x));
      px(x, Math.round(cy), 1, Math.round(fy-cy), t>0.5?PAL.dim:PAL.off);
    }
  }
  // 床の横線。手前ほど間隔が開いて流れ去る＝走っている速さ
  const off=(S.tkT*0.5)%1;
  for(let d=0;d<16;d++){
    const t=clamp((d+off)/16,0,1), y=ly(t);
    if(y<=vy+3) continue;
    const w=spread(y)*HALF;
    px(Math.round(vx-w), Math.round(y), Math.round(w*2), 1, PAL.off);
  }

  // トウカ。奥に立って指すだけ。闇を背負わせて、小さくても存在感を残す
  const tt=0.16, ty=Math.round(ly(tt)), tx=vx;
  const hx=Math.round(tx+17), hy=ty-1;      // 部下はトウカの右にひとり
  const throwing = S.tkNets.some(n=>!n.hit);
  blit(throwing?SPR.lampThrow:SPR.lampReady, hx, hy);
  blit(anim(SPR.toukaA, SPR.toukaB, 3), tx, ty);

  // 指差し。予告中の列に、奥から手前まで届く帯を出す
  if(Math.floor(S.t*12)%2===0){
    for(const lane of S.tkPoints){
      for(let k=2;k<=8;k++){
        const t=k/8, y=ly(t), w=Math.round((VW/C.lanes)*0.72*spread(y));
        px(lx(lane,t)-w/2, Math.round(y), Math.max(2,w), 1, PAL.warn);
      }
    }
  }

  // 網。奥から手前へ、3段階で大きくなる
  for(const net of S.tkNets){
    if(net.age < net.tele || net.hit) continue;
    const u=(net.age-net.tele)/net.fly, t=lerp(tt,1,u);
    const spr = u<0.34 ? SPR.netFar : u<0.68 ? SPR.netMid : SPR.netNear;
    blit(spr, lerp(hx, lx(net.lane,1), u), ly(t)-Math.round(lerp(1,22,u)));
  }

  // 定位置は真ん中。避けても勝手にここへ戻るので、戻り先を床に示しておく
  const mid=(C.lanes-1)>>1, hw=Math.round((VW/C.lanes)*0.5), homeX=lx(mid,1);
  px(homeX-hw/2, py+1, hw, 1, PAL.off);
  px(homeX-hw/2, py-1, 2, 3, PAL.off); px(homeX+hw/2-2, py-1, 2, 3, PAL.off);

  // ミナリ。こちらへ走ってくる正面。画面の主役なので一番大きい
  const mx=lx(S.tkLaneF,1), wig=Math.floor(S.t*12)%2?1:0;
  if(S.tkDodge!==0) px(mx-13, py+2, 26, 2, PAL.aqua);
  blit(S.tkDodge<0 ? SPR.minariDodgeL
     : S.tkDodge>0 ? SPR.minariDodgeR
     : anim(SPR.minariFrontA, SPR.minariFrontB, 10), mx, py+wig);

  if(S.tkT<2.4) hint("TAP L / R TO DODGE", VW/2, VH-76, PAL.dim);

  const left=Math.max(0,C.surviveTime-S.tkT);
  textC("RUN  "+left.toFixed(1), HUD_H+2, PAL.warn);
  const gw=VW-8, k=clamp(S.tkT/C.surviveTime,0,1);
  px(4,VH-3,gw,3,PAL.bg); px(4,VH-3,Math.round(gw*k),3,PAL.ink);
}

/** 梯子を昇る。連打で登る。先を行く鼠と、途中のおにぎりの取り合い */
function drawClimb(){
  const C=CONFIG.climb;
  const py = HUD_H+(VH-HUD_H)*C.y;
  const toY = h => py - (h - S.climbY);          // 高いものほど画面の上
  const lx = Math.round(VW*0.36), rx = Math.round(VW*0.70);

  px(0,HUD_H,VW,VH-HUD_H,PAL.bg);
  px(0,HUD_H,VW,3,PAL.dim);
  // 縦穴の壁
  for(let y=HUD_H;y<VH;y+=8){
    const o=Math.round((S.climbY*0.5+y)%8);
    px(2,y+o,4,2,PAL.off); px(VW-6,y+o,4,2,PAL.off);
  }
  // 梯子（ミナリ側）と、相手が登る配管
  px(lx-8,HUD_H,2,VH-HUD_H,PAL.dim); px(lx+7,HUD_H,2,VH-HUD_H,PAL.dim);
  for(let h=Math.floor(S.climbY/26)*26-52; h<S.climbY+VH; h+=26){
    const y=toY(h); if(y>HUD_H-4 && y<VH+4) px(lx-8,y,17,2,PAL.ink);
  }
  px(rx-4,HUD_H,3,VH-HUD_H,PAL.off);
  for(let h=Math.floor(S.climbY/40)*40-80; h<S.climbY+VH; h+=40){
    const y=toY(h); if(y>HUD_H-4 && y<VH+4) px(rx-6,y,7,2,PAL.dim);
  }
  // 下から這い上がってくるヤツメウナギの群れ
  const sy=toY(S.climbSwarm);
  if(sy>HUD_H-40){
    const top=Math.max(HUD_H,sy);
    px(0,top,VW,VH-top,PAL.off);
    for(let i=0;i<9;i++){
      const x=6+((i*23+Math.round(S.climbT*11))%(VW-14));
      lamprey(x, sy+6+((i*13)%26), 1+Math.sin(S.t*7+i)*0.6);
    }
    for(let x=0;x<VW;x+=5) px(x,sy+Math.round(Math.sin(x*0.4+S.t*6)*2),4,2,PAL.dim);
  }
  // 出口の明かり
  const topY=toY(C.total);
  if(topY<VH+20){
    px(0,Math.max(HUD_H,topY-16),VW,Math.max(0,Math.min(VH,topY)-Math.max(HUD_H,topY-16)),PAL.off);
    px(0,topY,VW,3,PAL.ink);
  }
  // おにぎり
  for(const it of S.climbItems){
    if(it.who) continue;
    const y=toY(it.h), x=lx+13;
    if(y<HUD_H-12||y>VH+12) continue;
    blit(SPR.onigiri, x, y+5);
  }
  // ミナリ
  // 連打が速いほど、手を出す動きも速く見える
  blit(anim(SPR.minariClimbA, SPR.minariClimbB, 7), lx, py+2);

  // 連打しないと群れに追い抜かれておにぎりを食われる。手を動かす合図を出す
  hint("TAP!", lx, py-40);
  // 残りの高さ
  const k=clamp(S.climbY/C.total,0,1);
  px(VW-7,HUD_H+16,4,VH-HUD_H-30,PAL.bg);
  px(VW-7,HUD_H+16+Math.round((VH-HUD_H-30)*(1-k)),4,3,PAL.ink);
  let ty=HUD_H+16;
  for(const t of S.toasts){ text(t.txt.slice(0,10),4,ty,PAL.ink); ty+=8; }
}

function drawSewerScene(){
  const C=CONFIG.sewer;
  const gy = HUD_H+(VH-HUD_H)*C.groundY;
  const pxs = Math.round(VW*C.playerX);
  const toScreen = wx => pxs + (wx - S.swDist);

  px(0,HUD_H,VW,VH-HUD_H,PAL.bg);
  px(0,HUD_H,VW,5,PAL.dim);                                    // 天井
  for(let i=0;i<9;i++){
    const x = VW - ((S.swDist*0.55 + i*27) % (VW+22));
    px(x,HUD_H+5,1,3,PAL.off);                                 // 天井のしずく
  }
  // 地面は途切れない
  px(0,gy,VW,2,PAL.ink);
  px(0,gy+2,VW,VH-gy-2,PAL.off);
  for(let i=0;i<10;i++){
    const x=VW-((S.swDist*1.0+i*26)%(VW+26));
    px(x,gy+5,10,1,PAL.dim);                                   // 床のタイル目地
  }
  // 浮いた足場。下は素通りできるので、乗るか下を行くかを選べる
  for(const P of S.swPlats){
    const x0=Math.max(-4,toScreen(P.x0)), x1=Math.min(VW+4,toScreen(P.x1));
    if(x1<=0||x0>=VW) continue;
    const ty=gy-P.y, w=x1-x0;
    px(x0,ty,w,2,PAL.ink);                                     // 天面
    px(x0,ty+2,w,C.platThick-2,PAL.dim);
    for(let i=0;i<Math.floor(w/10);i++) px(x0+3+i*10,ty+C.platThick,3,1,PAL.off);  // 裏の桟
    if(toScreen(P.x0)>-2) px(x0,ty,1,C.platThick+3,PAL.ink);   // 手前の端
    if(toScreen(P.x1)<VW+2) px(x1-1,ty,1,C.platThick+3,PAL.ink);
  }
  // 水たまり。床がくぼんで水が溜まっている。縁を濃く、中を明るく、さざ波を流す
  for(const q of S.swPuddles){
    const x0=Math.max(0,toScreen(q.x0)), x1=Math.min(VW,toScreen(q.x1));
    if(x1<=0||x0>=VW) continue;
    const w=Math.max(0,x1-x0), D=5;
    px(x0,gy,w,D,PAL.bg);                                   // くぼみ（床を抜く）
    px(x0,gy+1,w,D-2,PAL.aqua);                              // 水面
    px(x0,gy,w,1,PAL.ink); px(x0,gy+D-1,w,1,PAL.ink);       // 上下の縁
    if(toScreen(q.x0)>=0) px(x0,gy,1,D,PAL.ink);
    if(toScreen(q.x1)<=VW) px(x1-1,gy,1,D,PAL.ink);
    for(let i=0;i<Math.floor(w/9);i++){                      // さざ波
      const o=Math.round(Math.sin(i*1.7+S.t*4)*1.5);
      px(x0+4+i*9+o, gy+2, 4, 1, PAL.bg);
    }
    if(q.wet) ring(x0+w/2, gy+2, w*0.45, 3, PAL.aqua);       // 踏んだあとの波紋
  }
  // チーズ
  for(const it of S.swItems){
    const sx=toScreen(it.x);
    if(sx<-14||sx>VW+14) continue;
    blit(SPR.cheese, sx, gy-(it.hi?C.cheeseHiY:C.cheeseY));
  }
  // 脱出の梯子。掴みに行かないと掴めないので、通り道は塞がない
  for(const L of S.swLadders){
    const sx=toScreen(L.x)-C.ladderW/2;
    if(sx<-30||sx>VW+30) continue;
    const bottom=gy-C.ladderLo;
    px(sx,HUD_H+6,1,bottom-HUD_H-6,PAL.dim);
    px(sx+C.ladderW-1,HUD_H+6,1,bottom-HUD_H-6,PAL.dim);
    for(let y=HUD_H+9;y<bottom;y+=7) px(sx,y,C.ladderW,1,PAL.ink);
    if(Math.floor(S.t*5)%2===0) px(sx+2,bottom-2,C.ladderW-4,2,PAL.warn);
    // 足場に乗って、そこから跳ばないと届かない。気づかないと素通りする
    if(sx>-20 && sx<VW) hint("GRAB!", sx+C.ladderW/2, bottom+4);
  }
  // 蝙蝠。ふさいでいる「高さの帯」が見えないと、伏せるのか跳ぶのか判断できない。
  // 帯そのものを市松のドットで示し、そのなかに蝙蝠を隙間なく積む
  const swarm=(sx,bands,kind)=>{
    const flap=Math.floor(S.t*9)%2?2:0;
    const halfW=Math.round(C.batW/2)+5;
    for(const [lo,hi] of bands){
      // 塞がっている範囲。市松なので中間色は作らない
      for(let yy=lo; yy<hi; yy+=4){
        const y=gy-yy-2;
        if(y<HUD_H||y>gy) continue;
        for(let dx=-halfW; dx<halfW; dx+=4) px(sx+dx+((yy>>2)%2?2:0), y, 2, 2, PAL.off);
      }
      // 蝙蝠本体。帯を埋めるように積む
      let k=0;
      for(let yy=lo+4; yy<hi; yy+=C.batStack, k++){
        const by=gy-yy-C.batH, jig=(k%2?2:-2);
        if(by>gy||by<HUD_H-C.batH) continue;
        px(sx-4+jig,by+6,8,11,PAL.ink);                                   // 胴
        px(sx-12+jig,by+3+flap,8,5,PAL.ink); px(sx+4+jig,by+3+flap,8,5,PAL.ink); // 翼
        px(sx-4+jig,by+2,3,4,PAL.ink); px(sx+1+jig,by+2,3,4,PAL.ink);     // 耳
        px(sx-2+jig,by+9,1,2,PAL.bg);  px(sx+1+jig,by+9,1,2,PAL.bg);      // 目
      }
      // 通れる側に印。伏せるのか跳ぶのかを、記号ひとつで言い切る
      const arrowY = kind==="high" ? gy-8 : gy-hi-14;
      for(let i=0;i<4;i++){
        const w=7-i*2, yy=arrowY+(kind==="high"?i:3-i);
        px(sx-w/2, yy, w, 1, PAL.warn);
      }
    }
  };
  for(const b of S.swBats){
    const sx=toScreen(b.x);
    if(sx<-20||sx>VW+20) continue;
    swarm(sx, C.batBands[b.kind], b.kind);
  }
  // 入口では操作そのものを言う。押しっぱなしが伏せ、放すと跳ぶ
  if(S.swDist < 150) hint("HOLD = DUCK", VW/2, HUD_H+40, PAL.dim);
  else if(S.swDist < 300) hint("RELEASE = JUMP", VW/2, HUD_H+40, PAL.dim);

  // ミナリ
  const held = touch.down || keys.hold;
  const crouch = S.swGround && held;
  const by = gy - S.swY;
  // 足元の影。跳んでいる高さは、影との距離でしか読み取れない
  if(S.swY>2){
    const p=platAt(S.swDist), sy=gy-(p?p.y:0);
    const w=Math.max(4, 14-Math.round(S.swY/14));
    px(pxs-w/2, sy-1, w, 1, PAL.dim);
  }
  if(!(S.invuln>0 && Math.floor(S.t*14)%2===0)) drawMinariSide(pxs,by,crouch);
  // 溜め
  if(S.swCharge>0){
    const k=S.swCharge/C.maxCharge, w=16, h=crouch?C.crouchH:C.standH;
    px(pxs-w/2-1, by-h-15, w+2, 5, PAL.bg);
    px(pxs-w/2,   by-h-14, Math.round(w*k), 3, k>=0.995?PAL.warn:PAL.ink);
  }

  // 気配のゲージ。水たまりを踏むたびに跳ね上がり、静かにしていれば薄れる
  const gTop = HUD_H+4;
  drawStalkBar(gTop, S.swNoise/C.noiseMax, "SHE FEELS YOU");

  let ty=gTop+18;
  for(const t of S.toasts){ text(t.txt.slice(0,10),4,ty,PAL.ink); ty+=8; }
}

function drawHUD(){
  px(0,0,VW,HUD_H,PAL.off);
  px(0,HUD_H-1,VW,1,PAL.dim);
  text(String(Math.min(Math.floor(S.score),9999999)).padStart(6,"0"),4,3,PAL.ink);
  // 毎秒いくら入っているか。生き延びるほど増えるので、粘る理由がそのまま見える
  text("+"+Math.round(scoreRate()), 4, 12, PAL.dim);
  const st="ST"+S.stage;
  text(st, Math.round((VW-tw(st))/2), 12, PAL.dim);
  for(let i=0;i<CONFIG.hearts;i++) heart(VW-4-(i+1)*9, 5, i<S.hearts?PAL.warn:PAL.off);
}
function drawTitle(){
  px(0,0,VW,VH,PAL.bg);
  textC("SUGAKE",50,PAL.ink,2);
  textC("STALKING",70,PAL.ink,2);
  textC("ALLEY",94,PAL.dim);
  drawMinari(VW/2,148);
  for(let i=0;i<3;i++) heart(VW/2-13+i*9,160,PAL.warn);
  px(Math.round(VW*.12),176,Math.round(VW*.76),1,PAL.off);
  textC("TAP LEFT OR RIGHT",192,PAL.ink);
  textC("TAKE CANS AND RICE",212,PAL.dim);
  textC("DODGE KIDS AND MEN",224,PAL.dim);
  textC("LEAVE WATCHED LANES",236,PAL.dim);
  textC("MANHOLE TO ESCAPE",252,PAL.dim);
  textC("CATCH RICE TO HEAL",264,PAL.dim);
  if(Math.floor(S.t*2)%2===0) textC("TAP TO START",286,PAL.ink);
  if(S.startStage>1) textC("DEBUG  START AT ST"+S.startStage,296,PAL.warn);
  textC("BEST "+S.best,306,PAL.dim);
  text(BUILD, VW-tw(BUILD)-3, VH-8, PAL.off);   // どの版を見ているかの確認用
}
function drawOver(){
  px(0,0,VW,VH,PAL.bg);
  const spotted = S.end==="touka";
  textC(spotted?"CAUGHT !":"GAME OVER", 52, PAL.warn);
  if(spotted){
    blit(SPR.toukaA, VW/2, 138);
    textC("TOUKA HAS YOU",150,PAL.dim);
  } else {
    for(let i=0;i<CONFIG.hearts;i++) heart(VW/2-13+i*9,110,PAL.bg);
    textC("NO HEARTS LEFT",150,PAL.dim);
  }
  [["SCORE",S.score],["BEST",S.best],["STAGE",S.stage],["TIME",Math.round(S.t)]].forEach(([k,v],i)=>{
    const y=190+i*16;
    text(k,Math.round(VW*.18),y,PAL.dim);
    text(String(v),VW-tw(String(v))-Math.round(VW*.18),y,PAL.ink);
  });
  if(Math.floor(S.t*2)%2===0) textC("TAP TO RETRY",278,PAL.ink);
}
function render(){
  // 揺らすとずれたぶん画面端が塗り残る。先に全面を下地で埋めておく
  px(0,0,VW,VH,PAL.bg);
  ctx.save();
  if(S.shake>0.05){ const j=()=>Math.round((rnd()*2-1)*S.shake); ctx.translate(j(),j()); }
  if(S.scene==="title") drawTitle();
  else if(S.scene==="over") drawOver();
  else if(S.scene==="falling"){ drawFall(); drawHUD(); }
  else if(S.scene==="sewer"){ drawSewerScene(); drawHUD(); }
  else if(S.scene==="climb"){ drawClimb(); drawHUD(); }
  else if(S.scene==="touka"){ drawTouka(); drawHUD(); }
  else { drawAlley(); drawHUD(); }
  ctx.restore();
}

/* ============================================================
   ループ
   ============================================================ */
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  if(innerWidth!==lastW||innerHeight!==lastH) resize();
  update(dt); render(); updateDebug();
  for(const k in edge) delete edge[k];
  requestAnimationFrame(frame);
}

/* 開発用 */
const devSeed=document.getElementById("tSeed"), dbg=document.getElementById("debug");
document.getElementById("devToggle").onclick=()=>document.getElementById("dev").classList.toggle("on");
{ // 音の入切。画面のタップは操作に使うので、切り替えは画面の外に置く
  const b=document.getElementById("seToggle");
  const paint=()=>b.classList.toggle("off", !SFX.on);
  b.onclick=()=>{ SFX.toggle(); paint(); };
  paint();
}
addEventListener("keydown",e=>{ if(e.code==="KeyM"){ SFX.toggle();
  document.getElementById("seToggle").classList.toggle("off", !SFX.on); }});
document.getElementById("tDbg").onclick=()=>{CONFIG.debug=!CONFIG.debug;};
// デバッグ: 開始ステージを選ぶ。難易度（通算時間）もそのぶん進めた状態で始まる
const tStage=document.getElementById("tStage");
tStage.onclick=()=>{
  S.startStage = S.startStage>=8 ? 1 : S.startStage+1;
  tStage.textContent = "開始ステージ: "+S.startStage;
};
document.getElementById("tFall").onclick=()=>{
  if(S.scene==="title"||S.scene==="over") startRun();
  enterFall();
};
document.getElementById("tSewer").onclick=()=>{
  if(S.scene==="title"||S.scene==="over") startRun();
  enterSewer();
};
document.getElementById("tClimb").onclick=()=>{
  if(S.scene==="title"||S.scene==="over") startRun();
  enterClimb();
};
document.getElementById("tTouka").onclick=()=>{
  if(S.scene==="title"||S.scene==="over") startRun();
  enterTouka();
};
function updateDebug(){
  if(!CONFIG.debug){ if(dbg.textContent) dbg.textContent=""; return; }
  const c={};
  for(const e of S.ents) if(!e.dead) c[e.kind]=(c[e.kind]||0)+1;
  dbg.textContent=
`${S.scene} t${S.t.toFixed(1)} seed ${S.seed}
HEART ${S.hearts}${S.scene==="sewer"?`  SW heat ${swHeat().toFixed(2)} noise ${S.swNoise.toFixed(0)}/${CONFIG.sewer.noiseMax} spd ${swSpeed().toFixed(0)} dist ${S.swDist.toFixed(0)}`:""}
DENS ${dens().toFixed(2)} gap x${lerp(CONFIG.spawn.crowdGapFar,CONFIG.spawn.crowdGapNear,dens()).toFixed(2)}
RATE +${scoreRate().toFixed(0)}/s  enemy x${enemySpeed().toFixed(2)}
WATCH ${S.watches.length}/${CONFIG.lanes} 列 [${S.watches.map(w=>w.lane).sort().join(",")||"-"}] 叫び=${perScream()}列 densW ${densW().toFixed(2)}
SEEN  ${S.seen.toFixed(2)}/${CONFIG.watch.catch}
SCORE ${S.score} dist ${S.dist.toFixed(0)}
ENTS ${JSON.stringify(c)}  VIEW ${VW}x${VH}`;
}

try{ S.best=parseInt(localStorage.getItem("sugake_alley_best")||"0",10)||0; }catch(e){}
validatePatterns();
validateSewer();
validateSprites();
resize();
rnd=mulberry32(hashSeed("boot"));
requestAnimationFrame(frame);
</script>
