<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>しゅがけストーキング — 路地</title>
<style>
/* ============================================================
   しゅがけストーキング — 路地の画面

   ハート3個。なくなったら GAME OVER。
     ・子供にぶつかる      → ハート -1
     ・男にぶつかる        → ハート -1、掴まる（連打でほどく）
     ・女にぶつかる        → 叫ばれて、どこかの列に監視がつく
     ・監視中の列に居続ける → 見つかってトウカの画面へ（即 GAME OVER の場所）
     ・空き缶 / おにぎり   → スコア
     ・マンホールに飛び込む → 次のステージへ
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000}
body{user-select:none;-webkit-user-select:none;overscroll-behavior:none;touch-action:none}
#screen{position:fixed;inset:0;width:100%;height:100%;display:block;
  image-rendering:pixelated;image-rendering:crisp-edges}
#devToggle{position:fixed;top:calc(6px + env(safe-area-inset-top));right:6px;z-index:3;
  width:24px;height:24px;border:none;border-radius:6px;background:rgba(0,0,0,.25);
  color:rgba(255,255,255,.45);font:13px/24px system-ui;text-align:center;cursor:pointer}
#dev{position:fixed;top:calc(34px + env(safe-area-inset-top));right:6px;z-index:3;display:none;
  flex-direction:column;gap:5px;padding:8px;background:rgba(0,0,0,.82);border-radius:8px}
#dev.on{display:flex}
#dev input,#dev button{font:600 11px/1.5 system-ui;color:#e8dce6;background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.16);border-radius:6px;padding:6px 9px;outline:none;cursor:pointer}
#debug{font:9.5px/1.4 ui-monospace,Consolas,monospace;color:#9fe8c8;white-space:pre;margin:0}
</style>
</head>
<body>
<canvas id="screen"></canvas>
<button id="devToggle">≡</button>
<div id="dev">
  <input id="tSeed" placeholder="seed" spellcheck="false">
  <button id="tStage">開始ステージ: 1</button>
  <button id="tFall">落下を見る</button>
  <button id="tSewer">下水を見る</button>
  <button id="tDbg">DEBUG</button>
  <pre id="debug"></pre>
</div>

<script>
"use strict";
/* 実機で「新しい版を見ているか」を確かめるための印。更新のたびに上げる */
const BUILD = "0812F";

/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {
  lanes: 5,
  speed: 68,          // 一定。ミナリの走る速さは変わらない
  ramp: 80,           // 秒。人混み・敵の速さ・点の入りが最大になるまで
  watchRamp: 55,      // 秒。監視はこれより速く増える＝路地を終わらせるのは監視の役

  hearts: 3,
  invuln: 1.3,        // 被弾後の無敵（連続で溶けないように）

  // 走っているだけで点が入る。粘るほどレートが上がる＝これが「粘る理由」
  scoreRate: { far: 10, near: 55 },
  score: { can: 30, rice: 150 },

  // 歩いてくる連中だけが速くなる。落ちているアイテムは速くならない
  enemySpeed: { far: 1.00, near: 1.70 },

  watch: {
    lifeFar: 3.0, lifeNear: 6.0,    // 監視が居座る秒数（粘るほど長い）
    catch: 1.6,                     // 見られていられる秒数。超えると見つかる
    cool: 0.9,                      // 監視外に出たとき、ゲージが戻る速さの倍率
    // 監視列に報酬は無い。危険を冒して稼ぐのはトウカフェーズの役目で、路地は生存に徹する
    // 女が叫んだときに一度に張られる列の数
    perScreamFar: 1, perScreamNear: 4,
    // 全列は塞がない。1列は必ず空ける＝難易度の問題であって理不尽にはしない
    maxLanes: 4,
  },

  spawn: {
    crowdGapFar: 1.00, crowdGapNear: 0.58,   // 人混みの間隔（時間で詰まる）
    womanFar: 8.0, womanNear: 3.4,           // 秒
    watchFar: 6.5, watchNear: 3.0,           // 秒。序盤から常に1列は監視がある（＝常に賭けられる）
    itemDist: 210,                           // 距離ごと。歩かないので時間で速くならない
    manholeDist: 820,
    grace: 95,                               // 開幕はこのぶん誰も来ない（約1秒）
  },

  // 子供と男の違いは「迫ってくる速さ」だけ。どちらも触れたらハート -1
  actors: {
    kid:      { drift:-26, w: 9, h:13 },
    man:      { drift:-46, w:11, h:18 },
    woman:    { cross: 46, w:11, h:18 },
    can:      { w: 7, h: 9 },
    rice:     { w: 9, h: 8 },
    manhole:  { w:24, h:13 },
  },

  player: { y:0.78, laneSpeed:16 },   // 後ろから来るものが無いので、前を広く見せる

  // マンホールに飛び込んだあとの落下。ここだけがハートを取り戻せる場所。
  // 捕まってトウカへ行くとこの画面を通らない＝安全な道を選んだ者だけが回復する
  // 落下中はレーンを使わず、押している方向へ緩慢に流れる。1個も取れないこともある
  fall: {
    duration: 5.0, scroll: 155, gap: 205, y: 0.32,
    accel: 58, maxVX: 17, drag: 2.2, catchR: 9,
  },

  // 下水の横スクロール。入力は1つだけ ——
  //   押しっぱなし = しゃがむ（同時にジャンプを溜める） / 放す = 溜めたぶん跳ぶ
  // 「しゃがみ続けたら必ず跳ぶ」ので、いつ放すかがそのまま判断になる
  sewer: {
    speed: 58, gravity: 520,
    minJump: 150, maxJump: 258, maxCharge: 0.55,
    playerX: 0.26,          // 画面幅に対する立ち位置。前を広く見せる
    groundY: 0.74,          // プレイ領域に対する地面の高さ
    standH: 15, crouchH: 8, bodyW: 10,

    // 蝙蝠は群れ。跳んでも上を抜けられない高さまで積むので、しゃがむしかない。
    // 向かって飛んでくるので、地形より速く迫る
    batY: 14, batW: 11, batH: 13, batN: 5, batGap: 16, batDrift: -28,

    // 低く舞う群れ。しゃがんでも当たるので跳ぶしかなく、しかも溜めないと越えられない
    lowTop: 26, lowN: 2, lowGap: 13,

    // 蛇は地を這う。しゃがんでも当たるが、溜めなしの跳躍で越えられる
    snakeW: 17, snakeH: 7,

    // 水たまりは踏んでもダメージは無い。ただしトウカに位置が伝わる
    puddleNoise: 30,

    // チーズ。走っているだけでは届かず、跳べば取れる
    cheeseW: 9, cheeseH: 9, cheeseY: 24, cheeseScore: 60,

    // 排水管＝脱出。床にあり、伏せて通ると入れる。
    // 跳躍は障害物をかわす動作でもあるので、脱出に使うと意図と事故が同じ入力になってしまう。
    // しゃがみは持続する状態なので、通過の瞬間に伏せているかどうかは必ず意思になる
    pipeDist: 540, pipeW: 26, pipeH: 12,

    noiseMax: 100, noiseDecay: 4.5,

    ramp: 2200,             // この距離をかけて下水そのものが難しくなる
    speedUp: 0.30,          // 最奥での速度の伸び
  },

  stageTime: 22,      // デバッグのステージ選択で 1 ステージぶんとみなす秒数
  hit:    { depth:13, cross:15 },
  input:  { repeatDelay:0.30, repeatInterval:0.13 },
  seed: null, debug: false,
};

/* 液晶パレット。濃淡4段のみ、中間色は持たない */
const PAL = { bg:"#e8cfdd", off:"#dcbccf", dim:"#a8778f", ink:"#4a2338", warn:"#7d2b4e" };

/* ============================================================
   PATTERNS — 歩いてくる人だけ（アイテム・女・マンホールは別枠で湧かせる）
   "." 空き / "k" 子供 / "m" 男
   ※ 1タップ1列なので、2列ぶん動かないと避けられない配置を連続させない
   ============================================================ */
const PATTERNS = [
  { len:210, rows:[ {t:0,cells:[".","k",".",".","."]}, {t:110,cells:[".",".",".","k","."]} ]},
  { len:230, rows:[ {t:0,cells:["k",".",".",".","k"]}, {t:120,cells:[".",".","m",".","."]} ]},
  { len:220, rows:[ {t:0,cells:[".",".","k",".","."]}, {t:130,cells:["k",".",".","k","."]} ]},
  { len:250, rows:[ {t:0,cells:[".","m",".","k","."]}, {t:130,cells:["k",".",".",".","m"]} ]},
  { len:240, rows:[ {t:0,cells:[".","m",".",".","."]}, {t:130,cells:[".","k",".","m","."]} ]},
  { len:260, rows:[ {t:0,cells:["m",".","k",".","."]}, {t:140,cells:[".",".",".","k","m"]} ]},
  { len:270, rows:[ {t:0,cells:["k",".",".","m","."]}, {t:140,cells:[".","m",".",".","k"]} ]},
  { len:280, rows:[ {t:0,cells:["k","m",".","m","."]}, {t:150,cells:[".",".","k",".","m"]} ]},
];
/* ============================================================
   SEWER — 下水。地面は途切れない
     bats    : 高く舞う群れ。しゃがんでかわす（跳んでも上は抜けられない）
     lows    : 低く舞う群れ。跳んでかわす。溜めないと越えられない
     snakes  : 地を這う。跳んでかわす（溜めなしでも越えられる）
     puddles : 踏んでもダメージは無いが、トウカに位置が伝わる。跳べば避けられる
     cheese  : 跳んで取るとスコア
   ============================================================ */
const SEWER = [
  { d:1, len:230, bats:[130], lows:[],    snakes:[],    puddles:[],                cheese:[60] },
  { d:1, len:240, bats:[],    lows:[],    snakes:[140], puddles:[],                cheese:[] },
  { d:1, len:250, bats:[],    lows:[],    snakes:[],    puddles:[[120,30]],        cheese:[215] },
  { d:1, len:250, bats:[],    lows:[135], snakes:[],    puddles:[],                cheese:[] },
  { d:2, len:280, bats:[90],  lows:[],    snakes:[],    puddles:[[195,32]],        cheese:[] },
  { d:2, len:290, bats:[],    lows:[],    snakes:[80],  puddles:[[195,28]],        cheese:[140] },
  { d:2, len:300, bats:[70,215], lows:[], snakes:[],    puddles:[],                cheese:[145] },
  { d:2, len:300, bats:[],    lows:[80,210], snakes:[], puddles:[],                cheese:[145] },
  { d:2, len:310, bats:[190], lows:[80],  snakes:[],    puddles:[],                cheese:[] },  // 伏せる→跳ぶ
  { d:3, len:310, bats:[],    lows:[],    snakes:[70],  puddles:[[165,34]],        cheese:[245] },
  { d:3, len:320, bats:[185], lows:[],    snakes:[],    puddles:[[100,30]],        cheese:[] },  // 跳んで避けると蝙蝠に間に合わない
  { d:3, len:330, bats:[80],  lows:[],    snakes:[190], puddles:[],                cheese:[265] },
  { d:3, len:340, bats:[],    lows:[190], snakes:[80],  puddles:[],                cheese:[] },
  { d:4, len:350, bats:[70,255], lows:[160], snakes:[], puddles:[],                cheese:[] },
  { d:4, len:360, bats:[90],  lows:[],    snakes:[],    puddles:[[175,30],[245,30]], cheese:[305] },
  { d:4, len:380, bats:[60,305], lows:[], snakes:[185], puddles:[[110,26]],        cheese:[] },
  { d:4, len:390, bats:[80],  lows:[300], snakes:[190], puddles:[],                cheese:[] },
  // 水たまりの連続。全部踏み抜くとトウカに掴まれる
  { d:3, len:340, bats:[],    lows:[],    snakes:[],    puddles:[[70,28],[150,28],[230,28]], cheese:[] },
  { d:4, len:400, bats:[300], lows:[],    snakes:[],    puddles:[[60,26],[130,26],[200,26],[262,26]], cheese:[] },
  // 跳び越えられない広さ。濡れるしかない ＝ 気配が必ず溜まる
  { d:2, len:300, bats:[],    lows:[],    snakes:[],    puddles:[[110,72]],        cheese:[240] },
  { d:3, len:340, bats:[250], lows:[],    snakes:[],    puddles:[[90,78]],         cheese:[] },
  { d:4, len:390, bats:[],    lows:[],    snakes:[280], puddles:[[80,74],[180,68]], cheese:[] },
];

/* 保証則: しゃがみと跳躍が同時に要求されないこと、届く高さであること */
function validateSewer(){
  const C=CONFIG.sewer, bad=[];
  const apex = C.maxJump*C.maxJump/(2*C.gravity);
  const head = apex + C.standH;
  const minAir = 2*C.minJump/C.gravity;

  const batTop = C.batY + C.batH + (C.batN-1)*C.batGap;
  const minApex = C.minJump*C.minJump/(2*C.gravity);
  if(batTop < head + 4) bad.push(`高い群れが低い（上端${batTop}px / 跳ぶと頭が${head.toFixed(0)}px）`);
  if(C.snakeH >= C.crouchH) bad.push("蛇が高い（しゃがんでも当たるべきだが、跳んでも当たる恐れ）");
  // 低い群れは、しゃがみでは抜けられず／溜めなしでは越えられず／溜めれば越えられること
  if(C.lowTop <= C.crouchH) bad.push("低い群れが低すぎる（しゃがみで抜けてしまう）");
  if(C.lowTop <= minApex)   bad.push("低い群れが低い（溜めなしで越えられてしまう）");
  if(C.lowTop >= apex)      bad.push("低い群れが高い（最大溜めでも越えられない）");
  if(C.cheeseY <= C.standH) bad.push("チーズが低い（走っているだけで取れる）");
  if(C.cheeseY > head)      bad.push("チーズが高い（最大溜めでも届かない）");

  SEWER.forEach((p,i)=>{
    // 跳ぶもの（蛇・低い群れ）の直後に、伏せるもの（高い群れ）が来ないこと。
    // 蝙蝠は向かってくるので、その接近ぶんも見込む
    const closing = (C.speed + Math.abs(C.batDrift)) / C.speed;
    const jumpers = [...p.snakes, ...p.lows];
    jumpers.forEach(jx=>{
      p.bats.forEach(bx=>{
        const d=bx-jx;
        if(d>0 && d < (minAir*C.speed + 16)*closing)
          bad.push(`SEWER${i}: 跳躍@${jx}の直後に高い群れ@${bx}（着地して伏せる間がない）`);
      });
    });
    // 跳ぶものどうしが近すぎないこと（着地して溜め直す間が要る）
    const js=[...jumpers].sort((a,b)=>a-b);
    js.forEach((x,k)=>{ if(k>0 && x-js[k-1] < 45)
      bad.push(`SEWER${i}: 跳躍@${js[k-1]}と@${x}が近すぎる`); });
    // 跳び越えられない水たまりは、跳ぼうとしないよう十分広いこと（中途半端を作らない）
    p.puddles.forEach(q=>{
      const reach = (2*C.maxJump/C.gravity)*C.speed;
      if(q[1] > reach-8 && q[1] < reach+10)
        bad.push(`SEWER${i}: 水たまり幅${q[1]}px が跳べるか微妙（${reach.toFixed(0)}px 前後）`);
    });
    // 伏せた直後に跳ぶものが来ないこと
    p.bats.forEach(bx=>{
      jumpers.forEach(jx=>{
        const d=jx-bx;
        if(d>0 && d < 26) bad.push(`SEWER${i}: 高い群れ@${bx}の直後に跳躍@${jx}（起き上がる間がない）`);
      });
    });
    [...p.cheese, ...jumpers].forEach(x=>{
      if(x<20 || x>p.len-20) bad.push(`SEWER${i}: 端に寄りすぎ (${x})`);
    });
  });
  if(bad.length) console.warn("[保証則/下水]\n"+bad.join("\n"));
  return bad;
}

/* 保証則: どの行にも必ず通れる列が1本ある */
function validatePatterns(){
  const bad=[];
  PATTERNS.forEach((p,i)=>p.rows.forEach(r=>{
    if(r.cells.length!==CONFIG.lanes) bad.push(`P${i} t=${r.t}: 列数 ${r.cells.length}`);
    if(r.cells.every(c=>c!==".")) bad.push(`P${i} t=${r.t}: 全列閉塞`);
  }));
  if(bad.length) console.warn("[保証則]\n"+bad.join("\n"));
  return bad;
}

/* ============================================================
   小道具
   ============================================================ */
const hashSeed=s=>{let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;};
const mulberry32=a=>()=>{a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};
let rnd=mulberry32(1);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;

/* ============================================================
   状態
   ============================================================ */
const S = {
  scene:"title",            // title | play | falling | over
  t:0, score:0, dist:0, stage:1, startStage:1,
  fallT:0, fallDist:0, fallItems:[], healed:0, fallX:0, fallVX:0,
  // 下水: y は地面からの高さ。charge は溜め秒数
  swDist:0, swY:0, swVY:0, swGround:true, swCharge:0, swHeld:false,
  swBats:[], swLows:[], swSnakes:[], swPuddles:[], swItems:[], swPipes:[],
  swCursor:0, swNoise:0, swNextPipe:0,
  hearts:CONFIG.hearts, invuln:0,
  lane:2, laneF:2,
  ents:[], watches:[], seen:0, cursor:0,   // seen = 見られている時間。列ごとではなくミナリ側に1本
  nextItem:0, nextWoman:0, nextWatch:0, nextManhole:0,
  shake:0, toasts:[], bang:0,
  end:"", best:0, seed:"",
};
/** 混み具合 0..1。人の密度・敵の速さ・点の入りはここから */
const dens  = () => clamp(S.t/CONFIG.ramp, 0, 1);
/** 監視の激化 0..1。人混みより速く進む。路地を終わらせるのはこちら */
const densW = () => clamp(S.t/CONFIG.watchRamp, 0, 1);
const scoreRate  = () => lerp(CONFIG.scoreRate.far,  CONFIG.scoreRate.near,  dens());
const enemySpeed = () => lerp(CONFIG.enemySpeed.far, CONFIG.enemySpeed.near, dens());
function toast(txt){ S.toasts.push({txt,life:1.0}); if(S.toasts.length>3) S.toasts.shift(); }

/* ------------------------------------------------------------
   この画面の終わり方。別画面と接続するときはここだけ差し替える。
     "manhole" → 次のステージへ（低リスク低リターン）
     "touka"   → トウカの画面へ（高リスク高リターン。あちらは即 GAME OVER）
     "hearts"  → ハートが尽きた。GAME OVER
   ------------------------------------------------------------ */
function finish(how){
  S.end = how;
  S.score = Math.floor(S.score);
  S.best = Math.max(S.best, S.score);
  try{ localStorage.setItem("sugake_alley_best", String(S.best)); }catch(e){}
  S.scene = "over";
}
function damage(){
  if(S.invuln>0) return false;
  S.hearts--; S.invuln = CONFIG.invuln; S.shake = 4;
  if(S.hearts<=0){ finish("hearts"); return true; }
  return false;
}

/* ============================================================
   出現
   ============================================================ */
const laneW=()=>VW/CONFIG.lanes;
const laneX=lf=>laneW()*(lf+0.5);
const add=(kind,at,lane,x,vx)=>S.ents.push({kind,at,lane,x,vx,dead:false});

/** 歩いてくる人。時間が経つほど間隔が詰まる */
function fillCrowd(){
  const gap = lerp(CONFIG.spawn.crowdGapFar, CONFIG.spawn.crowdGapNear, dens());
  while(S.cursor < S.dist + VH*1.7){
    const p = PATTERNS[Math.floor(rnd()*PATTERNS.length)];
    for(const row of p.rows) row.cells.forEach((c,i)=>{
      if(c!==".") add(c==="k"?"kid":"man", S.cursor+row.t, i);
    });
    S.cursor += p.len*gap;
  }
}
/** 落ちているもの。歩かないので、時間が経っても速くならない */
function spawnItem(){
  if(S.dist < S.nextItem) return;
  add(rnd()<0.72?"can":"rice", S.dist+VH*1.2, Math.floor(rnd()*CONFIG.lanes));
  S.nextItem = S.dist + CONFIG.spawn.itemDist*(0.7+rnd()*0.6);
}
function spawnWoman(){
  if(S.t < S.nextWoman) return;
  const L = rnd()<0.5;
  add("woman", S.dist+VH*0.55, -1, L?-14:VW+14, (L?1:-1)*CONFIG.actors.woman.cross);
  S.nextWoman = S.t + lerp(CONFIG.spawn.womanFar, CONFIG.spawn.womanNear, dens())*(0.75+rnd()*0.5);
}
function spawnManhole(){
  if(S.dist < S.nextManhole) return;
  add("manhole", S.dist+VH*1.15, Math.floor(rnd()*CONFIG.lanes));
  S.nextManhole = S.dist + CONFIG.spawn.manholeDist;
}
const watched = lane => S.watches.some(w=>w.lane===lane);
/** 一度に張られる列の数。終盤は 5 列＝全部塞がる */
const perScream = () =>
  clamp(Math.round(lerp(CONFIG.watch.perScreamFar, CONFIG.watch.perScreamNear, densW())), 1, CONFIG.lanes);

/** 監視を n 列に張る。叫ばれたときはミナリのいる列から埋める。
    ただし maxLanes を超えて張らない＝必ず 1 列は逃げ道が残る */
function addWatches(n, onPlayer){
  const life = lerp(CONFIG.watch.lifeFar, CONFIG.watch.lifeNear, densW());
  const room = CONFIG.watch.maxLanes - S.watches.length;
  if(room <= 0) return;
  n = Math.min(n, room);
  const free = [];
  for(let l=0;l<CONFIG.lanes;l++) if(!watched(l)) free.push(l);
  if(onPlayer && free.includes(S.lane)){
    free.splice(free.indexOf(S.lane),1);
    S.watches.push({lane:S.lane, life}); n--;
  }
  while(n-- > 0 && free.length){
    S.watches.push({ lane: free.splice(Math.floor(rnd()*free.length),1)[0], life });
  }
}
/** 叫ばれなくても、粘るほど監視は増えていく */
function spawnWatch(){
  if(S.t < S.nextWatch) return;
  addWatches(1, false);
  S.nextWatch = S.t + lerp(CONFIG.spawn.watchFar, CONFIG.spawn.watchNear, densW())*(0.8+rnd()*0.4);
}

/* ============================================================
   入力
   ============================================================ */
const touch={down:false,x:0,y:0,dir:0,holdT:0,reps:0,showT:0};
const edge={}, keys={left:false,right:false,hold:false};
function onDown(e){
  const p=e.touches?e.touches[0]:e;
  touch.down=true; touch.holdT=0; touch.reps=0; touch.showT=.4;
  touch.x=p.clientX; touch.y=p.clientY;
  if(S.scene==="title"||S.scene==="over"){ edge.start=true; return; }
  const r=cv.getBoundingClientRect();
  touch.dir = ((p.clientX-r.left)/r.width*VW) < VW/2 ? -1 : 1;
  // 路地は 1 タップ 1 列。落下は touch.dir を押しっぱなしで使うので edge は立てない
  if(S.scene==="play") edge[touch.dir<0?"left":"right"]=true;
}
function onMove(e){ if(!touch.down)return; const p=e.touches?e.touches[0]:e; touch.x=p.clientX; touch.y=p.clientY; }
function onUp(){ touch.down=false; touch.dir=0; }
function holdRepeat(dt){
  const R=CONFIG.input;
  if(!touch.down||!touch.dir) return;
  touch.holdT+=dt;
  if(touch.holdT<R.repeatDelay) return;
  const n=Math.floor((touch.holdT-R.repeatDelay)/R.repeatInterval);
  if(n>touch.reps){ touch.reps=n; edge[touch.dir<0?"left":"right"]=true; }
}
const cv=document.getElementById("screen");
cv.addEventListener("pointerdown",e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);onDown(e);});
cv.addEventListener("pointermove",e=>{e.preventDefault();onMove(e);});
cv.addEventListener("pointerup",e=>{e.preventDefault();onUp();});
cv.addEventListener("pointercancel",onUp);
const KEYMAP={ArrowLeft:"left",ArrowRight:"right",KeyA:"left",KeyD:"right",
              Enter:"start",Space:"hold",ArrowDown:"hold",KeyS:"hold"};
addEventListener("keydown",e=>{const n=KEYMAP[e.code];if(!n)return;e.preventDefault();
  if(n==="left"&&!keys.left){keys.left=true;edge.left=true;}
  if(n==="right"&&!keys.right){keys.right=true;edge.right=true;}
  if(n==="hold"&&!keys.hold){keys.hold=true;edge.start=true;}   // 下水では押しっぱなし＝しゃがみ
  if(n==="start")edge.start=true;});
addEventListener("keyup",e=>{const n=KEYMAP[e.code];if(!n)return;e.preventDefault();
  if(n==="left")keys.left=false; if(n==="right")keys.right=false; if(n==="hold")keys.hold=false;});

/* ============================================================
   更新
   ============================================================ */
/** 路地に入る。ステージをまたいでも t / score / hearts は引き継ぐ（難易度は上がり続ける） */
function enterAlley(){
  S.scene="play";
  S.invuln=1.4; S.lane=2; S.laneF=2;
  S.ents=[]; S.watches=[]; S.seen=0;
  // 画面の外＋1秒ぶん先から湧かせる。開幕にいきなり目の前へ現れないように
  S.cursor = S.dist + (playerY-HUD_H) + CONFIG.spawn.grace;
  S.nextItem=S.dist+CONFIG.spawn.itemDist;
  S.nextWoman=S.t+CONFIG.spawn.womanFar*0.6;
  S.nextWatch=S.t+CONFIG.spawn.watchFar;
  S.nextManhole=S.dist+CONFIG.spawn.manholeDist*(S.stage===1?0.55:1);
  fillCrowd();
}
function startRun(){
  const raw=devSeed.value.trim();
  const s = raw?hashSeed(raw):(CONFIG.seed??((Math.random()*4294967296)>>>0));
  S.seed = raw||String(s);
  rnd = mulberry32(s);
  S.stage=Math.max(1,S.startStage);
  S.t=(S.stage-1)*CONFIG.stageTime;   // デバッグでステージを飛ばしたら難易度も合わせる
  S.score=0; S.dist=0;
  S.hearts=CONFIG.hearts;
  S.toasts=[]; S.shake=0; S.bang=0; S.end="";
  enterAlley();
}

/* ------------------------------------------------------------
   落下 — マンホールに飛び込んだあと。おにぎりを拾ってハートを取り戻す
   ------------------------------------------------------------ */
function enterFall(){
  S.scene="falling"; S.fallT=0; S.fallDist=0; S.healed=0;
  S.fallX=VW/2; S.fallVX=0; S.fallItems=[];
  const total=CONFIG.fall.duration*CONFIG.fall.scroll;
  const M=18;
  for(let at=CONFIG.fall.gap; at<total-40; at+=CONFIG.fall.gap){
    S.fallItems.push({ at, x: M+rnd()*(VW-M*2), dead:false });   // 位置は完全にランダム
  }
}
/** 落下はレーンを使わない。押している方向へ緩慢に流れるだけ */
function updateFall(dt){
  const F=CONFIG.fall;
  let dir=0;
  if(touch.down) dir=touch.dir;
  if(keys.left)  dir=-1;
  if(keys.right) dir= 1;

  S.fallVX += dir*F.accel*dt;
  S.fallVX -= S.fallVX*F.drag*dt;                    // 手を離しても止まりきらない
  S.fallVX = clamp(S.fallVX, -F.maxVX, F.maxVX);
  S.fallX = clamp(S.fallX + S.fallVX*dt, 10, VW-10);
  if(S.fallX<=10 || S.fallX>=VW-10) S.fallVX=0;

  S.fallT += dt;
  S.fallDist += F.scroll*dt;

  for(const it of S.fallItems){
    if(it.dead) continue;
    if(Math.abs(it.at-S.fallDist)<CONFIG.hit.depth && Math.abs(it.x-S.fallX)<F.catchR){
      it.dead=true;
      if(S.hearts<CONFIG.hearts){ S.hearts++; S.healed++; toast("ハート回復"); }
      else { S.score+=CONFIG.score.rice; toast("+"+CONFIG.score.rice); }
    }
  }
  if(S.fallT>=F.duration) enterSewer();
}

/* ------------------------------------------------------------
   下水 — 横スクロール。入力は1つだけ
     押しっぱなし = しゃがむ（＋ジャンプを溜める） / 放す = 溜めたぶん跳ぶ
   しゃがみ続ければ必ず跳ぶことになるので、いつ放すかがそのまま判断になる
   ------------------------------------------------------------ */
/** 下水の深さ 0..1。潜るほど地形が険しくなる */
const swHeat = () => clamp(S.swDist/CONFIG.sewer.ramp, 0, 1);
const swSpeed = () => CONFIG.sewer.speed*(1+dens()*0.20+swHeat()*CONFIG.sewer.speedUp);
function fillSewer(){
  const tier = 1 + swHeat()*3;
  while(S.swCursor < S.swDist + VW*2.4){
    const pool = SEWER.filter(p=>p.d<=Math.ceil(tier));
    const p = pool[Math.floor(rnd()*pool.length)];
    // 蝙蝠は向かって飛んでくるぶん、到達までに手前へ寄る。
    // 譜面に書いた位置で出会うよう、寄る距離を足した所から飛ばす
    const drift = Math.abs(CONFIG.sewer.batDrift);
    const launch = x => {
      const at=S.swCursor+x, lead=Math.max(0,(at-S.swDist)/swSpeed());
      return at + drift*lead;
    };
    for(const x of p.bats) S.swBats.push({x:launch(x), dead:false});
    for(const x of p.lows) S.swLows.push({x:launch(x), dead:false});
    for(const x of p.snakes)  S.swSnakes.push({x:S.swCursor+x, dead:false});
    for(const q of p.puddles) S.swPuddles.push({x0:S.swCursor+q[0], x1:S.swCursor+q[0]+q[1], wet:false});
    for(const x of p.cheese)  S.swItems.push({x:S.swCursor+x, dead:false});
    S.swCursor += p.len;
  }
  // 排水管は、伏せる／跳ぶ理由が他に無い平地にだけ置く。
  // 近くに障害物があると、かわすための姿勢がそのまま脱出になってしまう
  // 蝙蝠は向かって飛んでくるので、いまの位置ではなく「プレイヤーと出会う位置」で見る
  const meet = bx => S.swDist + (bx-S.swDist)*swSpeed()/(swSpeed()+Math.abs(CONFIG.sewer.batDrift));
  const clear = x =>
    !S.swBats.some(b=>Math.abs(meet(b.x)-x)<110) &&
    !S.swLows.some(b=>Math.abs(meet(b.x)-x)<100) &&
    !S.swSnakes.some(s=>Math.abs(s.x-x)<80) &&
    !S.swItems.some(i=>Math.abs(i.x-x)<70) &&
    !S.swPuddles.some(q=>x>q.x0-80 && x<q.x1+80);
  while(S.swNextPipe < S.swDist + VW*2.0){
    let x=S.swNextPipe, ok=false;
    for(let i=0;i<80;i++){
      if(x > S.swCursor-140) break;      // 生成済みの範囲を出たら置かない
      if(clear(x)){ ok=true; break; }
      x+=12;
    }
    if(!ok) break;                       // 空きが見つからなければ次の生成に持ち越す
    S.swPipes.push({x, dead:false});
    S.swNextPipe = x + CONFIG.sewer.pipeDist;
  }
}

function enterSewer(){
  S.scene="sewer";
  S.swDist=0; S.swY=0; S.swVY=0; S.swGround=true; S.swCharge=0; S.swHeld=false;
  S.swBats=[]; S.swLows=[]; S.swSnakes=[]; S.swPuddles=[]; S.swItems=[]; S.swPipes=[];
  S.swCursor=0; S.swNoise=0;
  S.swNextPipe=CONFIG.sewer.pipeDist*0.8; S.invuln=1.0;
  fillSewer();
}
function updateSewer(dt){
  const C=CONFIG.sewer;
  const held = touch.down || keys.hold;

  S.swDist += swSpeed()*dt;
  S.invuln = Math.max(0,S.invuln-dt);
  fillSewer();

  // 静かにしていれば、伝わった気配は薄れていく
  S.swNoise = Math.max(0, S.swNoise - C.noiseDecay*dt);

  if(S.swGround){
    if(held) S.swCharge = Math.min(C.maxCharge, S.swCharge+dt);
    else if(S.swHeld){                       // 放した瞬間に跳ぶ
      S.swVY = lerp(C.minJump, C.maxJump, S.swCharge/C.maxCharge);
      S.swCharge = 0; S.swGround = false;
      S.swY += S.swVY*dt;                    // その場で浮かせる。1フレーム棒立ちにしない
    }
  } else {
    S.swVY -= C.gravity*dt;
    S.swY  += S.swVY*dt;
    if(S.swY<=0){ S.swY=0; S.swVY=0; S.swGround=true; }
  }
  S.swHeld = held;

  // 水たまり。踏んでもダメージは無いが、水が跳ねてトウカに位置が伝わる
  for(const q of S.swPuddles){
    if(q.wet) continue;
    if(S.swDist>q.x0 && S.swDist<q.x1 && S.swY<=1){
      q.wet=true;
      S.swNoise = Math.min(C.noiseMax, S.swNoise + C.puddleNoise);
      S.shake=Math.max(S.shake,2.4); toast("水を踏んだ");
    }
  }
  // 気配が積もりきると、トウカに位置を掴まれる
  if(S.swNoise >= C.noiseMax) return finish("touka");

  // 水に落ちた
  if(S.swY < -34){
    if(damage()) return;
    const g=S.swGaps.find(g=>S.swDist>g.x0 && S.swDist<g.x1);
    S.swDist = g ? g.x1+10 : S.swDist+24;
    S.swY=0; S.swVY=0; S.swGround=true; S.swCharge=0;
    S.invuln=Math.max(S.invuln,1.2); S.shake=4; toast("落ちた");
  }

  const h = (S.swGround && held) ? C.crouchH : C.standH;

  // 蝙蝠の群れ。向かって飛んでくるので地形より速い。跳んでも上は抜けられない
  const batTop = C.batY + C.batH + (C.batN-1)*C.batGap;
  for(const b of S.swBats){
    if(b.dead) continue;
    b.x += C.batDrift*dt;
    if(S.invuln>0) continue;
    if(Math.abs(b.x-S.swDist) > (C.bodyW+C.batW)/2) continue;
    if(S.swY < batTop && S.swY+h > C.batY){
      b.dead=true;
      if(damage()) return;
      toast("蝙蝠");
    }
  }
  // 低く舞う群れ。しゃがんでも当たる。溜めないと越えられない高さ
  for(const b of S.swLows){
    if(b.dead) continue;
    b.x += C.batDrift*dt;
    if(S.invuln>0) continue;
    if(Math.abs(b.x-S.swDist) > (C.bodyW+C.batW)/2) continue;
    if(S.swY < C.lowTop){
      b.dead=true;
      if(damage()) return;
      toast("蝙蝠");
    }
  }
  // 蛇は地を這う。しゃがんでも当たるので跳ぶしかない
  for(const s of S.swSnakes){
    if(s.dead || S.invuln>0) continue;
    if(Math.abs(s.x-S.swDist) > (C.bodyW+C.snakeW)/2) continue;
    if(S.swY < C.snakeH){
      s.dead=true;
      if(damage()) return;
      toast("蛇");
    }
  }
  // チーズ。走っているだけでは届かない
  for(const it of S.swItems){
    if(it.dead) continue;
    if(Math.abs(it.x-S.swDist) > (C.bodyW+C.cheeseW)/2) continue;
    if(S.swY+h >= C.cheeseY && S.swY <= C.cheeseY+C.cheeseH){
      it.dead=true; S.score += C.cheeseScore; toast("+"+C.cheeseScore);
    }
  }
  // 排水管は床にある。伏せて通れば地上へ＝抜けるかどうかは自分で決める
  for(const P of S.swPipes){
    if(P.dead) continue;
    if(Math.abs(P.x-S.swDist) > (C.bodyW+C.pipeW)/2) continue;
    if(S.swGround && held){ P.dead=true; S.stage++; return enterAlley(); }
  }

  const back = S.swDist-VW;
  S.swBats    = S.swBats.filter(b=>!b.dead && b.x > back);
  S.swLows    = S.swLows.filter(b=>!b.dead && b.x > back);
  S.swSnakes  = S.swSnakes.filter(s=>!s.dead && s.x > back);
  S.swPuddles = S.swPuddles.filter(q=>q.x1 > back);
  S.swItems   = S.swItems.filter(i=>!i.dead && i.x > back);
  S.swPipes   = S.swPipes.filter(P=>!P.dead && P.x > back);
}
function hits(e){
  if(e.kind==="woman") return Math.abs(e.at-S.dist)<CONFIG.hit.depth && Math.abs(e.x-laneX(S.laneF))<CONFIG.hit.cross;
  return Math.abs(e.at-S.dist)<CONFIG.hit.depth && e.lane===S.lane;
}

/** 監視。見られている時間はミナリ側に1本。
    列ごとに分けると、全列が監視されていても移り続けるだけで避けられてしまう */
function updateWatches(dt){
  for(const w of S.watches) w.life -= dt;
  S.watches = S.watches.filter(w=>w.life>0);

  if(watched(S.lane)) S.seen += dt;
  else                S.seen = Math.max(0, S.seen - dt*CONFIG.watch.cool);

  if(S.seen >= CONFIG.watch.catch){ S.bang=1; finish("touka"); return true; }
  return false;
}

function updatePlay(dt){
  holdRepeat(dt);
  if(edge.left)  S.lane=clamp(S.lane-1,0,CONFIG.lanes-1);
  if(edge.right) S.lane=clamp(S.lane+1,0,CONFIG.lanes-1);
  S.laneF += (S.lane-S.laneF)*clamp(CONFIG.player.laneSpeed*dt,0,1);

  S.dist += CONFIG.speed*dt;
  // 生き延びているだけで点が入る。粘るほどレートが上がる＝長く生きた者が報われる
  S.score += scoreRate()*dt;
  S.invuln=Math.max(0,S.invuln-dt);
  fillCrowd(); spawnItem(); spawnWoman(); spawnWatch(); spawnManhole();

  if(updateWatches(dt)) return;   // 見つかった＝トウカの画面へ

  const es=enemySpeed();
  for(const e of S.ents){
    if(e.dead) continue;
    const A=CONFIG.actors[e.kind];
    if(e.kind==="woman") e.x += e.vx*es*dt;
    else if(A.drift)     e.at += A.drift*es*dt;   // 歩く連中だけ速くなる

    if(!hits(e)) continue;

    if(e.kind==="manhole") return enterFall();      // 飛び込む → 落下（回復の機会）

    if(e.kind==="can" || e.kind==="rice"){
      e.dead=true;
      const p = CONFIG.score[e.kind];
      S.score += p; toast("+"+p);
      continue;
    }
    if(S.invuln>0) continue;

    if(e.kind==="woman"){ e.dead=true; const n=perScream(); addWatches(n,true);
                          S.shake=4; toast(n>1?`叫ばれた x${n}`:"叫ばれた"); continue; }
    if(e.kind==="kid" || e.kind==="man"){ e.dead=true; if(damage()) return; toast("ぶつかった"); continue; }
  }

  S.ents = S.ents.filter(e=>!e.dead && e.at>S.dist-VH*0.5 && e.at<S.dist+VH*2.4
                            && !(e.kind==="woman"&&(e.x<-30||e.x>VW+30)));
}
function update(dt){
  S.t+=dt;
  S.shake=Math.max(0,S.shake-dt*8);
  S.bang=Math.max(0,S.bang-dt*1.6);
  touch.showT=Math.max(0,touch.showT-dt);
  for(const t of S.toasts) t.life-=dt;
  S.toasts=S.toasts.filter(t=>t.life>0);
  if(S.scene==="falling") return updateFall(dt);
  if(S.scene==="sewer")   return updateSewer(dt);
  if(S.scene!=="play"){ if(edge.start) startRun(); return; }
  updatePlay(dt);
}

/* ============================================================
   描画
   ============================================================ */
const ctx=cv.getContext("2d",{alpha:false});
let VW=180, VH=320, playerY=0, lastW=0, lastH=0;
const HUD_H=24;
function resize(){
  lastW=innerWidth; lastH=innerHeight;
  const w=Math.max(1,innerWidth||1), h=Math.max(1,innerHeight||1);
  const a=isFinite(w/h)?w/h:0.5625;
  VW=Math.round(VH*clamp(a,0.42,0.80));
  cv.width=VW; cv.height=VH;
  ctx.imageSmoothingEnabled=false;
  playerY=HUD_H+(VH-HUD_H)*CONFIG.player.y;
}
addEventListener("resize",resize);

const px=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w|0,h|0);};
/** 楕円はドットで打つ。ctx.stroke は液晶にない中間色を作る */
function ring(cx,cy,rx,ry,c,thick){
  ctx.fillStyle=c;
  const n=Math.max(14,Math.ceil(Math.max(rx,ry)*6.5));
  for(let i=0;i<n;i++){const a=i/n*6.2832;
    ctx.fillRect(Math.round(cx+Math.cos(a)*rx),Math.round(cy+Math.sin(a)*ry),thick||1,thick||1);}
}
const GLYPHS={
  "0":"11111 10001 10001 10001 11111","1":"00100 01100 00100 00100 01110",
  "2":"11111 00001 11111 10000 11111","3":"11111 00001 01111 00001 11111",
  "4":"10001 10001 11111 00001 00001","5":"11111 10000 11111 00001 11111",
  "6":"11111 10000 11111 10001 11111","7":"11111 00001 00010 00100 00100",
  "8":"11111 10001 11111 10001 11111","9":"11111 10001 11111 00001 11111",
  "-":"00000 00000 11111 00000 00000","+":"00000 00100 01110 00100 00000",
  "!":"00100 00100 00100 00000 00100",
  "A":"01110 10001 11111 10001 10001","B":"11110 10001 11110 10001 11110",
  "C":"01111 10000 10000 10000 01111","D":"11110 10001 10001 10001 11110",
  "E":"11111 10000 11110 10000 11111","F":"11111 10000 11110 10000 10000",
  "G":"01111 10000 10011 10001 01111","H":"10001 10001 11111 10001 10001",
  "I":"11111 00100 00100 00100 11111","K":"10001 10010 11100 10010 10001",
  "L":"10000 10000 10000 10000 11111","M":"10001 11011 10101 10001 10001",
  "N":"10001 11001 10101 10011 10001","O":"01110 10001 10001 10001 01110",
  "P":"11110 10001 11110 10000 10000","R":"11110 10001 11110 10100 10011",
  "S":"01111 10000 01110 00001 11110","T":"11111 00100 00100 00100 00100",
  "U":"10001 10001 10001 10001 01110","V":"10001 10001 10001 01010 00100",
  "W":"10001 10001 10101 11011 10001","X":"10001 01010 00100 01010 10001",
  "Y":"10001 01010 00100 00100 00100","Z":"11111 00010 00100 01000 11111",
  " ":"00000 00000 00000 00000 00000",
};
const tw=(s,sc=1)=>String(s).length*6*sc-sc;
function text(str,x,y,c,sc=1){
  let cx=x;
  for(const ch of String(str).toUpperCase()){
    const g=GLYPHS[ch];
    if(g){const rows=g.split(" ");
      for(let r=0;r<5;r++)for(let i=0;i<5;i++) if(rows[r][i]==="1") px(cx+i*sc,y+r*sc,sc,sc,c);}
    cx+=6*sc;
  }
}
const textC=(s,y,c,sc=1)=>text(s,Math.round((VW-tw(s,sc))/2),y,c,sc);
const screenY = at => playerY-(at-S.dist);

const HEART=["0110110","1111111","1111111","0111110","0011100","0001000"];
function heart(x,y,c){
  for(let r=0;r<6;r++) for(let i=0;i<7;i++) if(HEART[r][i]==="1") px(x+i,y+r,1,1,c);
}
function figure(cx,by,w,h,c,o){
  o=o||{};
  const hw=Math.round(w/2), hh=Math.round(h*0.32);
  px(cx-hw,by-h+hh,w,h-hh,c);
  px(cx-Math.round(w*0.3),by-h,Math.round(w*0.6),hh,c);
  if(o.skirt) px(cx-hw-2,by-5,w+4,5,c);
}
function drawMinari(cx,by){
  px(cx-5,by-15,10,15,PAL.ink);
  px(cx-8,by-20,5,6,PAL.ink); px(cx+3,by-20,5,6,PAL.ink);
  px(cx-2,by-12,4,2,PAL.bg);
  px(cx-1,by-1,3,6,PAL.ink);
}
function drawActor(e){
  const A=CONFIG.actors[e.kind], y=screenY(e.at);
  if(y<HUD_H-28||y>VH+28) return;
  const x = e.kind==="woman" ? e.x : laneX(e.lane);
  switch(e.kind){
    case "manhole": {
      const bl=Math.floor(S.t*7)%2===0;
      ring(x,y,A.w/2,A.h/2,bl?PAL.ink:PAL.dim,2);
      ring(x,y,A.w/2-5,A.h/2-4,PAL.dim);
      break;
    }
    case "can":                                   // 空き缶: 縦長
      px(x-3,y-9,7,9,PAL.dim); px(x-3,y-9,7,1,PAL.ink); px(x-3,y-1,7,1,PAL.ink);
      break;
    case "rice":                                  // おにぎり: 三角＋海苔
      for(let r=0;r<8;r++) px(x-Math.round(r*0.6),y-8+r,Math.max(1,Math.round(r*1.2)),1,PAL.dim);
      px(x-3,y-3,6,3,PAL.ink);
      break;
    case "man":   figure(x,y,A.w,A.h,PAL.ink); break;
    case "woman": figure(x,y,A.w,A.h,PAL.dim,{skirt:true}); break;
    default:      figure(x,y,A.w,A.h,PAL.dim); break;   // 子供
  }
}

/** 監視されている列。目はミナリの視線の先＝画面の上。列そのものもハッチで示す */
function drawWatches(){
  const blink = Math.floor(S.t*6)%2===0;
  for(const w of S.watches){
    const x0=laneW()*w.lane, ww=laneW(), cx=x0+ww/2;
    for(let y=HUD_H+2;y<VH;y+=6) px(x0+2,y,ww-4,1,PAL.off);
    px(x0+1,HUD_H,1,VH-HUD_H,PAL.dim); px(x0+ww-2,HUD_H,1,VH-HUD_H,PAL.dim);
    ring(cx,HUD_H+10,7,5,blink?PAL.ink:PAL.dim);
    px(cx-2,HUD_H+8,4,4,PAL.ink);
  }
}
/** 見られている時間。ミナリの真上に1本 */
function drawSeen(cx,by){
  const k=clamp(S.seen/CONFIG.watch.catch,0,1);
  if(k<=0) return;
  const w=22, x=cx-w/2, y=by-30;
  px(x-1,y-1,w+2,5,PAL.bg);
  px(x,y,Math.round(w*k),3, k>0.6?PAL.warn:PAL.ink);
  if(k>0.6 && Math.floor(S.t*12)%2===0) text("!",cx-2,y-9,PAL.warn);
}

function drawAlley(){
  px(0,HUD_H,VW,VH-HUD_H,PAL.bg);
  const off=S.dist%26;
  for(let y=HUD_H-26;y<VH+26;y+=26) px(0,y+off,VW,1,PAL.off);
  for(let i=1;i<CONFIG.lanes;i++) px(laneW()*i,HUD_H,1,VH-HUD_H,PAL.off);
  px(0,HUD_H,2,VH-HUD_H,PAL.dim); px(VW-2,HUD_H,2,VH-HUD_H,PAL.dim);

  drawWatches();
  for(const e of S.ents) if(!e.dead) drawActor(e);
  if(!(S.invuln>0 && Math.floor(S.t*14)%2===0)) drawMinari(laneX(S.laneF),playerY);
  drawSeen(laneX(S.laneF),playerY);

  let ty=HUD_H+4;
  for(const t of S.toasts){ text(t.txt.slice(0,10),4,ty,PAL.ink); ty+=8; }
  if(touch.down||touch.showT>0){
    const r=cv.getBoundingClientRect();
    ring((touch.x-r.left)/r.width*VW,(touch.y-r.top)/r.height*VH,8,8,PAL.dim);
  }
}
/** 落下。路地とは上下が逆で、おにぎりは下から昇ってくる */
function drawFall(){
  const fy = HUD_H+(VH-HUD_H)*CONFIG.fall.y;
  px(0,HUD_H,VW,VH-HUD_H,PAL.bg);
  // 縦穴の壁。上へ流れる＝落ちている
  const off = S.fallDist%22;
  for(let y=VH+22; y>HUD_H-22; y-=22){
    const yy=y-off;
    px(0,yy,7,2,PAL.dim); px(VW-7,yy,7,2,PAL.dim);
  }
  px(0,HUD_H,4,VH-HUD_H,PAL.off); px(VW-4,HUD_H,4,VH-HUD_H,PAL.off);

  for(const it of S.fallItems){
    if(it.dead) continue;
    const y = fy + (it.at - S.fallDist);
    if(y<HUD_H-16||y>VH+16) continue;
    const x=it.x;
    for(let r=0;r<8;r++) px(x-Math.round(r*0.6),y-8+r,Math.max(1,Math.round(r*1.2)),1,PAL.dim);
    px(x-3,y-3,6,3,PAL.ink);
  }
  drawMinari(S.fallX, fy);

  const left=Math.max(0,CONFIG.fall.duration-S.fallT);
  textC("FALLING",HUD_H+8,PAL.dim);
  textC(left.toFixed(1),HUD_H+18,PAL.ink);
  let ty=VH-58;
  for(const t of S.toasts){ textC(t.txt.slice(0,10),ty,PAL.ink); ty+=9; }
  textC("SEWER NOT BUILT",VH-24,PAL.off);
  textC("BACK TO ALLEY",VH-14,PAL.off);
}

/** 下水。横スクロールなので、路地・落下とは軸そのものが違う */
function drawMinariSide(cx,by,crouch){
  const h = crouch?CONFIG.sewer.crouchH:CONFIG.sewer.standH;
  px(cx-5,by-h,10,h,PAL.ink);
  px(cx-8,by-h-5,5,6,PAL.ink); px(cx+3,by-h-5,5,6,PAL.ink);   // 耳
  px(cx-2,by-h+3,4,2,PAL.bg);                                  // 目
  px(cx+5,by-3,6,2,PAL.ink);                                   // しっぽ
}
function drawSewerScene(){
  const C=CONFIG.sewer;
  const gy = HUD_H+(VH-HUD_H)*C.groundY;
  const pxs = Math.round(VW*C.playerX);
  const toScreen = wx => pxs + (wx - S.swDist);

  px(0,HUD_H,VW,VH-HUD_H,PAL.bg);
  px(0,HUD_H,VW,5,PAL.dim);                                    // 天井
  for(let i=0;i<9;i++){
    const x = VW - ((S.swDist*0.55 + i*27) % (VW+22));
    px(x,HUD_H+5,1,3,PAL.off);                                 // 天井のしずく
  }
  // 地面は途切れない
  px(0,gy,VW,2,PAL.ink);
  px(0,gy+2,VW,VH-gy-2,PAL.off);
  for(let i=0;i<10;i++){
    const x=VW-((S.swDist*1.0+i*26)%(VW+26));
    px(x,gy+5,10,1,PAL.dim);                                   // 床のタイル目地
  }
  // 水たまり。床がくぼんで水が溜まっている。縁を濃く、中を明るく、さざ波を流す
  for(const q of S.swPuddles){
    const x0=Math.max(0,toScreen(q.x0)), x1=Math.min(VW,toScreen(q.x1));
    if(x1<=0||x0>=VW) continue;
    const w=Math.max(0,x1-x0), D=5;
    px(x0,gy,w,D,PAL.bg);                                   // くぼみ（床を抜く）
    px(x0,gy,w,1,PAL.ink); px(x0,gy+D-1,w,1,PAL.ink);       // 上下の縁
    if(toScreen(q.x0)>=0) px(x0,gy,1,D,PAL.ink);
    if(toScreen(q.x1)<=VW) px(x1-1,gy,1,D,PAL.ink);
    for(let i=0;i<Math.floor(w/9);i++){                      // さざ波
      const o=Math.round(Math.sin(i*1.7+S.t*4)*1.5);
      px(x0+4+i*9+o, gy+2, 4, 1, PAL.dim);
    }
    if(q.wet) ring(x0+w/2, gy+2, w*0.45, 3, PAL.ink);        // 踏んだあとの波紋
  }
  // 蛇
  for(const s of S.swSnakes){
    const sx=toScreen(s.x);
    if(sx<-20||sx>VW+20) continue;
    const wig=Math.floor(S.t*8)%2?1:0;
    px(sx-8,gy-C.snakeH+wig,16,3,PAL.ink);
    px(sx-8,gy-3,5,3,PAL.ink); px(sx+2,gy-3,6,3,PAL.ink);
    px(sx+6,gy-C.snakeH-1+wig,4,3,PAL.ink);                     // 頭
  }
  // チーズ
  for(const it of S.swItems){
    const sx=toScreen(it.x);
    if(sx<-14||sx>VW+14) continue;
    const cy=gy-C.cheeseY-C.cheeseH;
    for(let r=0;r<C.cheeseH;r++) px(sx-4+Math.round(r*0.35),cy+r,C.cheeseW-Math.round(r*0.7),1,PAL.dim);
    px(sx-2,cy+3,2,2,PAL.bg); px(sx+1,cy+6,2,2,PAL.bg);
  }
  // 脱出の排水管。床の高さに口が開いている。伏せて通れば入れる
  for(const P of S.swPipes){
    const sx=toScreen(P.x)-C.pipeW/2;
    if(sx<-34||sx>VW+34) continue;
    px(sx,gy-C.pipeH,C.pipeW,C.pipeH,PAL.ink);
    px(sx+3,gy-C.pipeH+3,C.pipeW-6,C.pipeH-3,PAL.bg);
    px(sx-2,gy-C.pipeH-2,C.pipeW+4,3,PAL.ink);
    for(let y=gy-C.pipeH+4;y<gy;y+=3) px(sx+4,y,C.pipeW-8,1,PAL.dim);
    if(Math.floor(S.t*4)%2===0){                      // 伏せろ、の合図
      const cx=sx+C.pipeW/2;
      for(let i=0;i<5;i++) px(cx-i, gy-C.pipeH-11+i, 1+i*2, 1, PAL.warn);
    }
  }
  // 蝙蝠の群れ
  const swarm=(sx,baseY,n,gap)=>{
    const flap=Math.floor(S.t*9)%2?2:0;
    for(let k=0;k<n;k++){
      const by=baseY-k*gap, jig=(k%2?2:-2);
      px(sx-3+jig,by+4,6,7,PAL.ink);
      px(sx-9+jig,by+2+flap,6,3,PAL.ink); px(sx+3+jig,by+2+flap,6,3,PAL.ink);
      px(sx-3+jig,by+1,2,3,PAL.ink); px(sx+1+jig,by+1,2,3,PAL.ink);
    }
  };
  for(const b of S.swBats){                           // 高い群れ: 伏せて抜ける
    const sx=toScreen(b.x);
    if(sx<-16||sx>VW+16) continue;
    swarm(sx, gy-C.batY-C.batH, C.batN, C.batGap);
  }
  for(const b of S.swLows){                           // 低い群れ: 跳んで越える
    const sx=toScreen(b.x);
    if(sx<-16||sx>VW+16) continue;
    swarm(sx, gy-C.batH+1, C.lowN, C.lowGap);
  }
  // ミナリ
  const held = touch.down || keys.hold;
  const crouch = S.swGround && held;
  const by = gy - S.swY;
  if(!(S.invuln>0 && Math.floor(S.t*14)%2===0)) drawMinariSide(pxs,by,crouch);
  // 溜め
  if(S.swCharge>0){
    const k=S.swCharge/C.maxCharge, w=16, h=crouch?C.crouchH:C.standH;
    px(pxs-w/2-1, by-h-15, w+2, 5, PAL.bg);
    px(pxs-w/2,   by-h-14, Math.round(w*k), 3, k>=0.995?PAL.warn:PAL.ink);
  }

  // 振動ゲージ。着地のたびに跳ね上がり、地に足がついている間だけ静まる
  const k=clamp(S.swNoise/C.noiseMax,0,1);
  const gw=VW-8;
  px(4,HUD_H+4,gw,5,PAL.bg);
  px(4,HUD_H+4,Math.round(gw*k),5, k>0.7?PAL.warn:PAL.ink);
  px(4,HUD_H+3,gw,1,PAL.dim);
  if(k>0.7 && Math.floor(S.t*8)%2===0) textC("SHE FEELS YOU",HUD_H+12,PAL.warn);

  let ty=HUD_H+22;
  for(const t of S.toasts){ text(t.txt.slice(0,10),4,ty,PAL.ink); ty+=8; }
}

function drawHUD(){
  px(0,0,VW,HUD_H,PAL.off);
  px(0,HUD_H-1,VW,1,PAL.dim);
  text(String(Math.min(Math.floor(S.score),9999999)).padStart(6,"0"),4,3,PAL.ink);
  // 毎秒いくら入っているか。生き延びるほど増えるので、粘る理由がそのまま見える
  text("+"+Math.round(scoreRate()), 4, 12, PAL.dim);
  const st="ST"+S.stage;
  text(st, Math.round((VW-tw(st))/2), 12, PAL.dim);
  for(let i=0;i<CONFIG.hearts;i++) heart(VW-4-(i+1)*9, 5, i<S.hearts?PAL.ink:PAL.bg);
}
function drawTitle(){
  px(0,0,VW,VH,PAL.bg);
  textC("SUGAKE",50,PAL.ink,2);
  textC("STALKING",70,PAL.ink,2);
  textC("ALLEY",94,PAL.dim);
  drawMinari(VW/2,148);
  for(let i=0;i<3;i++) heart(VW/2-13+i*9,160,PAL.ink);
  px(Math.round(VW*.12),176,Math.round(VW*.76),1,PAL.off);
  textC("TAP LEFT OR RIGHT",192,PAL.ink);
  textC("TAKE CANS AND RICE",212,PAL.dim);
  textC("DODGE KIDS AND MEN",224,PAL.dim);
  textC("LEAVE WATCHED LANES",236,PAL.dim);
  textC("MANHOLE TO ESCAPE",252,PAL.dim);
  textC("CATCH RICE TO HEAL",264,PAL.dim);
  if(Math.floor(S.t*2)%2===0) textC("TAP TO START",286,PAL.ink);
  if(S.startStage>1) textC("DEBUG  START AT ST"+S.startStage,296,PAL.warn);
  textC("BEST "+S.best,306,PAL.dim);
  text(BUILD, VW-tw(BUILD)-3, VH-8, PAL.off);   // どの版を見ているかの確認用
}
function drawOver(){
  px(0,0,VW,VH,PAL.bg);
  const spotted = S.end==="touka";
  textC(spotted?"SPOTTED !":"GAME OVER", 52, PAL.warn);
  if(spotted){
    ring(VW/2,112,9,7,PAL.ink,2); px(VW/2-3,110,6,6,PAL.ink);
    textC("TOUKA SCREEN",150,PAL.dim); textC("NOT BUILT YET",162,PAL.off);
  } else {
    for(let i=0;i<CONFIG.hearts;i++) heart(VW/2-13+i*9,110,PAL.bg);
    textC("NO HEARTS LEFT",150,PAL.dim);
  }
  [["SCORE",S.score],["BEST",S.best],["STAGE",S.stage],["TIME",Math.round(S.t)]].forEach(([k,v],i)=>{
    const y=190+i*16;
    text(k,Math.round(VW*.18),y,PAL.dim);
    text(String(v),VW-tw(String(v))-Math.round(VW*.18),y,PAL.ink);
  });
  if(Math.floor(S.t*2)%2===0) textC("TAP TO RETRY",278,PAL.ink);
}
function render(){
  // 揺らすとずれたぶん画面端が塗り残る。先に全面を下地で埋めておく
  px(0,0,VW,VH,PAL.bg);
  ctx.save();
  if(S.shake>0.05){ const j=()=>Math.round((rnd()*2-1)*S.shake); ctx.translate(j(),j()); }
  if(S.scene==="title") drawTitle();
  else if(S.scene==="over") drawOver();
  else if(S.scene==="falling"){ drawFall(); drawHUD(); }
  else if(S.scene==="sewer"){ drawSewerScene(); drawHUD(); }
  else { drawAlley(); drawHUD(); }
  ctx.restore();
}

/* ============================================================
   ループ
   ============================================================ */
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  if(innerWidth!==lastW||innerHeight!==lastH) resize();
  update(dt); render(); updateDebug();
  for(const k in edge) delete edge[k];
  requestAnimationFrame(frame);
}

/* 開発用 */
const devSeed=document.getElementById("tSeed"), dbg=document.getElementById("debug");
document.getElementById("devToggle").onclick=()=>document.getElementById("dev").classList.toggle("on");
document.getElementById("tDbg").onclick=()=>{CONFIG.debug=!CONFIG.debug;};
// デバッグ: 開始ステージを選ぶ。難易度（通算時間）もそのぶん進めた状態で始まる
const tStage=document.getElementById("tStage");
tStage.onclick=()=>{
  S.startStage = S.startStage>=8 ? 1 : S.startStage+1;
  tStage.textContent = "開始ステージ: "+S.startStage;
};
document.getElementById("tFall").onclick=()=>{
  if(S.scene==="title"||S.scene==="over") startRun();
  enterFall();
};
document.getElementById("tSewer").onclick=()=>{
  if(S.scene==="title"||S.scene==="over") startRun();
  enterSewer();
};
function updateDebug(){
  if(!CONFIG.debug){ if(dbg.textContent) dbg.textContent=""; return; }
  const c={};
  for(const e of S.ents) if(!e.dead) c[e.kind]=(c[e.kind]||0)+1;
  dbg.textContent=
`${S.scene} t${S.t.toFixed(1)} seed ${S.seed}
HEART ${S.hearts}${S.scene==="sewer"?`  SW heat ${swHeat().toFixed(2)} noise ${S.swNoise.toFixed(0)}/${CONFIG.sewer.noiseMax} spd ${swSpeed().toFixed(0)} dist ${S.swDist.toFixed(0)}`:""}
DENS ${dens().toFixed(2)} gap x${lerp(CONFIG.spawn.crowdGapFar,CONFIG.spawn.crowdGapNear,dens()).toFixed(2)}
RATE +${scoreRate().toFixed(0)}/s  enemy x${enemySpeed().toFixed(2)}
WATCH ${S.watches.length}/${CONFIG.lanes} 列 [${S.watches.map(w=>w.lane).sort().join(",")||"-"}] 叫び=${perScream()}列 densW ${densW().toFixed(2)}
SEEN  ${S.seen.toFixed(2)}/${CONFIG.watch.catch}
SCORE ${S.score} dist ${S.dist.toFixed(0)}
ENTS ${JSON.stringify(c)}  VIEW ${VW}x${VH}`;
}

try{ S.best=parseInt(localStorage.getItem("sugake_alley_best")||"0",10)||0; }catch(e){}
validatePatterns();
validateSewer();
resize();
rnd=mulberry32(hashSeed("boot"));
requestAnimationFrame(frame);
</script>
