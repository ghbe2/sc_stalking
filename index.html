/* FONT:END */
/* 焼いたフォントで字を置く。F6 は注記、F8 は見出しと数字。
   TTF を直接描くとアンチエイリアスで中間色が出るので、二値の字形を打つ */
let FONT = null;      // 既定の書体。resize で決める
const tw=(s,sc=1,f)=>{ f=f||FONT; return String(s).length*(f.w+1)*sc-sc; };
function text(str,x,y,c,sc=1,f){
  f = f || FONT;
  let cx=Math.round(x);
  for(const ch of String(str)){
    const g = f.g[ch] || f.g[ch.toUpperCase()] || f.g[" "];
    if(g){
      const rows=g.split(" ");
      for(let r=0;r<f.h;r++){
        const line=rows[r];
        let run=-1;
        for(let i=0;i<=f.w;i++){
          const on = i<f.w && line[i]==="1";
          if(on && run<0) run=i;
          if(!on && run>=0){ px(cx+run*sc, y+r*sc, (i-run)*sc, sc, c); run=-1; }
        }
      }
    }
    cx+=(f.w+1)*sc;
  }
}
const textC=(s,y,c,sc=1,f)=>text(s,Math.round((VW-tw(s,sc,f))/2),y,c,sc,f);
const textR=(s,x,y,c,sc=1,f)=>text(s,Math.round(x-tw(s,sc,f)),y,c,sc,f);
/** 好きな位置を中心にして置く */
const textC2=(s,cx,y,c,f,sc=1)=>text(s,Math.round(cx-tw(s,sc,f)/2),y,c,sc,f);

/** その場で「何をすればいいか」を言う札。
    説明画面を挟むより、対象の隣に短く出したほうが手が動く。
    地を敷いてから字を置くので、背景に紛れない */
function hint(str, cx, y, c=PAL.warn){
  if(Math.floor(S.t*3)%4===3) return;          // ゆっくり点滅させて視線を呼ぶ
  const w=tw(str), x=Math.round(clamp(cx-w/2, 2, VW-w-2));
  px(x-2, y-2, w+4, 9, PAL.bg);
  px(x-2, y-2, w+4, 1, c); px(x-2, y+6, w+4, 1, c);
  text(str, x, y, c);
}
const screenY = at => playerY-(at-S.dist);

const HEART=["0110110","1111111","1111111","0111110","0011100","0001000"];
function heart(x,y,c,sc=1){
  for(let r=0;r<6;r++) for(let i=0;i<7;i++) if(HEART[r][i]==="1") px(x+i*sc,y+r*sc,sc,sc,c);
}
function figure(cx,by,w,h,c,o){
  o=o||{};
  const hw=Math.round(w/2), hh=Math.round(h*0.32);
  px(cx-hw,by-h+hh,w,h-hh,c);
  px(cx-Math.round(w*0.3),by-h,Math.round(w*0.6),hh,c);
  if(o.skirt) px(cx-hw-2,by-5,w+4,5,c);
}
/* コマ送りは S.t ではなく S.animT を見る。S.t はタイトルと結果の画面で
   止めてあるので、そこだけ絵が固まってしまう */
/** 2枚を交互に。歩幅の速さは hz で決める */
const anim = (a,b,hz)=> Math.floor(S.animT*hz)%2 ? b : a;
/** 4枚で1周。A→A′→B→B′ の順に回す */
const anim4 = (a,a2,b,b2,hz)=> [a,a2,b,b2][Math.floor(S.animT*hz)%4];
/** 点滅。hz 回/秒で入り切りする */
const blink = (hz=2)=> Math.floor(S.animT*hz)%2===0;
/** 大きい「！」。網が来る列の予告。字では小さすぎて読めなかった */
function bangMark(cx, ty){
  const w=14, h1=38, gap=9, h2=14;
  const L=Math.round(cx-w/2);
  // 地を先に敷く。奥のトウカたちに重なっても輪郭が立つ
  px(L-3, ty-3, w+6, h1+6, PAL.bg);
  px(L-3, ty+h1+gap-3, w+6, h2+6, PAL.bg);
  px(L, ty, w, h1, PAL.warn);
  px(L, ty+h1+gap, w, h2, PAL.warn);
}

function drawMinari(cx,by){
  blit(anim(SPR.minariBackA, SPR.minariBackB, 9), cx, by+2);
}
function drawActor(e){
  const A=CONFIG.actors[e.kind], y=screenY(e.at);
  if(y<HUD_H-28||y>VH+28) return;
  const x = e.kind==="woman" ? e.x : laneX(e.lane);
  switch(e.kind){
    case "manhole":
      drawManhole(x, y);
      break;
    // 拾いものは金で塗る。桃の階調の外にあるので、拾えるものだと一目で分かる
    case "apple":   blitTint(SPR.apple,  x, y+9,  PAL.gold); break;
    case "banana":  blitTint(SPR.banana, x, y+8,  PAL.gold); break;
    case "cheese":  blitTint(SPR.cheese, x, y+10, PAL.gold); break;
    // 正面の絵しかないので、左右を反転して交互に出す＝体を振って歩いて見える。
    // 女は横切る絵なので反転させず、進む向きにだけ合わせる
    case "man":   blit(SPR.man, x, y+10+(Math.floor(S.t*5)%2), Math.floor(S.t*5)%2===0); break;
    case "woman": blit(SPR.woman, x, y+10, e.vx>0); break;
    default:      blit(SPR.kid, x, y+9+(Math.floor(S.t*9)%2), Math.floor(S.t*9)%2===0); break;
  }
}

/** ヤツメウナギ。トウカの部下。細長い体と、丸い吸盤の口 */
function lamprey(x,y,wr){
  const w=Math.round(3+2*(wr||1));
  px(x,y,3,3,PAL.plum);                // 頭（吸盤）
  px(x+1,y+1,1,1,PAL.bg);
  for(let i=0;i<4;i++) px(x-2-i*2, y+Math.round(Math.sin(i*1.4+S.t*9)*1.2), 2, 2, PAL.plum);
  if(w>5) px(x-9,y,2,1,PAL.dim);
}

/** トウカに掴まれるまでのゲージ。路地と下水で共通の見た目にする */
function drawStalkBar(top, k, label){
  k = clamp(k,0,1);
  // 左端にトウカと、仕えるヤツメウナギ。ゲージが溜まるほどヤツメウナギが騒ぐ
  const cy=top+2;
  const agi = k>0.7 ? 2 : k>0.35 ? 1 : 0;                  // 落ち着き / 気づいた / 騒ぐ
  const wig = agi ? Math.round(Math.sin(S.t*(agi>1?16:8))*agi) : 0;
  // 溜まるほど、部下が構えから投げる姿勢に変わる
  blit(agi>1?SPR.lampThrow:SPR.lampReady, 12, cy+8+wig);
  if(agi>1 && Math.floor(S.t*10)%2===0) text("!",22,cy-7,PAL.warn);

  const gx=26, gw=VW-gx-4;
  px(gx,top-1,gw,1,PAL.dim);
  px(gx,top,gw,5,PAL.bg);
  px(gx,top,Math.round(gw*k),5, k>0.7?PAL.warn:PAL.ink);
  if(k>0.7 && Math.floor(S.t*8)%2===0) textC(label,top+8,PAL.warn);
}

/** 監視されている列。目はミナリの視線の先＝画面の上。列そのものもハッチで示す */
/* 監視されている列。カメラが寄っている＝その列だけ画が明るい、という
   見せ方にする。目の形は説明の一枚と同じものを使う（同じ物だと分かるように） */
function drawWatches(){
  const blink = Math.floor(S.t*6)%2===0;
  const top = HUD_H+20;
  for(const w of S.watches){
    const x0=laneW()*w.lane, ww=laneW(), cx=x0+ww/2;
    px(x0, HUD_H, ww, VH-HUD_H-FOOT_H, PAL.off);          // カメラが寄っている列
    for(let y=HUD_H+4;y<VH-FOOT_H;y+=8) px(x0+2,y,ww-4,1,PAL.d1);
    drawEye(cx, top, blink);
  }
}

function drawAlley(){
  px(0,HUD_H,VW,VH-HUD_H,PAL.bg);
  const off=S.dist%26;
  for(let y=HUD_H-26;y<VH+26;y+=26) px(0,y+off,VW,1,PAL.off);
  for(let i=1;i<CONFIG.lanes;i++) px(laneW()*i,HUD_H,1,VH-HUD_H,PAL.off);
  px(0,HUD_H,2,VH-HUD_H,PAL.dim); px(VW-2,HUD_H,2,VH-HUD_H,PAL.dim);

  drawWatches();
  // マンホールは地面に空いた穴。人はその上を歩く。
  // 一緒くたに描くと、人が穴の下をくぐって見える
  for(const e of S.ents) if(!e.dead && e.kind==="manhole") drawActor(e);
  for(const e of S.ents) if(!e.dead && e.kind!=="manhole") drawActor(e);
  if(!(S.invuln>0 && Math.floor(S.t*14)%2===0)) drawMinari(laneX(S.laneF),playerY);
  // 見られている時間。下水の気配ゲージと同じ見た目
  drawStalkBar(HUD_H+4, S.seen/CONFIG.watch.catch, "SHE SEES YOU");

  let ty=HUD_H+22;
  for(const t of S.toasts){ text(t.txt.slice(0,10),4,ty,PAL.ink); ty+=8; }
  if(touch.down||touch.showT>0){
    const r=cv.getBoundingClientRect();
    ring((touch.x-r.left)/r.width*VW,(touch.y-r.top)/r.height*VH,8,8,PAL.dim);
  }
}
/** 落下。路地とは上下が逆で、おにぎりは下から昇ってくる */
function drawFall(){
  const fy = HUD_H+(VH-HUD_H)*CONFIG.fall.y;
  px(0,HUD_H,VW,VH-HUD_H,PAL.bg);
  // 縦穴の壁。上へ流れる＝落ちている
  const off = S.fallDist%22;
  for(let y=VH+22; y>HUD_H-22; y-=22){
    const yy=y-off;
    px(0,yy,7,2,PAL.dim); px(VW-7,yy,7,2,PAL.dim);
  }
  px(0,HUD_H,4,VH-HUD_H,PAL.off); px(VW-4,HUD_H,4,VH-HUD_H,PAL.off);

  for(const it of S.fallItems){
    if(it.dead) continue;
    const y = fy + (it.at - S.fallDist);
    if(y<HUD_H-16||y>VH+16) continue;
    // 回復のおにぎりだけ形が違う。果物は金一色で「点」だと分かる
    if(it.kind==="onigiri") blit(SPR.onigiri, it.x, y+10);
    else blitTint(SPR[it.kind], it.x, y+9, PAL.gold);
  }
  // 落ち始めだけ、マンホールの縁からヤツメウナギが覗いて手を伸ばしてくる。
  // 崖から落ちる者へ差し出される手。掴まれることはない、ただの見送り
  const peek = clamp(1 - S.fallT/1.6, 0, 1);
  if(peek>0){
    const edge = HUD_H + Math.round(-14 + 16*peek);
    px(0,HUD_H,VW,Math.max(0,edge-HUD_H),PAL.off);
    px(0,edge,VW,2,PAL.ink);
    for(let i=0;i<4;i++){
      const x = 14 + i*Math.round((VW-28)/3) + Math.round(Math.sin(S.t*5+i)*2);
      lamprey(x, edge+4+Math.round(Math.sin(S.t*6+i*1.7)*2), 1.4);
    }
  }
  drawMinariFall(S.fallX, fy);

  // 落下は押しっぱなしで流れる。押す場所が操作だと分かるまで出しておく
  if(S.fallT<2.2) hint("HOLD L / R", VW/2, fy+42, PAL.dim);
  const left=Math.max(0,CONFIG.fall.duration-S.fallT);
  textC("FALLING",HUD_H+8,PAL.dim);
  textC(left.toFixed(1),HUD_H+18,PAL.ink);
  let ty=VH-58;
  for(const t of S.toasts){ textC(t.txt.slice(0,10),ty,PAL.ink); ty+=9; }
  textC("SEWER NOT BUILT",VH-24,PAL.off);
  textC("BACK TO ALLEY",VH-14,PAL.off);
}

/** 落下のミナリ。ここだけ画面に他の要素が少ないので、大きく描いて顔を見せる。
    手足を広げて、流れている向きへ少し傾ける */
function drawMinariFall(cx,cy){
  // 流れている向きへ少し傾ける代わりに、絵を左右へずらす
  const tilt = Math.round(clamp(S.fallVX/CONFIG.fall.maxVX,-1,1)*2);
  blit(anim(SPR.minariFallA, SPR.minariFallB, 6), cx+tilt, cy+22);
}

/** 下水。横スクロールなので、路地・落下とは軸そのものが違う */
function drawMinariSide(cx,by,crouch){
  // 絵の高さは当たり判定（立ち30px／伏せ16px）に合わせてある
  blit(crouch ? SPR.minariCrouch : anim(SPR.minariSideA, SPR.minariSideB, 8), cx, by);
}
/** トウカフェーズ。奥にトウカ、手前にミナリ。指差した列に網が飛んでくる */
function drawTouka(){
  const C=CONFIG.touka;
  /* 道も壁も描かない。**大きさの差だけで奥行きを見せる**。
     線を引くと方眼に見えるし、キャラの邪魔になる。

     一点透視では、床に立つものは
        見かけの背丈 h = 実際の背丈 × f / 奥行き
        足元の位置   y = 地平線 + 目の高さ × f / 奥行き
     なので (足元 − 地平線) ÷ 見かけの背丈 は、同じ背丈のものならどこでも一定。
     ミナリの大きさと立ち位置を決めた時点で、地平線も他のキャラの位置も
     すべて決まる。ここを合わせないと、大小がちぐはぐに見える */
  const MH = SPR.minariFrontA.px.length;      // ミナリの見かけの背丈
  const MBY = VH-42;                          // その足元
  const EYE = 1.5;                            // 目の高さ（ミナリの背丈=1）
  const vy  = MBY - MH*EYE;                   // 地平線
  const K   = MH*EYE;                         // y = vy + K/奥行き
  const FOC = K/EYE;
  const yAt = d => vy + K/d;
  const dAt = y => K/Math.max(1e-6, y-vy);

  px(0,HUD_H,VW,VH-HUD_H,PAL.bg);

  // 列の横位置。手前ほど広がるが、ミナリが幅52pxあるので端は内側へ寄せる
  const laneX = l => VW/2 + (VW/C.lanes*(l+0.5) - VW/2)*0.78;
  const lx = (l,t) => lerp(VW/2, laneX(l), t);

  // 足元の影。道は描かないが、これが無いと全員が宙に浮く。
  // 影の大きさがそのまま奥行きの手がかりにもなる
  const shadow=(cx,by,h)=>{
    const rw=Math.max(2,Math.round(h*0.26)), rh=Math.max(1,Math.round(rw*0.26));
    blob(cx,by,rw,rh,PAL.off);
  };

  // トウカと部下。同じ奥行きに立つので、大きさの比がそのまま背丈の比になる
  const tH = SPR.toukaA.px.length;
  const tBY = Math.round(yAt(1.35*FOC/tH));
  const lH = SPR.lampReady.px.length;
  const tX = Math.round(VW/2-24), hX = Math.round(VW/2+16);
  shadow(tX, tBY, tH); shadow(hX, tBY, lH);
  const throwing = S.tkNets.some(n=>!n.hit);
  // 4枚で1周。2枚だと歩きが硬い
  blit(anim4(SPR.toukaA, SPR.toukaA2, SPR.toukaB, SPR.toukaB2, 6), tX, tBY);
  blit(throwing?SPR.lampThrow:SPR.lampReady, hX, tBY);

  /* 予告は画面の上端に、列ぶんの枡で出す。
     ミナリが画面の4割を占めるので、床に帯を引いても本人に隠れて見えない。
     監視モニタの文法にも合う（映像の上に重ねる警告表示） */
  {
    // 帯で塞ぐのをやめ、**狙われた列の上にだけ「！」**を出す。
    // 常設の枡は目に入り続けてうるさく、どの列かも読みにくかった
    /* 字で出すと J28 でも高さ26px しかなく、奥のトウカたちに紛れて読めない。
       図形で描いて、上端の帯とほぼ同じ高さまで大きくする */
    const ay=HUD_H+10;
    for(const lane of S.tkPoints){
      if(Math.floor(S.t*10)%2) continue;
      bangMark(lx(lane,1), ay);
    }
    // 狙われた列は、床まで届く柱でも示す（帯だけだと視線が上へ固定される）
    for(const lane of S.tkPoints){
      if(Math.floor(S.t*10)%2) continue;
      for(let k=2;k<=9;k++){
        const t=k/9, y=yAt(lerp(dAt(tBY),1,t)), w=Math.max(2,Math.round(30*t));
        px(lx(lane,t)-w/2, Math.round(y), w, 2, PAL.warn);
      }
    }
  }

  // 網。奥から手前へ、4段階で大きくなる
  for(const net of S.tkNets){
    if(net.age < net.tele || net.hit) continue;
    const u=(net.age-net.tele)/net.fly;
    const y=yAt(lerp(dAt(tBY), 1, u*u*0.8+u*0.2));
    const spr = u<0.30 ? SPR.netFar : u<0.60 ? SPR.netMid : SPR.netNear;
    blit(spr, lerp(hX, lx(net.lane,1), u), y-Math.round(lerp(2,26,u)));
  }

  // ミナリ。一番手前で一番大きい
  const mx=lx(S.tkLaneF===undefined?1:((C.lanes-1)>>1)+S.tkDodge, 1);
  const mxF=lerp(VW/2, laneX(S.tkLaneF), 1), wig=Math.floor(S.t*12)%2?1:0;
  shadow(mxF, MBY, MH);
  if(S.tkDodge!==0) px(mxF-13, MBY+3, 26, 2, PAL.aqua);
  blit(S.tkDodge<0 ? SPR.minariDodgeL
     : S.tkDodge>0 ? SPR.minariDodgeR
     : anim(SPR.minariFrontA, SPR.minariFrontB, 10), mxF, MBY+wig);

  if(S.tkT<2.4) hint("TAP L / R", VW/2, VH-22, PAL.dim);

  /* 残り本数は出さない。数を見せると作業になる。
     終わりが近いことは、**向こうの慌てぶり**で伝える */
  /* 残り本数は数字で出さない。終わりが近いことは**向こうの慌てぶり**で伝える。
     吹き出しは重ならないよう、部下は右・トウカは左へ振り分ける */
  const left=Math.max(0, S.tkQuota-S.tkThrown);
  if(left===3 || left===1){
    const lamp = left===1 ? "にげられる！" : "アミがたりない…！";
    const tou  = left===1 ? "かくごなさい" : "おしおきね";
    bubble(lamp, Math.min(VW-8, hX+40), tBY-SPR.lampReady.px.length-8, 1);
    bubble(tou,  Math.max(8,    tX-40),  tBY-SPR.toukaA.px.length-30, -1);
  }
}

/** 梯子を昇る。連打で登る。先を行く鼠と、途中のおにぎりの取り合い */
function drawClimb(){
  const C=CONFIG.climb;
  const top=HUD_H+40, bot=VH-FOOT_H-56;      // あみだ全体がここに収まる
  const lx = i => Math.round(VW*(0.24+i*0.26));
  const hy = h => Math.round(bot-(h/C.total)*(bot-top));

  px(0,HUD_H,VW,VH-HUD_H-FOOT_H,PAL.bg);

  // 縦線3本は梯子として描く。ここは「あみだ」であると同時に「梯子」なので、
  // 線ではなく梯子に見えたほうが、何をしているのか分かる
  for(let i=0;i<3;i++){
    const on = i===S.climbLine;
    const c = on?PAL.d4:PAL.d2, x=lx(i);
    px(x-11, top, 3, bot-top, c);          // 左の縦棒
    px(x+8,  top, 3, bot-top, c);          // 右の縦棒
    for(let y=top+6; y<bot; y+=18) px(x-11, y, 22, 3, on?PAL.d3:PAL.d1);   // 桟
  }
  // 桟
  // 渡りの桟。梯子と梯子をつなぐ板なので、少し太く明るく
  for(const r of S.amida){
    const y=hy(r.h), x0=lx(r.a), x1=lx(r.a+1);
    px(x0, y-3, x1-x0, 6, PAL.warn);
  }
  // 出口。3つとも中身が見えている。なにも無い出口もある
  for(let i=0;i<3;i++){
    const k=S.climbExits[i];
    if(k==="onigiri") blit(SPR.onigiri, lx(i), top-6);
    else if(k) blitTint(SPR[k], lx(i), top-6, PAL.gold);
    else ring(lx(i), top-16, 12, 7, PAL.d1, 2);
  }
  // 入口。選んでいるところに三角
  for(let i=0;i<3;i++){
    const on=i===S.climbLine;
    ring(lx(i), bot+14, 12, 8, on?PAL.d4:PAL.d1, 2);
    if(on && S.climbPhase==="pick") tri(lx(i), bot+26, 20, 14, 0, PAL.warn);
  }

  if(S.climbPhase==="pick"){
    // 読む時間。残りを帯で見せる
    const k=clamp(S.climbPick/C.pickSec,0,1), gw=VW-40;
    px(20, VH-FOOT_H-26, gw, 4, PAL.d1);
    px(20, VH-FOOT_H-26, Math.round(gw*k), 4, PAL.warn);
    textC("どれ？", HUD_H+8, PAL.d4, 1, J16);
    // 入口のミナリ
    blit(anim(SPR.minariClimbA, SPR.minariClimbB, 4), lx(S.climbLine), bot+52);
  } else {
    // 登っている。線の上を上がっていく
    const y=hy(S.climbY);
    blit(anim(SPR.minariClimbA, SPR.minariClimbB, 9), lx(S.climbLine), y+26);
  }
}

function drawSewerScene(){
  const C=CONFIG.sewer;
  const gy = HUD_H+(VH-HUD_H)*C.groundY;
  const pxs = Math.round(VW*C.playerX);
  const toScreen = wx => pxs + (wx - S.swDist);

  px(0,HUD_H,VW,VH-HUD_H,PAL.bg);
  px(0,HUD_H,VW,5,PAL.dim);                                    // 天井
  for(let i=0;i<9;i++){
    const x = VW - ((S.swDist*0.55 + i*27) % (VW+22));
    px(x,HUD_H+5,1,3,PAL.off);                                 // 天井のしずく
  }
  // 地面は途切れない
  px(0,gy,VW,2,PAL.ink);
  px(0,gy+2,VW,VH-gy-2,PAL.off);
  for(let i=0;i<10;i++){
    const x=VW-((S.swDist*1.0+i*26)%(VW+26));
    px(x,gy+5,10,1,PAL.dim);                                   // 床のタイル目地
  }
  // 浮いた足場。下は素通りできるので、乗るか下を行くかを選べる
  for(const P of S.swPlats){
    const x0=Math.max(-4,toScreen(P.x0)), x1=Math.min(VW+4,toScreen(P.x1));
    if(x1<=0||x0>=VW) continue;
    const ty=gy-P.y, w=x1-x0;
    px(x0,ty,w,2,PAL.ink);                                     // 天面
    px(x0,ty+2,w,C.platThick-2,PAL.dim);
    for(let i=0;i<Math.floor(w/10);i++) px(x0+3+i*10,ty+C.platThick,3,1,PAL.off);  // 裏の桟
    if(toScreen(P.x0)>-2) px(x0,ty,1,C.platThick+3,PAL.ink);   // 手前の端
    if(toScreen(P.x1)<VW+2) px(x1-1,ty,1,C.platThick+3,PAL.ink);
  }
  /* 水たまり。以前は床の色を薄く抜いただけで、何なのか分からなかった。
     **床が落ちくぼんで、そこに水が溜まっている**と読めるようにする。
     縁を濃く、水面を明るく、光の筋を横に走らせる */
  for(const q of S.swPuddles){
    const x0=Math.max(0,toScreen(q.x0)), x1=Math.min(VW,toScreen(q.x1));
    if(x1<=0||x0>=VW) continue;
    const w=Math.max(0,x1-x0), D=14;
    px(x0, gy-2, w, 2, PAL.bg);                       // 床を抜く
    px(x0, gy,   w, D, PAL.bg);                       // くぼみの闇
    px(x0, gy+3, w, D-6, PAL.d2);                     // 水面
    px(x0, gy+2, w, 1, PAL.d4);                       // 手前の縁で光る
    for(let i=0;i<Math.floor(w/22);i++){              // 光の筋
      const o=Math.round(Math.sin(i*1.7+S.t*3)*3);
      px(x0+8+i*22+o, gy+5, 10, 1, PAL.d4);
    }
    if(toScreen(q.x0)>=0) px(x0, gy-2, 2, D+2, PAL.d1);   // 落ち際
    if(toScreen(q.x1)<=VW) px(x1-2, gy-2, 2, D+2, PAL.d1);
    // 踏んだ瞬間だけ波紋。残すと画面端で歪んで見えるので、すぐ消す
    if(q.wetT>0){
      const k=q.wetT/0.35;
      ring(x0+w/2, gy+5, w*0.42*(1.2-k*0.4), 4, PAL.d4);
      ring(x0+w/2, gy+5, w*0.24*(1.2-k*0.4), 2, PAL.d3);
    }
  }
  // チーズ
  for(const it of S.swItems){
    const sx=toScreen(it.x);
    if(sx<-14||sx>VW+14) continue;
    blitTint(SPR[it.kind||"cheese"], sx, gy-it.y, PAL.gold);
  }
  // 脱出の梯子。掴みに行かないと掴めないので、通り道は塞がない
  for(const L of S.swLadders){
    const sx=toScreen(L.x)-C.ladderW/2;
    if(sx<-30||sx>VW+30) continue;
    const bottom=gy-C.ladderLo;
    px(sx,HUD_H+6,1,bottom-HUD_H-6,PAL.dim);
    px(sx+C.ladderW-1,HUD_H+6,1,bottom-HUD_H-6,PAL.dim);
    for(let y=HUD_H+9;y<bottom;y+=7) px(sx,y,C.ladderW,1,PAL.ink);
    if(Math.floor(S.t*5)%2===0) px(sx+2,bottom-2,C.ladderW-4,2,PAL.warn);
    // 足場に乗って、そこから跳ばないと届かない。気づかないと素通りする
    if(sx>-20 && sx<VW) hint("GRAB!", sx+C.ladderW/2, bottom+4);
  }
  /* 障害物。**伏せるのか跳ぶのかが、形だけで分かること**が唯一の要件。
     以前は同じ蝙蝠を高さ違いで置いていて、どちらか判断できなかった。
     いまは別の生き物にしてある。

       high  天井から吊り下がる蝙蝠の簾。伏せて下をくぐる
       low   床を這う蛇。跳んで越える

     ぶら下がる／這う、という形そのものが答えになるので、
     矢印や色に頼らなくても読める。 */
  /* 障害物。**伏せるのか跳ぶのかが形だけで分かること**が唯一の要件。
     路地の通行人と同じで、キャラではないので描き込まない。塊で見せる。

       high  蝙蝠。**塞いでいる帯の底に居る**。頭のすぐ上を飛んでいるので、
             伏せるしかないことが、線ではなく蝙蝠そのもので分かる
       low   蛇。2枚を交互に入れ替えるだけの動き。うねらせると形が崩れる */
  const swarm=(sx,bands,kind)=>{
    for(const [lo,hi] of bands){
      const top=Math.max(HUD_H, gy-hi), bot=gy-lo;
      if(kind==="high"){
        // 蝙蝠は帯の底に居る。吊り線は引かない（何なのか分からない線になる）
        const flap=Math.floor(S.t*8)%2;
        /* 段の数は「跳んでも越えられない」ことが見て分かる高さまで積む。
           最大ジャンプの頭は地面から約153px。そこまで蝙蝠が居ないと、
           上を飛べそうに見えてしまう */
        const need = C.maxJump*C.maxJump/(2*C.gravity) + C.standH;
        // 跳んでも越えられないと分かれば十分。上まで積み切らない
        const rows = Math.max(3, Math.ceil((need*0.82-lo)/30)+1);
        for(let r=0;r<rows;r++){
          // 下ほど密、上ほど疎。壁のように塞ぎつつ、数は抑える
          const n = r===0 ? 3 : (r%2===0 ? 2 : 1);
          // 一番下の段の腹を、塞ぐ帯の下端にぴったり付ける。
          // 少しでも浮かせると「高いところを飛んでいる」に見えてしまう
          const by = bot-2-r*30;
          if(by<top) break;
          for(let k=0;k<n;k++){
            const bx = sx + (k-(n-1)/2)*26;
            px(bx-7, by-9, 14, 16, PAL.d3);                       // 胴
            const w = flap ? 5 : 9;                                // 羽ばたき
            px(bx-7-w, by-8, w, 7, PAL.d2);
            px(bx+7,   by-8, w, 7, PAL.d2);
            px(bx-7, by-14, 5, 6, PAL.d3); px(bx+2, by-14, 5, 6, PAL.d3);  // 耳
            px(bx-4, by-5, 3, 3, PAL.d5);  px(bx+1, by-5, 3, 3, PAL.d5);   // 目
          }
        }
      } else {
        // 蛇。伸びた形と縮んだ形の2枚だけ。尺取虫のように交互に出す
        const h=bot-top, y0=bot-12;
        const A2=Math.floor(S.t*7)%2===0;
        // 向かってくるので、頭は**左**。右へ向けると後ずさりして見える
        if(A2){
          // 伸びた形
          px(sx-14, y0+2, 38, 8, PAL.d3);
          px(sx-26, y0, 13, 10, PAL.d4);                          // 頭
          px(sx-23, y0+3, 4, 2, PAL.warn);                        // 目
          px(sx-32, y0+6, 7, 2, PAL.warn);                        // 舌
        } else {
          // 縮んだ形。背を持ち上げる
          px(sx+6,  y0+2, 16, 8, PAL.d3);
          px(sx-8,  y0-6, 18, 9, PAL.d3);                         // 山
          px(sx-16, y0+2, 10, 8, PAL.d3);
          px(sx-26, y0+1, 13, 9, PAL.d4);
          px(sx-23, y0+3, 4, 2, PAL.warn);
        }
        px(sx-26, bot-2, 52, 2, PAL.d1);                          // 影
      }
    }
  };
  for(const b of S.swBats){
    const sx=toScreen(b.x);
    if(sx<-40||sx>VW+40) continue;
    swarm(sx, C.batBands[b.kind], b.kind);
  }

  // 入口では操作そのものを言う。押しっぱなしが伏せ、放すと跳ぶ
  if(S.swDist < 150) hint("HOLD = DUCK", VW/2, HUD_H+40, PAL.dim);
  else if(S.swDist < 300) hint("RELEASE = JUMP", VW/2, HUD_H+40, PAL.dim);

  // ミナリ
  const held = touch.down || keys.hold;
  const crouch = S.swGround && held;
  const by = gy - S.swY;
  // 足元の影。跳んでいる高さは、影との距離でしか読み取れない
  if(S.swY>2){
    const p=platAt(S.swDist), sy=gy-(p?p.y:0);
    const w=Math.max(4, 14-Math.round(S.swY/14));
    px(pxs-w/2, sy-1, w, 1, PAL.dim);
  }
  if(!(S.invuln>0 && Math.floor(S.t*14)%2===0)) drawMinariSide(pxs,by,crouch);
  // 溜め
  if(S.swCharge>0){
    const k=S.swCharge/C.maxCharge, w=16, h=crouch?C.crouchH:C.standH;
    px(pxs-w/2-1, by-h-15, w+2, 5, PAL.bg);
    px(pxs-w/2,   by-h-14, Math.round(w*k), 3, k>=0.995?PAL.warn:PAL.ink);
  }

  // 気配のゲージ。水たまりを踏むたびに跳ね上がり、静かにしていれば薄れる
  const gTop = HUD_H+4;
  drawStalkBar(gTop, S.swNoise/C.noiseMax, "SHE FEELS YOU");

  let ty=gTop+18;
  for(const t of S.toasts){ text(t.txt.slice(0,10),4,ty,PAL.ink); ty+=8; }
}

/* ============================================================
   監視モニタの外枠。

   この画面は「トウカ側が見ている映像」という建て付けにしている。
   だから数字は得点ではなく**時刻**、残機ではなく**取り逃した回数**。
   走査線と四隅の括弧が「映像を見ている」ことを示す。

   捕捉枠だけは常設しない。**見つかった瞬間にだけ**出す。
   常に出ていると、ヤツメウナギが列を見張っているという仕掛けの意味が消える。
   ============================================================ */
const CAM = { play:["03","ALLEY-B"], falling:["07","SHAFT"], sewer:["11","SEWER-C"],
              climb:["12","LADDER"], touka:["01","PURSUIT"], brief:["--","STANDBY"] };

/** 時刻表示。得点をそのまま秒に見立てる */
function timecode(t){
  const s=Math.floor(t), m=Math.floor(s/60);
  return String(m%100).padStart(2,"0")+":"+String(s%60).padStart(2,"0")+":"
       + String(Math.floor((t%1)*100)).padStart(2,"0");
}
function drawChrome(){
  const cam = CAM[S.scene] || CAM.play;
  // 上の帯
  px(0,0,VW,HUD_H,PAL.bg);
  text("CAM "+cam[0]+"  "+cam[1], 8, 4, PAL.d3, 1, F8);
  textR(timecode(S.t), VW-8, 4, PAL.d3, 1, F8);
  text(String(Math.min(Math.floor(S.score),9999999)).padStart(7,"0"), 8, 20, PAL.d3, 1, F12);
  text("ST "+S.stage, 8+tw("0000000",1,F12)+10, 24, PAL.d2, 1, F8);
  // 体力。上の帯の右に大きく並べる。数字より形のほうが速く読める
  for(let i=0;i<CONFIG.hearts;i++){
    const hx=VW-10-(i+1)*20;
    heart(hx, 22, i<S.hearts?PAL.warn:PAL.d1, 3);
  }
  px(0,HUD_H-1,VW,1,PAL.d1);

  // 下の帯
  const fy=VH-FOOT_H;
  px(0,fy,VW,FOOT_H,PAL.bg);
  px(0,fy,VW,1,PAL.d1);
  if(Math.floor(S.t*1.6)%2===0) blob(12,fy+15,5,5,PAL.warn);
  text("REC", 26, fy+9, PAL.warn, 1, F8);
  textR(S.watched?"WATCHED":"", VW-8, fy+9, PAL.d2, 1, F8);
  const st = S.spotT>0 ? "LOCKED" : S.watched ? "SEARCHING" : "";
  if(st) textC(st, fy+9, S.spotT>0?PAL.warn:PAL.d2, 1, F8);
}
/** 走査線と四隅の括弧。地にだけ敷く（被写体の上に重ねると読めなくなる） */
/* 監視モニタの地。走査線に**縦の目盛り**を足して、格子にする。
   どの画面もこれを通すので、タイトルから結果まで同じ地の上に乗る。
   色は PAL.scan（地との差が5階調ぶんしかない）に留める。
   前に消したのはもっと濃い格子で、絵が読めなくなっていた */
function drawScanlines(){
  const T=HUD_H, B=VH-FOOT_H;
  for(let y=T;y<B;y+=3) px(0,y,VW,1,PAL.scan);
  for(let x=0;x<VW;x+=25) px(x,T,1,B-T,PAL.scan);
}
function drawBrackets(){
  const T=HUD_H+4, B=VH-FOOT_H-6, L=4, R=VW-6;
  const c=PAL.d3, n=18, t=3;
  [[L,T,1,1],[R,T,-1,1],[L,B,1,-1],[R,B,-1,-1]].forEach(([x,y,sx,sy])=>{
    px(sx>0?x:x-n, sy>0?y:y, n, t, c);
    px(sx>0?x:x, sy>0?y:y-n, t, n+t, c);
  });
}
/** 捕捉枠。見つかった瞬間にだけ出る */
function drawLock(cx,cy,w,h){
  const c=PAL.warn, n=Math.round(Math.min(w,h)*0.34), t=3;
  const L=Math.round(cx-w/2), R=Math.round(cx+w/2), T=Math.round(cy-h/2), B=Math.round(cy+h/2);
  [[L,T,1,1],[R-n,T,1,1],[L,B-t,1,1],[R-n,B-t,1,1]].forEach(([x,y])=>px(x,y,n,t,c));
  [[L,T,1],[R-t,T,1],[L,B-n,1],[R-t,B-n,1]].forEach(([x,y])=>px(x,y,t,n,c));
  textC("SPOTTED", T-18, c, 1, F8);
}
function drawHUD(){
  drawScanlines();
  drawBrackets();
  drawChrome();
}
/** 塗りつぶした楕円。サーチライトの光だまり用 */
function ellF(cx,cy,rw,rh,c){
  for(let dy=-rh;dy<=rh;dy++){
    const w=Math.round(rw*Math.sqrt(Math.max(0,1-(dy/rh)*(dy/rh))));
    if(w>0) px(Math.round(cx-w), Math.round(cy+dy), w*2, 1, c);
  }
}
/** 上から降りてくる光。追われていることを、絵ではなく光で言う。
    地より**明るく**する。暗くすると影に見えて、逆の意味になる */
function searchlight(cx, by, top){
  const sx=Math.round(lerp(VW*0.5, cx, 0.35)), sy=top;
  for(let y=sy;y<by;y+=1){
    const t=(y-sy)/(by-sy);
    const w=Math.round(16+92*t*t), x=Math.round(lerp(sx,cx,t*t));
    // 芯は明るく、外へ行くほど暗く。1行おきに芯を抜いて走査線の粒を残す
    px(Math.round(x-w/2), y, w, 1, PAL.off);
    if(y%2===0) px(Math.round(x-w*0.28), y, Math.round(w*0.56), 1, PAL.d1);
  }
  ellF(cx, by, 62, 17, PAL.d1);
  ellF(cx, by, 40, 11, PAL.d2);
}
function drawTitle(){
  px(0,0,VW,VH,PAL.bg);
  drawScanlines();

  /* 追う者と逃げる者。左から右へ流して、端まで行ったら戻す。
     切り替わるのは両方とも画面の外なので、飛んだようには見えない。
     トウカフェーズより**ゆっくり**にして、動いていることだけ伝える */
  const per=4.6, ph=(S.animT%per)/per;
  const sweep=p=>{ const q=((p%1)+1)%1; return Math.round(-60 + q*(VW+120)); };
  const mx=sweep(ph), tx=sweep(ph-0.15);       // トウカは少し後ろ
  const bob=(p,hz)=>Math.round(Math.sin(p*per*hz*Math.PI*2)*2);

  /* ミナリは半分に縮める。原寸だと 252×280 あって画面を埋めてしまい、
     追う側のトウカ(108×148)より大きく見えてしまう。
     半分にするとトウカのほうが背が高くなり、追われている絵になる */
  // 足元の光と「にげる！」がぶつからない高さ
  const mby=Math.round(VH*0.82), tby=Math.round(VH*0.60);
  searchlight(mx, mby, HUD_H+64);
  blit(anim4(SPR.toukaA, SPR.toukaA2, SPR.toukaB, SPR.toukaB2, 4), tx, tby+bob(ph,2));
  blitK(anim(SPR.minariFrontA, SPR.minariFrontB, 7), mx, mby+bob(ph,3.5), 0.5);

  px(0, HUD_H+14, VW, 46, PAL.warn);
  textC("しゅがけストーキング", HUD_H+23, PAL.bg, 1, J28);
  textC("SHE IS ALWAYS WATCHING", HUD_H+68, PAL.d3, 1, F12);
  textC("RUN, MINARI, RUN", HUD_H+90, PAL.d2, 1, F8);
  if(blink(2)){
    const w=tw("にげる！",1,J28);
    px(Math.round((VW-w)/2)-14, VH-FOOT_H-52, w+28, 46, PAL.bg);
    textC("にげる！", VH-FOOT_H-44, PAL.d5, 1, J28);
  }
  drawChrome();
}
/** 画面のあいだの一枚 */
function drawBrief(){
  const B=BRIEF[S.briefKey]; if(!B) return;
  px(0,0,VW,VH,PAL.bg);
  drawScanlines();

  // ① 帯。画面でいちばん強い要素にして、ここで言い切る
  const by=HUD_H+16;
  px(0,by,VW,52,PAL.warn);
  textC(B.band, by+9, PAL.bg, 1, J28);

  // ② 図。ミナリの左右に矢印、その下に画面ごとの肝
  /* 説明はぎゅう詰めにしない。**残りの高さを要素の数で割って**、
     等間隔に散らす。詰めると読まれないし、寄せると余白が偏る */
  const HGT={ pair:104, cam:96, ladder:78, hole:62, wave:50, food:38, amida:80,
              front:108, over:84,
              tap:70, hold:70, tapx:70, net:40, time:56, swarm:40 };
  const items=["a","b","c"].map(k=>B[k]).filter(Boolean);
  const areaTop=by+64, areaBot=VH-FOOT_H-40;
  const used=items.reduce((n,it)=>n+(HGT[it[0]]||70)+(it[1]?26:0), 0);
  const slack=Math.max(0, (areaBot-areaTop-used)/(items.length+1));
  let y=areaTop+slack;
  for(const it of items){
    const h=HGT[it[0]]||70;
    briefFig(it[0], VW/2, y);
    if(it[1]) textC(it[1], y+h+2, PAL.d4, 1, it[1].length>4?J16:F12);
    y += h + (it[1]?26:0) + slack;
  }

  // ③ 自動送り。放っておいても始まるので、待ち時間を見せる
  const k=clamp(S.briefT/B.secs,0,1), gw=VW-32, gy=VH-FOOT_H-14;
  px(16,gy,gw,4,PAL.d1);
  px(16,gy,Math.round(gw*k),4,PAL.d3);
  drawChrome();
}
/** 一色で塗るスプライト。拾いものを金で抜くのに使う */
function blitTint(spr, x, y, col){
  const rows=spr.px, w=rows[0].length;
  const x0=Math.round(x-w/2), y0=Math.round(y-rows.length);
  for(let r=0;r<rows.length;r++){
    const line=rows[r];
    let run=-1;
    for(let i=0;i<=w;i++){
      const on = i<w && line[i]!==".";
      if(on && run<0) run=i;
      if(!on && run>=0){ px(x0+run, y0+r, i-run, 1, col); run=-1; }
    }
  }
}
/** 監視の目。説明の一枚と同じ形にして、初めて見た人が同じものだと分かるように */
function drawEye(cx, cy, hot){
  const c = hot ? PAL.warn : PAL.d2;
  ring(cx, cy, 16, 10, c, 2);
  blob(cx, cy, 6, 6, c);
}
/** マンホール。蓋を穴に重ね、上だけ口を開ける。説明の一枚と同じ形 */
function drawManhole(cx, cy){
  const rw=38, rh=17;
  ring(cx, cy, rw, rh, PAL.gold, 2);
  blob(cx, cy, rw-3, rh-3, PAL.bg);
  for(let i=0;i<3;i++) px(cx-(20-i*6), cy-4+i*6, (20-i*6)*2, 2, PAL.d1);
  const ly=cy+16;
  blob(cx, ly+2, rw-3, rh-4, PAL.d1);
  blob(cx, ly-1, rw-3, rh-5, PAL.d3);
  ring(cx, ly-1, rw-9, rh-7, PAL.d1, 1);
  ring(cx, ly-1, 13, 5, PAL.d1, 1);
  for(let k=0;k<10;k++){
    const a=k/10*6.2832;
    for(let t=0;t<=6;t++){
      const r=13+(rw-21)*t/6;
      px(cx+Math.cos(a)*r, ly-1+Math.sin(a)*(5+(rh-12)*t/6), 1, 1, PAL.d1);
    }
  }
}
/** 吹き出し。相手の頭の上に、地を敷いてから字を置く */
function bubble(str, cx, by, side){
  const w=tw(str,1,J16)+14, h=J16.h+10;
  // side>0 なら右寄り、<0 なら左寄りに置く。2つ並ぶとき重ならないように
  const want = side ? cx - w*(side>0?0.15:0.85) : cx-w/2;
  const x=Math.round(clamp(want, 4, VW-w-4)), y=Math.round(by-h);
  px(x, y, w, h, PAL.bg);
  px(x, y, w, 2, PAL.d4); px(x, y+h-2, w, 2, PAL.d4);
  px(x, y, 2, h, PAL.d4); px(x+w-2, y, 2, h, PAL.d4);
  for(let i=0;i<6;i++) px(cx-3+i, y+h-2+i, 6-i, 2, PAL.d4);
  text(str, x+7, y+5, PAL.d4, 1, J16);
}
/** 塗りつぶした三角。dir -1=左向き / 1=右向き。
    線を足すと矢印に見えず、ただの図形が汚れる。三角だけで足りる */
function tri(cx, cy, w, h, dir, c){
  if(dir===0){                       // 上向き
    for(let i=0;i<h;i++){
      const ww=Math.round(w*(i/(h-1)));
      if(ww>0) px(cx-ww/2, cy+i, ww, 1, c);
    }
    return;
  }
  const half=(h-1)/2;
  for(let i=0;i<h;i++){
    const ww=Math.round(w*(1-Math.abs(i-half)/half));
    if(ww<=0) continue;
    px(dir<0 ? cx+w/2-ww : cx-w/2, cy+i, ww, 1, c);
  }
}
/** 説明の図。字より先に目に入るので、形で言い切る */
function briefFig(kind, cx, y){
  const A=PAL.d4, B2=PAL.d2, C=PAL.d3, G=PAL.gold, W2=PAL.warn;
  if(kind==="front"){
    /* 矢印ではなく、**避けている絵そのもの**を並べる。
       中央に正面、左右に飛んでいる姿。何をするのかが絵だけで決まる。
       本編と同じ絵は大きすぎるので、説明用に縮めた版を使う */
    blit(SPR.dodgeLmini, cx-92, y+96);
    blit(anim(SPR.frontMiniA, SPR.frontMiniB, 6), cx, y+100);
    blit(SPR.dodgeRmini, cx+92, y+96);
  } else if(kind==="over"){
    blitTint(SPR.netNear, cx, y+80, W2);
  } else if(kind==="tap" || kind==="hold" || kind==="tapx"){
    // ミナリと、その左右の矢印。落下だけは落ちている絵にする
    blit(kind==="hold" ? SPR.minariFallA : SPR.minariBackA, cx, y+50);
    for(const sg of [-1,1]) tri(cx+sg*96, y+8, 30, 40, sg, A);
  } else if(kind==="cam"){
    // 向いた列から横へ抜ける
    const pw=210, ph=96, x0=Math.round(cx-pw/2);
    px(x0,y,pw,2,PAL.d1); px(x0,y+ph-2,pw,2,PAL.d1);
    px(x0,y,2,ph,PAL.d1); px(x0+pw-2,y,2,ph,PAL.d1);
    px(x0+2,y+2,pw/2-2,ph-4,PAL.off);
    for(let yy=y+6;yy<y+ph-4;yy+=8) px(x0+2,yy,pw/2-2,1,PAL.d1);
    const ex=x0+pw/4, ey=y+24;
    drawEye(ex, ey, true);      // 本編とまったく同じ形を使う
    blit(SPR.minariBackA, x0+pw*0.75, y+ph-10);
    for(let i=0;i<4;i++) px(ex-2+i*8, y+ph-34, 5, 3, C);
    tri(ex+40, y+ph-40, 12, 16, 1, A);
  } else if(kind==="hole"){
    drawManhole(cx, y+24);      // 本編とまったく同じ形を使う
  } else if(kind==="food"){
    blit(SPR.onigiri, cx, y+30);
  } else if(kind==="pair"){
    // 蝙蝠と蛇を左右に並べ、それぞれの答えをその下に書く。
    // 見比べられる形にすると、どちらがどちらか一度で決まる
    for(const sg of [-1,1]){
      const x=cx+sg*88;
      if(sg<0){
        // 天井から下がる塊。しゃがんでくぐる
        px(x-26, y, 52, 5, PAL.d2);
        for(let i=-1;i<=1;i++) px(x+i*16-2, y, 4, 14, PAL.d1);
        for(let r=0;r<2;r++) for(let k=-1;k<=1;k++){
          const bx=x+k*20+(r?10:0), by=y+16+r*18;
          px(bx-6, by, 12, 14, PAL.d3);
          px(bx-15, by-3, 10, 6, PAL.d2); px(bx+5, by-3, 10, 6, PAL.d2);
          px(bx-3, by+4, 2, 3, PAL.d5); px(bx+1, by+4, 2, 3, PAL.d5);
        }
        blit(SPR.minariCrouch, x, y+96);
      } else {
        // 床を這う蛇。跳んで越える
        for(let i=-26;i<=18;i+=2){
          const wob=Math.round(Math.sin(i*0.20)*7);
          px(x+i, y+72+wob-5, 3, 10, PAL.d3);
        }
        px(x+18, y+62, 16, 12, PAL.d4);
        px(x+28, y+65, 5, 3, PAL.warn);
        for(let i=0;i<=10;i++){
          const t=i/10;
          px(x-30+t*60, y+62-Math.round(Math.sin(t*Math.PI)*38), 3, 3, PAL.d4);
        }
      }
      textC2(sg<0?"しゃがめ":"跳べ", x, y+104, PAL.d4, J16);
    }
  } else if(kind==="ladder"){
    // 梯子。掴んで地上へ
    px(cx-22, y, 5, 78, PAL.d3); px(cx+17, y, 5, 78, PAL.d3);
    for(let k=0;k<5;k++) px(cx-22, y+8+k*16, 44, 5, PAL.d4);
    tri(cx, y-18, 26, 20, 0, PAL.gold);
  } else if(kind==="duck"){
    px(cx-70,y,140,4,A);
    for(let i=-2;i<=2;i++) px(cx+i*24-2,y,4,30,B2);
    blit(SPR.minariCrouch, cx, y+70);
  } else if(kind==="wave"){
    // 本編と同じ形。床が落ちくぼんで水が溜まっている
    const w=150, x0=cx-w/2, gy2=y+22, D=14;
    px(x0, gy2-6, w, 6, PAL.d1);                    // 床
    px(x0, gy2-2, w, 2, PAL.bg);
    px(x0, gy2,   w, D, PAL.bg);
    px(x0, gy2+3, w, D-6, PAL.d2);
    px(x0, gy2+2, w, 1, PAL.d4);
    for(let i=0;i<Math.floor(w/22);i++) px(x0+8+i*22, gy2+5, 10, 1, PAL.d4);
    px(x0, gy2-2, 2, D+2, PAL.d1); px(x0+w-2, gy2-2, 2, D+2, PAL.d1);
    ring(cx, gy2+5, w*0.42, 4, PAL.d4);
    ring(cx, gy2+5, w*0.24, 2, PAL.d3);
  } else if(kind==="amida"){
    // あみだを小さく。3本の縦線と桟、当たりにおにぎり
    const w=170, x0=cx-w/2, t=y, b2=y+72;
    const L=i=>Math.round(x0+w*(0.16+i*0.34));
    for(let i=0;i<3;i++) px(L(i)-2, t, 4, b2-t, i===1?PAL.d4:PAL.d2);
    px(L(0), t+20, L(1)-L(0), 4, PAL.d3);
    px(L(1), t+44, L(2)-L(1), 4, PAL.d3);
    blit(SPR.onigiri, L(0), t-4);
    tri(L(1), b2+4, 18, 12, 0, PAL.warn);
  } else if(kind==="swarm"){
    for(let i=0;i<5;i++) lamprey(cx-60+i*30, y+30, 1.6);
  } else if(kind==="net"){
    for(let i=0;i<3;i++) px(cx-60+i*40, y, 34, 34, i===1?W2:B2);
  } else if(kind==="time"){
    ring(cx,y+26,26,26,A,3);
    px(cx-2,y+8,4,20,A); px(cx-2,y+24,16,4,A);
  }
}
function drawOver(){
  px(0,0,VW,VH,PAL.bg);
  drawScanlines();
  const spotted = S.end==="touka";

  // 捕まえた本人を大きく。ここは負けの画面なので、相手の顔で終わらせる
  blit(anim4(SPR.toukaA, SPR.toukaA2, SPR.toukaB, SPR.toukaB2, 3), VW/2, VH*0.52);

  px(0, HUD_H+18, VW, 44, PAL.warn);
  textC(spotted?"CAUGHT!":"GAME OVER", HUD_H+27, PAL.bg, 1, J28);
  textC(spotted?"TOUKA HAS YOU":"NO HEARTS LEFT", HUD_H+70, PAL.d3, 1, F12);

  let y=VH*0.60;
  [["SCORE",S.score],["BEST",S.best],["STAGE",S.stage],["TIME",Math.round(S.t)]].forEach(([k,v])=>{
    text(k, Math.round(VW*0.16), y, PAL.d2, 1, F12);
    textR(String(v), Math.round(VW*0.84), y, PAL.d4, 1, F12);
    y += 26;
  });
  if(blink(2)) textC("TAP", VH-FOOT_H-40, PAL.d3, 1, F12);
  drawChrome();
}
function render(){
  // 揺らすとずれたぶん画面端が塗り残る。先に全面を下地で埋めておく
  px(0,0,VW,VH,PAL.bg);
  ctx.save();
  if(S.shake>0.05){ const j=()=>Math.round((rnd()*2-1)*S.shake); ctx.translate(j(),j()); }
  if(S.scene==="title") drawTitle();
  else if(S.scene==="brief") drawBrief();
  else if(S.scene==="over") drawOver();
  else if(S.scene==="falling"){ drawFall(); drawHUD(); }
  else if(S.scene==="sewer"){ drawSewerScene(); drawHUD(); }
  else if(S.scene==="climb"){ drawClimb(); drawHUD(); }
  else if(S.scene==="touka"){ drawTouka(); drawHUD(); }
  else { drawAlley(); drawHUD(); }
  ctx.restore();
}

/* ============================================================
   ループ
   ============================================================ */
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  if(innerWidth!==lastW||innerHeight!==lastH) resize();
  update(dt); render(); updateDebug();
  BGM.follow(S.scene, dt);          // 実時間で呼ぶ。update の中だと計測用の早送りに巻き込まれる
  // 登っている間だけ音を出す。選んでいる間は静かにして、読むことに集中させる
  SFX.ambience(S.scene==="climb" && S.climbPhase!=="run" ? "" : S.scene);
  for(const k in edge) delete edge[k];
  requestAnimationFrame(frame);
}

/* 開発用 */
const devSeed=document.getElementById("tSeed"), dbg=document.getElementById("debug");
document.getElementById("devToggle").onclick=()=>document.getElementById("dev").classList.toggle("on");
{ // 音の入切。画面のタップは操作に使うので、切り替えは画面の外に置く
  const b=document.getElementById("seToggle");
  const paint=()=>b.classList.toggle("off", !SFX.on);
  b.onclick=()=>{ SFX.toggle(); if(!SFX.on) BGM.stop(); else BGM.wake(); paint(); };
  paint();
}
addEventListener("keydown",e=>{ if(e.code==="KeyM"){ SFX.toggle();
  if(!SFX.on) BGM.stop(); else BGM.wake();
  document.getElementById("seToggle").classList.toggle("off", !SFX.on); }});
document.getElementById("tDbg").onclick=()=>{CONFIG.debug=!CONFIG.debug;};
// デバッグ: 開始ステージを選ぶ。難易度（通算時間）もそのぶん進めた状態で始まる
const tStage=document.getElementById("tStage");
tStage.onclick=()=>{
  S.startStage = S.startStage>=8 ? 1 : S.startStage+1;

document.getElementById("tClimb").onclick=()=>{
  if(S.scene==="title"||S.scene==="over") startRun();
  enterClimb();

document.getElementById("tTouka").onclick=()=>{
  if(S.scene==="title"||S.scene==="over") startRun();
  enterTouka();
};
function updateDebug(){
  if(!CONFIG.debug){ if(dbg.textContent) dbg.textContent=""; return; }
  const c={};
  for(const e of S.ents) if(!e.dead) c[e.kind]=(c[e.kind]||0)+1;
  dbg.textContent=
`${S.scene} t${S.t.toFixed(1)} seed ${S.seed}
HEART ${S.hearts}${S.scene==="sewer"?`  SW heat ${swHeat().toFixed(2)} noise ${S.swNoise.toFixed(0)}/${CONFIG.sewer.noiseMax} spd ${swSpeed().toFixed(0)} dist ${S.swDist.toFixed(0)}`:""}
BGM ${BGM.playing()}本 ${BGM.state()||"none"}
AMB ${SFX.ambient()}
DENS ${dens().toFixed(2)} gap x${lerp(CONFIG.spawn.crowdGapFar,CONFIG.spawn.crowdGapNear,dens()).toFixed(2)}
RATE +${scoreRate().toFixed(0)}/s  enemy x${enemySpeed().toFixed(2)}
WATCH ${S.watches.length}/${CONFIG.lanes} 列 [${S.watches.map(w=>w.lane).sort().join(",")||"-"}] 叫び=${perScream()}列 densW ${densW().toFixed(2)}
SEEN  ${S.seen.toFixed(2)}/${CONFIG.watch.catch}
SCORE ${S.score} dist ${S.dist.toFixed(0)}
ENTS ${JSON.stringify(c)}  VIEW ${VW}x${VH}`;
}

try{ S.best=parseInt(localStorage.getItem("sugake_alley_best")||"0",10)||0; }catch(e){}
validatePatterns();
validateSewer();
validateSprites();
resize();
rnd=mulberry32(hashSeed("boot"));
requestAnimationFrame(frame);
</script>
